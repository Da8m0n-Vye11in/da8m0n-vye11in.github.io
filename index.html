<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MiniCraft</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #87CEEB;
            -webkit-user-select: none; user-select: none; touch-action: none;
            position: fixed; font-family: -apple-system, monospace; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
        #crosshair {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 24px; height: 24px; pointer-events: none; z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: white;
            box-shadow: 0 0 2px black;
        }
        #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
        #crosshair::after { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }
        .ui-element { z-index: 100; pointer-events: none; }
        #joystick {
            position: fixed; left: 30px; bottom: 40px;
            width: 140px; height: 140px; border-radius: 50%;
            background: rgba(255,255,255,0.28);
        }
        #joystick-knob {
            position: absolute; left: 50px; top: 50px;
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.95);
        }
        #jumpBtn {
            position: fixed; right: 30px; bottom: 60px;
            width: 90px; height: 90px; border-radius: 50%;
            background: rgba(33,150,243,0.85);
            color: white; font-size: 24px; font-weight: bold;
            text-align: center; line-height: 90px;
        }
        #blockBar {
            position: fixed; top: 20px; right: 20px; display: flex; gap: 10px;
        }
        .block-slot {
            width: 50px; height: 50px; border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.6);
        }
        .block-slot.selected { border-color: yellow; border-width: 3px; }
        #hud {
            position: fixed; top: 20px; left: 20px; color: white;
            font-family: ui-monospace, monospace; font-size: 12px;
            text-shadow: 1px 1px 2px black;
            line-height: 1.6; background: rgba(0,0,0,0.42);
            padding: 6px 10px; border-radius: 6px;
        }
        #resetBtn {
            position: fixed; top: 130px; left: 20px;
            padding: 8px 14px; background: rgba(200,50,50,0.85);
            color: white; font-size: 13px; border-radius: 6px;
            font-family: ui-monospace, monospace;
        }
        #longpressHint {
            position: fixed; pointer-events: none; z-index: 50;
            width: 80px; height: 80px; border-radius: 50%;
            border: 3px solid rgba(255,0,0,0.85);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.1s ease-out;
        }
        #longpressHint.active { transform: translate(-50%, -50%) scale(1); }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="hud" class="ui-element">加载中...</div>
    <div id="resetBtn" class="ui-element">重生成世界</div>
    <div id="blockBar" class="ui-element"></div>
    <div id="joystick" class="ui-element"><div id="joystick-knob"></div></div>
    <div id="jumpBtn" class="ui-element">跳</div>
    <div id="longpressHint"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
    <script>
    // ==========================================================
    // 配置
    // ==========================================================
    const BLOCK_CONFIG = {
        grass: { name: '草方块', color: '#5fa845' },
        dirt:  { name: '泥土',   color: '#8b5a2b' },
        stone: { name: '石头',   color: '#888888' },
        wood:  { name: '木头',   color: '#6b4423' },
    };

    const CONST = {
        GRAVITY: 22, JUMP_SPEED: 8.5, MOVE_SPEED: 6,
        PLAYER_W: 0.6, PLAYER_H: 1.8, EYE_H: 1.6,
        RENDER_RADIUS: 9,
        CAVE_DEPTH_LIMIT: -12,   // 洞穴最深到 y=-12
        SAVE_KEY: 'minicraft_save_v3',  // 版本号升级，旧存档会失效
        FIXED_DT: 1 / 60,
        LONG_PRESS_MS: 450, MOVE_THRESHOLD: 25, SWEEP_STEP: 0.05,
    };

    // ==========================================================
    // 纹理
    // ==========================================================
    function makeBlockTexture(hexColor) {
        const canvas = document.createElement('canvas');
        canvas.width = 16; canvas.height = 16;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = hexColor;
        ctx.fillRect(0, 0, 16, 16);
        for (let i = 0; i < 100; i++) {
            const x = (Math.random() * 16) | 0;
            const y = (Math.random() * 16) | 0;
            const a = (Math.random() * 0.35).toFixed(2);
            ctx.fillStyle = Math.random() > 0.5
                ? `rgba(0,0,0,${a})`
                : `rgba(255,255,255,${a})`;
            ctx.fillRect(x, y, 1, 1);
        }
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 1;
        ctx.strokeRect(0.5, 0.5, 15, 15);
        const tex = new THREE.CanvasTexture(canvas);
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        tex.anisotropy = 1;
        return tex;
    }

    const BLOCK_GEOMETRY = new THREE.BoxGeometry(1, 1, 1);
    const BLOCK_MATERIALS = {};
    for (const k in BLOCK_CONFIG) {
        BLOCK_MATERIALS[k] = new THREE.MeshLambertMaterial({
            map: makeBlockTexture(BLOCK_CONFIG[k].color),
        });
    }

    // ==========================================================
    // 3D 噪声（洞穴系统核心）
    // ==========================================================
    function hash3(x, y, z) {
        let n = x * 374761393 + y * 668265263 + z * 1274126177;
        n = (n ^ (n >> 13)) * 1274126177;
        return ((n ^ (n >> 16)) >>> 0) / 4294967295;
    }

    function smooth(t) { return t * t * (3 - 2 * t); }

    function noise3(x, y, z) {
        const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
        const xf = x - xi, yf = y - yi, zf = z - zi;
        const u = smooth(xf), v = smooth(yf), w = smooth(zf);

        const c000 = hash3(xi, yi, zi);
        const c100 = hash3(xi + 1, yi, zi);
        const c010 = hash3(xi, yi + 1, zi);
        const c110 = hash3(xi + 1, yi + 1, zi);
        const c001 = hash3(xi, yi, zi + 1);
        const c101 = hash3(xi + 1, yi, zi + 1);
        const c011 = hash3(xi, yi + 1, zi + 1);
        const c111 = hash3(xi + 1, yi + 1, zi + 1);

        const x00 = c000 * (1 - u) + c100 * u;
        const x10 = c010 * (1 - u) + c110 * u;
        const x01 = c001 * (1 - u) + c101 * u;
        const x11 = c011 * (1 - u) + c111 * u;

        const y0 = x00 * (1 - v) + x10 * v;
        const y1 = x01 * (1 - v) + x11 * v;

        return y0 * (1 - w) + y1 * w;
    }

    // ==========================================================
    // 地形生成
    // ==========================================================
    function terrainHeight(x, z) {
        return Math.round(
            Math.sin(x * 0.15) * 1.3 +
            Math.cos(z * 0.18) * 1.1 +
            Math.sin((x + z) * 0.10) * 0.9 +
            Math.cos((x - z) * 0.13) * 0.7 +
            Math.sin(x * 0.05) * 1.8 +
            Math.cos(z * 0.07) * 1.4
        );
    }

    // 洞穴判定：用两层 3D 噪声叠加
    function isCave(x, y, z) {
        if (y >= terrainHeight(x, z) - 2) return false;  // 地表 2 层完整
        if (y < CONST.CAVE_DEPTH_LIMIT) return false;

        // 两层不同频率的 3D 噪声，制造复杂的洞道
        const n1 = noise3(x * 0.09, y * 0.14, z * 0.09);
        const n2 = noise3(x * 0.18 + 50, y * 0.22 + 50, z * 0.18 + 50) * 0.5;
        const total = n1 + n2;

        // 越靠近地表，洞穴越难生成（避免地表塌陷）
        const depth = terrainHeight(x, z) - y;
        const depthBonus = Math.min(depth / 20, 0.15);

        return total + depthBonus > 0.75;
    }

    function generateBlock(x, y, z) {
        const h = terrainHeight(x, z);
        if (y > h) return null;

        // 洞穴（只在地下且远离地表）
        if (y < h - 2 && isCave(x, y, z)) return null;

        if (y === h) return 'grass';
        if (y === h - 1) return 'dirt';
        if (y >= h - 4) return 'stone';
        if (y >= CONST.CAVE_DEPTH_LIMIT - 2) return 'stone';
        return null;
    }

    // ==========================================================
    // 世界数据
    // ==========================================================
    const modifications = new Map();
    const worldKey = (x, y, z) => `${x},${y},${z}`;

    function getBlockType(x, y, z) {
        const k = worldKey(x, y, z);
        if (modifications.has(k)) return modifications.get(k);
        return generateBlock(x, y, z);
    }

    function isSolid(x, y, z) {
        return getBlockType(x, y, z) !== null;
    }

    function setBlock(x, y, z, type) {
        modifications.set(worldKey(x, y, z), type);
    }

    // ==========================================================
    // 场景
    // ==========================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 20, 55);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.domElement.style.cssText = 'position:fixed;top:0;left:0;z-index:1;';
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(30, 50, 30);
    scene.add(sun);
    // 从下方补一点光，避免洞穴完全漆黑
    const fill = new THREE.DirectionalLight(0xffffff, 0.2);
    fill.position.set(-30, -20, -30);
    scene.add(fill);

    // ==========================================================
    // 动态渲染
    // ==========================================================
    const renderedMeshes = new Map();

    function addMeshAt(x, y, z, type) {
        const k = worldKey(x, y, z);
        if (renderedMeshes.has(k)) return;
        const mesh = new THREE.Mesh(BLOCK_GEOMETRY, BLOCK_MATERIALS[type]);
        mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
        mesh.userData = { x, y, z, type };
        mesh.matrixAutoUpdate = false;
        mesh.updateMatrix();
        scene.add(mesh);
        renderedMeshes.set(k, mesh);
    }

    function removeMeshAt(x, y, z) {
        const k = worldKey(x, y, z);
        const mesh = renderedMeshes.get(k);
        if (mesh) {
            scene.remove(mesh);
            renderedMeshes.delete(k);
        }
    }

    function updateRender() {
        const cx = Math.floor(player.pos.x);
        const cz = Math.floor(player.pos.z);
        const cy = Math.floor(player.pos.y);
        const needed = new Set();

        const yMinGlobal = Math.max(CONST.CAVE_DEPTH_LIMIT - 2, cy - 10);
        const yMaxGlobal = cy + 10;

        for (let dx = -CONST.RENDER_RADIUS; dx <= CONST.RENDER_RADIUS; dx++) {
            for (let dz = -CONST.RENDER_RADIUS; dz <= CONST.RENDER_RADIUS; dz++) {
                const x = cx + dx;
                const z = cz + dz;
                const h = terrainHeight(x, z);

                // 地表（h-4 到 h，永远渲染）
                for (let y = h; y >= h - 4; y--) {
                    const k = worldKey(x, y, z);
                    const type = getBlockType(x, y, z);
                    if (type !== null) {
                        needed.add(k);
                        if (!renderedMeshes.has(k)) addMeshAt(x, y, z, type);
                    }
                }

                // 地下（只渲染玩家附近 y 范围）
                const yTop = Math.min(h - 5, yMaxGlobal);
                const yBot = Math.max(CONST.CAVE_DEPTH_LIMIT - 2, yMinGlobal);
                for (let y = yTop; y >= yBot; y--) {
                    const k = worldKey(x, y, z);
                    if (needed.has(k)) continue;
                    const type = getBlockType(x, y, z);
                    if (type !== null) {
                        needed.add(k);
                        if (!renderedMeshes.has(k)) addMeshAt(x, y, z, type);
                    }
                }
            }
        }

        // 玩家修改的方块
        for (const [k, type] of modifications) {
            if (type === null) continue;
            const [x, y, z] = k.split(',').map(Number);
            if (Math.abs(x - cx) <= CONST.RENDER_RADIUS && Math.abs(z - cz) <= CONST.RENDER_RADIUS) {
                needed.add(k);
                if (!renderedMeshes.has(k)) addMeshAt(x, y, z, type);
            }
        }

        // 卸载
        for (const k of [...renderedMeshes.keys()]) {
            if (!needed.has(k)) {
                scene.remove(renderedMeshes.get(k));
                renderedMeshes.delete(k);
            }
        }
    }

    // ==========================================================
    // 玩家
    // ==========================================================
    const spawnH = terrainHeight(0, 0);
    const player = {
        pos: new THREE.Vector3(0.5, spawnH + 2, 0.5),
        yaw: 0, pitch: -0.3, vy: 0, onGround: false,
    };

    // ==========================================================
    // 碰撞
    // ==========================================================
    function isColliding(pos) {
        const minX = pos.x - CONST.PLAYER_W / 2;
        const maxX = pos.x + CONST.PLAYER_W / 2;
        const minY = pos.y;
        const maxY = pos.y + CONST.PLAYER_H;
        const minZ = pos.z - CONST.PLAYER_W / 2;
        const maxZ = pos.z + CONST.PLAYER_W / 2;

        const x0 = Math.floor(minX), x1 = Math.floor(maxX);
        const y0 = Math.floor(minY), y1 = Math.floor(maxY);
        const z0 = Math.floor(minZ), z1 = Math.floor(maxZ);

        for (let x = x0; x <= x1; x++)
            for (let y = y0; y <= y1; y++)
                for (let z = z0; z <= z1; z++)
                    if (isSolid(x, y, z) &&
                        maxX > x && minX < x + 1 &&
                        maxY > y && minY < y + 1 &&
                        maxZ > z && minZ < z + 1)
                        return true;
        return false;
    }

    function exactGroundY(pos) {
        const halfW = CONST.PLAYER_W / 2;
        const x0 = Math.floor(pos.x - halfW + 0.001);
        const x1 = Math.floor(pos.x + halfW - 0.001);
        const z0 = Math.floor(pos.z - halfW + 0.001);
        const z1 = Math.floor(pos.z + halfW - 0.001);

        let highest = -Infinity;
        for (let x = x0; x <= x1; x++) {
            for (let z = z0; z <= z1; z++) {
                for (let y = Math.floor(pos.y + CONST.PLAYER_H); y >= CONST.CAVE_DEPTH_LIMIT - 5; y--) {
                    if (isSolid(x, y, z)) {
                        if (y + 1 > highest) highest = y + 1;
                        break;
                    }
                }
            }
        }
        return highest;
    }

    function sweepMove(axis, dist) {
        const step = CONST.SWEEP_STEP;
        const n = Math.max(1, Math.ceil(Math.abs(dist) / step));
        const s = dist / n;
        for (let i = 0; i < n; i++) {
            const test = {
                x: player.pos.x + (axis === 'x' ? s : 0),
                y: player.pos.y + (axis === 'y' ? s : 0),
                z: player.pos.z + (axis === 'z' ? s : 0),
            };
            if (isColliding(test)) return true;
            player.pos.x = test.x;
            player.pos.y = test.y;
            player.pos.z = test.z;
        }
        return false;
    }

    // ==========================================================
    // 射线
    // ==========================================================
    const raycaster = new THREE.Raycaster();
    raycaster.far = 6;

    function raycast() {
        const dir = new THREE.Vector3(
            -Math.sin(player.yaw) * Math.cos(player.pitch),
            Math.sin(player.pitch),
            -Math.cos(player.yaw) * Math.cos(player.pitch)
        );
        raycaster.set(camera.position, dir);
        const hits = raycaster.intersectObjects([...renderedMeshes.values()], false);
        if (hits.length === 0) return null;
        const h = hits[0];
        return { block: h.object.userData, normal: h.face.normal.clone() };
    }

    // ==========================================================
    // 放置 / 破坏
    // ==========================================================
    let lastAction = '初始化';
    const flash = msg => { lastAction = msg; };

    function tryPlace() {
        const hit = raycast();
        if (!hit) return flash('放 ✗ 没对准');
        const { x, y, z } = hit.block;
        const n = hit.normal;
        const tx = x + n.x, ty = y + n.y, tz = z + n.z;

        if (isSolid(tx, ty, tz)) return flash('放 ✗ 已占用');

        const pMinX = player.pos.x - CONST.PLAYER_W / 2;
        const pMaxX = player.pos.x + CONST.PLAYER_W / 2;
        const pMinY = player.pos.y;
        const pMaxY = player.pos.y + CONST.PLAYER_H;
        const pMinZ = player.pos.z - CONST.PLAYER_W / 2;
        const pMaxZ = player.pos.z + CONST.PLAYER_W / 2;

        if (pMaxX > tx && pMinX < tx + 1 &&
            pMaxY > ty && pMinY < ty + 1 &&
            pMaxZ > tz && pMinZ < tz + 1)
            return flash('放 ✗ 卡住自己');

        setBlock(tx, ty, tz, currentBlock);
        addMeshAt(tx, ty, tz, currentBlock);
        flash(`放 ✓ ${tx},${ty},${tz}`);
        scheduleSave();
    }

    function tryBreak() {
        const hit = raycast();
        if (!hit) return flash('挖 ✗ 没对准');
        const { x, y, z } = hit.block;

        const footX = Math.floor(player.pos.x);
        const footZ = Math.floor(player.pos.z);
        const footY = Math.floor(player.pos.y - 0.05);
        if (x === footX && y === footY && z === footZ)
            return flash('挖 ✗ 不能挖脚下');

        setBlock(x, y, z, null);
        removeMeshAt(x, y, z);
        flash(`挖 ✓ ${x},${y},${z}`);
        scheduleSave();
    }

    // ==========================================================
    // 存档
    // ==========================================================
    let saveTimer = null;
    function scheduleSave() {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(save, 500);
    }

    function save() {
        try {
            localStorage.setItem(CONST.SAVE_KEY, JSON.stringify({
                modifications: [...modifications],
                player: {
                    x: player.pos.x, y: player.pos.y, z: player.pos.z,
                    yaw: player.yaw, pitch: player.pitch,
                },
                currentBlock,
            }));
        } catch (e) { console.warn('存档失败', e); }
    }

    function load() {
        try {
            const raw = localStorage.getItem(CONST.SAVE_KEY);
            if (!raw) return false;
            const data = JSON.parse(raw);
            if (data.modifications) for (const [k, v] of data.modifications) modifications.set(k, v);
            if (data.player) {
                player.pos.set(data.player.x, data.player.y, data.player.z);
                player.yaw = data.player.yaw || 0;
                player.pitch = data.player.pitch || 0;
            }
            if (data.currentBlock) currentBlock = data.currentBlock;
            return true;
        } catch (e) { return false; }
    }

    function resetWorld() {
        localStorage.removeItem(CONST.SAVE_KEY);
        modifications.clear();
        for (const mesh of renderedMeshes.values()) scene.remove(mesh);
        renderedMeshes.clear();
        const sh = terrainHeight(0, 0);
        player.pos.set(0.5, sh + 2, 0.5);
        player.vy = 0;
        player.onGround = false;
        player.yaw = 0;
        player.pitch = -0.3;
        updateRender();
        flash('✓ 世界已重置');
    }

    // ==========================================================
    // 输入
    // ==========================================================
    let moveInput = { x: 0, y: 0 };
    let jumpRequested = false;
    let currentBlock = 'grass';

    const blockBar = document.getElementById('blockBar');
    for (const k in BLOCK_CONFIG) {
        const el = document.createElement('div');
        el.className = 'block-slot' + (k === currentBlock ? ' selected' : '');
        el.dataset.type = k;
        el.style.background = BLOCK_CONFIG[k].color;
        blockBar.appendChild(el);
    }

    const joystick = document.getElementById('joystick');
    const knob = document.getElementById('joystick-knob');
    const hud = document.getElementById('hud');
    const hint = document.getElementById('longpressHint');
    let joyCenter = { x: 0, y: 0 };

    function joyMove(x, y) {
        const dx = x - joyCenter.x;
        const dy = y - joyCenter.y;
        const dist = Math.hypot(dx, dy);
        const maxDist = 50;
        const clamped = Math.min(dist, maxDist);
        const angle = Math.atan2(dy, dx);
        const kx = Math.cos(angle) * clamped;
        const ky = Math.sin(angle) * clamped;
        knob.style.transform = `translate(${kx}px,${ky}px)`;
        moveInput.x = kx / maxDist;
        moveInput.y = ky / maxDist;
    }

    function joyEnd() {
        moveInput = { x: 0, y: 0 };
        knob.style.transform = 'translate(0,0)';
    }

    const pointInCircle = (x, y, r) => {
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        return Math.hypot(x - cx, y - cy) <= Math.min(r.width, r.height) / 2;
    };
    const pointInRect = (x, y, r) => x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;

    function getUIElements() {
        return {
            jump: document.getElementById('jumpBtn').getBoundingClientRect(),
            joystick: joystick.getBoundingClientRect(),
            reset: document.getElementById('resetBtn').getBoundingClientRect(),
            slots: [...document.querySelectorAll('.block-slot')].map(el => ({
                el, rect: el.getBoundingClientRect(), type: el.dataset.type
            })),
        };
    }

    const activeTouches = new Map();

    document.addEventListener('touchstart', e => {
        const ui = getUIElements();

        for (const t of e.changedTouches) {
            const x = t.clientX, y = t.clientY;

            if (pointInRect(x, y, ui.reset)) {
                if (confirm('确定清空存档并重新生成世界？')) resetWorld();
                activeTouches.set(t.identifier, { type: 'reset' });
                continue;
            }
            if (pointInCircle(x, y, ui.jump)) {
                jumpRequested = true;
                flash('跳');
                activeTouches.set(t.identifier, { type: 'jump' });
                continue;
            }
            let slotHit = null;
            for (const s of ui.slots) {
                if (pointInCircle(x, y, s.rect)) { slotHit = s; break; }
            }
            if (slotHit) {
                document.querySelectorAll('.block-slot').forEach(s => s.classList.remove('selected'));
                slotHit.el.classList.add('selected');
                currentBlock = slotHit.type;
                flash(`选择: ${BLOCK_CONFIG[currentBlock].name}`);
                activeTouches.set(t.identifier, { type: 'slot' });
                continue;
            }
            if (pointInCircle(x, y, ui.joystick)) {
                const r = joystick.getBoundingClientRect();
                joyCenter = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
                joyMove(x, y);
                activeTouches.set(t.identifier, { type: 'joystick' });
                continue;
            }

            const state = {
                type: 'empty', startX: x, startY: y, lastX: x, lastY: y,
                moved: false, longPressFired: false, longPressTimer: null,
            };
            state.longPressTimer = setTimeout(() => {
                if (!state.moved) {
                    state.longPressFired = true;
                    tryBreak();
                    hint.style.left = x + 'px';
                    hint.style.top = y + 'px';
                    hint.classList.add('active');
                    setTimeout(() => hint.classList.remove('active'), 150);
                }
            }, CONST.LONG_PRESS_MS);
            activeTouches.set(t.identifier, state);
        }
        e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchmove', e => {
        for (const t of e.changedTouches) {
            const info = activeTouches.get(t.identifier);
            if (!info) continue;

            if (info.type === 'joystick') {
                joyMove(t.clientX, t.clientY);
            } else if (info.type === 'empty') {
                const dx = t.clientX - info.lastX;
                const dy = t.clientY - info.lastY;
                const totalMove = Math.hypot(t.clientX - info.startX, t.clientY - info.startY);
                if (totalMove > CONST.MOVE_THRESHOLD) {
                    info.moved = true;
                    if (info.longPressTimer) { clearTimeout(info.longPressTimer); info.longPressTimer = null; }
                }
                if (info.moved) {
                    player.yaw -= dx * 0.005;
                    player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch - dy * 0.005));
                }
                info.lastX = t.clientX;
                info.lastY = t.clientY;
            }
        }
        e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchend', e => {
        for (const t of e.changedTouches) {
            const info = activeTouches.get(t.identifier);
            if (!info) continue;
            if (info.type === 'joystick') joyEnd();
            else if (info.type === 'empty') {
                if (info.longPressTimer) clearTimeout(info.longPressTimer);
                if (!info.moved && !info.longPressFired) tryPlace();
            }
            activeTouches.delete(t.identifier);
        }
    });

    document.addEventListener('touchcancel', e => {
        for (const t of e.changedTouches) {
            const info = activeTouches.get(t.identifier);
            if (!info) continue;
            if (info.type === 'joystick') joyEnd();
            if (info.longPressTimer) clearTimeout(info.longPressTimer);
            activeTouches.delete(t.identifier);
        }
    });

    // ==========================================================
    // 物理
    // ==========================================================
    function physicsStep(dt) {
        const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
        const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
        const move = new THREE.Vector3();
        move.addScaledVector(forward, -moveInput.y);
        move.addScaledVector(right, moveInput.x);
        if (move.length() > 1) move.normalize();

        sweepMove('x', move.x * CONST.MOVE_SPEED * dt);
        sweepMove('z', move.z * CONST.MOVE_SPEED * dt);

        if (jumpRequested && player.onGround) {
            player.vy = CONST.JUMP_SPEED;
            player.onGround = false;
        }
        jumpRequested = false;

        player.vy -= CONST.GRAVITY * dt;
        player.vy = Math.max(player.vy, -30);

        const hit = sweepMove('y', player.vy * dt);
        if (hit) {
            if (player.vy < 0) {
                const g = exactGroundY(player.pos);
                if (g > -Infinity && g <= player.pos.y + 0.1) player.pos.y = g;
                player.vy = 0;
                player.onGround = true;
            } else {
                player.vy = 0;
                player.onGround = false;
            }
        } else {
            const below = { x: player.pos.x, y: player.pos.y - 0.05, z: player.pos.z };
            player.onGround = isColliding(below);
            if (player.onGround) {
                const g = exactGroundY(player.pos);
                if (g > -Infinity && g <= player.pos.y + 0.1) player.pos.y = g;
                player.vy = 0;
            }
        }
    }

    // ==========================================================
    // 主循环
    // ==========================================================
    let lastTime = performance.now();
    let accumulator = 0;
    let fpsTimer = 0, fpsCount = 0, renderTimer = 0, hudTimer = 0;

    function update() {
        const now = performance.now();
        const frameTime = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        accumulator += frameTime;
        let steps = 0;
        while (accumulator >= CONST.FIXED_DT && steps < 5) {
            physicsStep(CONST.FIXED_DT);
            accumulator -= CONST.FIXED_DT;
            steps++;
        }

        if (player.pos.y < -40) {
            const sh = terrainHeight(0, 0);
            player.pos.set(0.5, sh + 2, 0.5);
            player.vy = 0;
            player.onGround = false;
        }

        renderTimer += frameTime;
        if (renderTimer > 0.15) {
            renderTimer = 0;
            updateRender();
        }

        camera.position.set(player.pos.x, player.pos.y + CONST.EYE_H, player.pos.z);
        camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
        renderer.render(scene, camera);

        fpsCount++; fpsTimer += frameTime; hudTimer += frameTime;
        if (hudTimer >= 0.5) {
            hud.innerHTML =
                `FPS: ${Math.round(fpsCount / fpsTimer)}<br>` +
                `位置: ${player.pos.x.toFixed(1)}, ${player.pos.y.toFixed(1)}, ${player.pos.z.toFixed(1)}<br>` +
                `状态: ${player.onGround ? '着地' : '空中'} | 方块: ${renderedMeshes.size}<br>` +
                `操作: ${lastAction}`;
            fpsCount = 0; fpsTimer = 0; hudTimer = 0;
        }

        requestAnimationFrame(update);
    }

    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });
    window.addEventListener('beforeunload', save);

    if (load()) flash('✓ 已读取存档');
    updateRender();
    update();
    </script>
</body>
</html>

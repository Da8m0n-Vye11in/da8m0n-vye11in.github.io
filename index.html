<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MiniCraft</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #87CEEB;
            -webkit-user-select: none; user-select: none; touch-action: none;
            position: fixed; font-family: ui-monospace, "Menlo", monospace; }
        #gameCanvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 28px; height: 28px; pointer-events: none; z-index: 10; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; box-shadow: 0 0 3px black; }
        #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
        #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
        #hud { position: fixed; top: 16px; left: 16px; color: white; font-size: 11px; line-height: 1.55;
            text-shadow: 1px 1px 2px black; background: rgba(0,0,0,0.5);
            padding: 6px 10px; border-radius: 4px; z-index: 100; pointer-events: none; }
        #topBar { position: fixed; top: 16px; right: 16px; display: flex; gap: 6px; z-index: 150; }
        .mc-btn { padding: 10px 14px; background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.4); border-radius: 4px;
            color: white; font-size: 14px; font-family: inherit; cursor: pointer; }
        .mc-btn:active { background: rgba(80,80,80,0.85); }
        #hotbarWrapper { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 8px; z-index: 100; pointer-events: none; }
        #menuBtn3 { width: 50px; height: 50px; border-radius: 6px;
            background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.35);
            color: white; font-size: 22px; text-align: center; line-height: 46px;
            cursor: pointer; pointer-events: auto; }
        #menuBtn3:active { background: rgba(80,80,80,0.85); }
        #hotbar { display: flex; gap: 3px; padding: 4px; background: rgba(0,0,0,0.55);
            border: 2px solid rgba(255,255,255,0.35); border-radius: 4px; }
        .hotbar-slot { width: 46px; height: 46px; border-radius: 2px;
            background: rgba(80,80,80,0.6); border: 2px solid rgba(255,255,255,0.2);
            position: relative; }
        .hotbar-slot.selected { border: 3px solid #fff; box-shadow: 0 0 8px rgba(255,255,255,0.8); }
        .hotbar-slot.empty { opacity: 0.3; }
        .hotbar-count { position: absolute; bottom: 1px; right: 3px;
            font-size: 11px; color: white; text-shadow: 1px 1px 2px black; font-weight: bold; }
        #joystick { position: fixed; left: 30px; bottom: 100px; width: 130px; height: 130px; border-radius: 50%;
            background: rgba(255,255,255,0.22); z-index: 100; pointer-events: none; }
        #joystick-knob { position: absolute; left: 45px; top: 45px; width: 40px; height: 40px;
            border-radius: 50%; background: rgba(255,255,255,0.95); }
        #jumpBtn { position: fixed; right: 30px; bottom: 130px; width: 84px; height: 84px;
            border-radius: 50%; background: rgba(80,180,100,0.85);
            border: 3px solid rgba(255,255,255,0.5); color: white;
            font-size: 20px; font-weight: bold; text-align: center; line-height: 78px;
            z-index: 100; pointer-events: none; user-select: none; }
        #downBtn { position: fixed; right: 30px; bottom: 40px; width: 84px; height: 84px;
            border-radius: 50%; background: rgba(180,80,80,0.85);
            border: 3px solid rgba(255,255,255,0.5); color: white;
            font-size: 22px; font-weight: bold; text-align: center; line-height: 78px;
            z-index: 100; pointer-events: none; display: none; user-select: none; }
        #longpressHint { position: fixed; pointer-events: none; z-index: 50;
            width: 80px; height: 80px; border-radius: 50%;
            border: 3px solid rgba(255,60,60,0.9);
            transform: translate(-50%,-50%) scale(0); transition: transform 0.12s; }
        #longpressHint.active { transform: translate(-50%,-50%) scale(1); }
        #toast { position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%);
            padding: 14px 24px; background: rgba(0,0,0,0.8); color: white;
            font-size: 15px; border: 2px solid rgba(255,255,255,0.4); border-radius: 6px;
            z-index: 500; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
        #toast.show { opacity: 1; }
        .panel { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 360px; max-width: 92vw; max-height: 80vh; overflow-y: auto;
            background: rgba(30,30,40,0.97); border: 3px solid rgba(255,255,255,0.5);
            border-radius: 8px; color: white; padding: 18px; z-index: 300; display: none; font-size: 13px; }
        .panel.show { display: block; }
        .panel h3 { margin-bottom: 12px; text-align: center; font-size: 16px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px; gap: 10px; }
        .setting-row label { flex: 1; }
        .setting-row input[type=range] { flex: 1.2; touch-action: auto; }
        .setting-row .val { width: 36px; text-align: right; color: #ffd966; }
        .setting-row select { padding: 6px; border-radius: 4px; background: #222;
            color: white; border: 1px solid #666; font-family: inherit; font-size: 13px; }
        .setting-row input[type=checkbox] { width: 22px; height: 22px; }
        .panel-btn { display: block; width: 100%; padding: 12px; margin-top: 10px;
            background: rgba(80,120,180,0.9); color: white;
            border: 2px solid rgba(255,255,255,0.35); border-radius: 4px;
            font-size: 14px; font-family: inherit; cursor: pointer; }
        .panel-btn:active { background: rgba(100,140,200,0.9); }
        .panel-btn.danger { background: rgba(180,80,80,0.9); }
        .panel-btn:disabled { background: rgba(80,80,80,0.5); cursor: not-allowed; }
        #inventoryGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .inv-slot { aspect-ratio: 1; border-radius: 4px;
            border: 2px solid rgba(255,255,255,0.3);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 10px; text-shadow: 1px 1px 1px black; cursor: pointer; position: relative; }
        .inv-slot.selected { border-color: #ffd966; box-shadow: 0 0 8px #ffd966; }
        .inv-slot:active { transform: scale(0.95); }
        .inv-slot .count { position: absolute; bottom: 2px; right: 3px;
            font-size: 11px; font-weight: bold; color: white; }
        #craftList { display: flex; flex-direction: column; gap: 8px; }
        .craft-row { display: flex; align-items: center; gap: 10px; padding: 10px;
            background: rgba(60,60,80,0.5); border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.2); }
        .craft-row .craft-icon { width: 40px; height: 40px; border-radius: 4px;
            border: 2px solid rgba(255,255,255,0.3); }
        .craft-row .craft-info { flex: 1; font-size: 12px; }
        .craft-row .craft-btn { padding: 8px 14px;
            background: rgba(80,150,80,0.9); color: white;
            border: 2px solid rgba(255,255,255,0.3); border-radius: 4px;
            font-size: 13px; cursor: pointer; }
        .craft-row .craft-btn:disabled { background: rgba(80,80,80,0.5); cursor: not-allowed; }
        #miniMenu { position: fixed; bottom: 82px; left: 50%; transform: translateX(-120px);
            background: rgba(30,30,40,0.97); border: 3px solid rgba(255,255,255,0.5);
            border-radius: 8px; padding: 8px; z-index: 200; display: none;
            flex-direction: column; gap: 6px; }
        #miniMenu.show { display: flex; }
        #miniMenu .mini-btn { padding: 10px 20px; background: rgba(80,120,180,0.9);
            color: white; border: 2px solid rgba(255,255,255,0.3); border-radius: 4px;
            font-size: 13px; cursor: pointer; font-family: inherit; white-space: nowrap; }
        #miniMenu .mini-btn:active { background: rgba(100,140,200,0.9); }
        #fileInput { position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; opacity: 0; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="crosshair"></div>
    <div id="hud">加载中...</div>

    <div id="topBar">
        <div class="mc-btn" id="settingsBtn">⚙️</div>
        <div class="mc-btn" id="saveBtn">💾</div>
        <div class="mc-btn" id="loadBtn">📂</div>
        <div class="mc-btn" id="resetBtn">🔄</div>
    </div>

    <div id="hotbarWrapper">
        <div id="menuBtn3">⋯</div>
        <div id="hotbar"></div>
    </div>

    <div id="miniMenu">
        <button class="mini-btn" id="openInventoryBtn">🎒 背包</button>
        <button class="mini-btn" id="openCraftBtn">🔨 合成</button>
    </div>

    <div id="joystick"><div id="joystick-knob"></div></div>
    <div id="jumpBtn">跳</div>
    <div id="downBtn">▼</div>
    <div id="longpressHint"></div>
    <div id="toast"></div>

    <div class="panel" id="settingsPanel">
        <h3>⚙️ 设置</h3>
        <div class="setting-row"><label>世界类型</label>
            <select id="worldTypeSelect">
                <option value="normal">普通世界</option>
                <option value="flat">超平坦</option>
                <option value="forest">全森林</option>
                <option value="plains">全平原</option>
                <option value="desert">全沙漠</option>
            </select></div>
        <div class="setting-row"><label>时间</label>
            <select id="dayNightSelect">
                <option value="cycle">循环</option>
                <option value="day">白天</option>
                <option value="night">夜晚</option>
            </select></div>
        <div class="setting-row"><label>渲染距离</label>
            <input type="range" id="renderDistSlider" min="4" max="14" value="7">
            <span class="val" id="renderDistVal">7</span></div>
        <div class="setting-row"><label>亮度</label>
            <input type="range" id="brightnessSlider" min="30" max="150" value="100">
            <span class="val" id="brightnessVal">100</span></div>
        <div class="setting-row"><label>移动速度</label>
            <input type="range" id="speedSlider" min="3" max="15" value="6" step="0.5">
            <span class="val" id="speedVal">6</span></div>
        <div class="setting-row"><label>飞行模式</label>
            <input type="checkbox" id="flyToggle"></div>
        <div class="setting-row"><label>旁观模式（X光透视）</label>
            <input type="checkbox" id="spectatorToggle"></div>
        <button class="panel-btn" id="closeSettings">关闭</button>
        <button class="panel-btn danger" id="applyWorldBtn">应用世界类型（会重置世界）</button>
    </div>

    <div class="panel" id="inventoryPanel">
        <h3>🎒 背包</h3>
        <div id="inventoryGrid"></div>
        <button class="panel-btn" id="closeInventory">关闭</button>
    </div>

    <div class="panel" id="craftPanel">
        <h3>🔨 合成</h3>
        <div id="craftList"></div>
        <button class="panel-btn" id="closeCraft">关闭</button>
    </div>

    <input type="file" id="fileInput" accept=".json,application/json">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
    <script src="config.js"></script>
    <script src="noise.js"></script>
    <script src="terrain.js"></script>
    <script src="world.js"></script>
    <script src="player.js"></script>
    <script src="weather.js"></script>
    <script src="ui.js"></script>
    <script src="main.js"></script>
</body>
</html>

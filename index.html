<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MiniCraft</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; background: #87CEEB;
            -webkit-user-select: none; user-select: none; touch-action: none;
            position: fixed; font-family: ui-monospace, "Menlo", monospace;
        }
        #gameCanvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #hud {
            position: fixed; top: 16px; left: 16px;
            color: white; font-size: 11px; line-height: 1.55;
            text-shadow: 1px 1px 2px black;
            background: rgba(0,0,0,0.42); padding: 6px 10px; border-radius: 4px;
            z-index: 100; pointer-events: none;
        }
        #hotbar {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 4px; padding: 4px;
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 4px; z-index: 100; pointer-events: none;
        }
        .hotbar-slot {
            width: 52px; height: 52px; border-radius: 2px;
            background: rgba(80, 80, 80, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }
        .hotbar-slot.selected {
            border: 3px solid #ffffff;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }
        .hotbar-slot .label {
            position: absolute; bottom: 1px; right: 3px;
            font-size: 9px; color: rgba(255,255,255,0.85);
        }
        #topBar {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 6px; z-index: 100; pointer-events: none;
        }
        .mc-btn {
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 4px;
            color: white; font-size: 13px; font-family: inherit;
            white-space: nowrap;
        }
        #joystick {
            position: fixed; left: 30px; bottom: 100px;
            width: 130px; height: 130px; border-radius: 50%;
            background: rgba(255,255,255,0.22);
            z-index: 100; pointer-events: none;
        }
        #joystick-knob {
            position: absolute; left: 45px; top: 45px;
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.95);
        }
        #jumpBtn {
            position: fixed; right: 30px; bottom: 130px;
            width: 84px; height: 84px; border-radius: 50%;
            background: rgba(80, 180, 100, 0.85);
            border: 3px solid rgba(255,255,255,0.5);
            color: white; font-size: 20px; font-weight: bold;
            text-align: center; line-height: 78px;
            z-index: 100; pointer-events: none;
        }
        #longpressHint {
            position: fixed; pointer-events: none; z-index: 50;
            width: 80px; height: 80px; border-radius: 50%;
            border: 3px solid rgba(255, 60, 60, 0.9);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.12s ease-out;
        }
        #longpressHint.active { transform: translate(-50%, -50%) scale(1); }
        #toast {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 14px 24px;
            background: rgba(0,0,0,0.75);
            color: white; font-size: 15px;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 6px;
            z-index: 200; pointer-events: none;
            opacity: 0; transition: opacity 0.25s;
        }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="hud">加载中...</div>
    <div id="topBar">
        <div class="mc-btn" id="saveBtn">💾 导出</div>
        <div class="mc-btn" id="loadBtn">📂 导入</div>
        <div class="mc-btn" id="resetBtn">🔄 新世界</div>
    </div>
    <div id="hotbar"></div>
    <div id="joystick"><div id="joystick-knob"></div></div>
    <div id="jumpBtn">跳</div>
    <div id="longpressHint"></div>
    <div id="toast"></div>
    <input type="file" id="fileInput" accept=".json" style="display:none">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
    <script>
    const BLOCK_CONFIG = {
        grass: { name: '草方块', color: '#5fa845' },
        dirt:  { name: '泥土',   color: '#8b5a2b' },
        stone: { name: '石头',   color: '#888888' },
        wood:  { name: '木头',   color: '#6b4423' },
    };
    const HOTBAR_ORDER = ['grass', 'dirt', 'stone', 'wood'];

    const CONST = {
        GRAVITY: 22, JUMP_SPEED: 8.5, MOVE_SPEED: 6,
        PLAYER_W: 0.6, PLAYER_H: 1.8, EYE_H: 1.6,
        RENDER_RADIUS: 9, CAVE_DEPTH_LIMIT: -12,
        SAVE_KEY: 'minicraft_v6',
        FIXED_DT: 1 / 60,
        LONG_PRESS_MS: 450, MOVE_THRESHOLD: 25, SWEEP_STEP: 0.05,
        // ★ 更保守的 pitch 上限，避免接近 ±90° 的奇异点
        PITCH_LIMIT: 1.45,
    };

    // ============ 纹理 ============
    function makeBlockTexture(hexColor) {
        const c = document.createElement('canvas');
        c.width = c.height = 16;
        const ctx = c.getContext('2d');
        ctx.fillStyle = hexColor;
        ctx.fillRect(0, 0, 16, 16);
        for (let i = 0; i < 100; i++) {
            const x = (Math.random() * 16) | 0, y = (Math.random() * 16) | 0;
            const a = (Math.random() * 0.35).toFixed(2);
            ctx.fillStyle = Math.random() > 0.5 ? `rgba(0,0,0,${a})` : `rgba(255,255,255,${a})`;
            ctx.fillRect(x, y, 1, 1);
        }
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.strokeRect(0.5, 0.5, 15, 15);
        const tex = new THREE.CanvasTexture(c);
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        return tex;
    }

    const BLOCK_GEOMETRY = new THREE.BoxGeometry(1, 1, 1);
    const BLOCK_MATERIALS = {};
    for (const k in BLOCK_CONFIG) {
        BLOCK_MATERIALS[k] = new THREE.MeshLambertMaterial({ map: makeBlockTexture(BLOCK_CONFIG[k].color) });
    }

    // ============ 噪声 & 地形 ============
    function hash3(x, y, z) {
        let n = x * 374761393 + y * 668265263 + z * 1274126177;
        n = (n ^ (n >> 13)) * 1274126177;
        return ((n ^ (n >> 16)) >>> 0) / 4294967295;
    }
    const smooth = t => t * t * (3 - 2 * t);
    function noise3(x, y, z) {
        const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
        const u = smooth(x - xi), v = smooth(y - yi), w = smooth(z - zi);
        const c000 = hash3(xi, yi, zi),     c100 = hash3(xi+1, yi, zi);
        const c010 = hash3(xi, yi+1, zi),   c110 = hash3(xi+1, yi+1, zi);
        const c001 = hash3(xi, yi, zi+1),   c101 = hash3(xi+1, yi, zi+1);
        const c011 = hash3(xi, yi+1, zi+1), c111 = hash3(xi+1, yi+1, zi+1);
        const x00 = c000*(1-u) + c100*u, x10 = c010*(1-u) + c110*u;
        const x01 = c001*(1-u) + c101*u, x11 = c011*(1-u) + c111*u;
        return (x00*(1-v) + x10*v)*(1-w) + (x01*(1-v) + x11*v)*w;
    }
    function terrainHeight(x, z) {
        return Math.round(
            Math.sin(x * 0.15) * 1.3 + Math.cos(z * 0.18) * 1.1 +
            Math.sin((x + z) * 0.10) * 0.9 + Math.cos((x - z) * 0.13) * 0.7 +
            Math.sin(x * 0.05) * 1.8 + Math.cos(z * 0.07) * 1.4
        );
    }
    function isCave(x, y, z) {
        if (y >= terrainHeight(x, z) - 2) return false;
        if (y < CONST.CAVE_DEPTH_LIMIT) return false;
        const n1 = noise3(x * 0.09, y * 0.14, z * 0.09);
        const n2 = noise3(x * 0.18 + 50, y * 0.22 + 50, z * 0.18 + 50) * 0.5;
        const depth = terrainHeight(x, z) - y;
        return n1 + n2 + Math.min(depth / 20, 0.15) > 0.75;
    }
    function generateBlock(x, y, z) {
        const h = terrainHeight(x, z);
        if (y > h) return null;
        if (y < h - 2 && isCave(x, y, z)) return null;
        if (y === h) return 'grass';
        if (y === h - 1) return 'dirt';
        if (y >= h - 4) return 'stone';
        if (y >= CONST.CAVE_DEPTH_LIMIT - 2) return 'stone';
        return null;
    }

    const modifications = new Map();
    const worldKey = (x, y, z) => `${x},${y},${z}`;
    const getBlockType = (x, y, z) => {
        const k = worldKey(x, y, z);
        return modifications.has(k) ? modifications.get(k) : generateBlock(x, y, z);
    };
    const isSolid = (x, y, z) => getBlockType(x, y, z) !== null;
    const setBlock = (x, y, z, type) => modifications.set(worldKey(x, y, z), type);

    // ============ 场景 ============
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 20, 55);

    const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 200);

    const canvasElement = document.getElementById('gameCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, antialias: true });

    function resizeRenderer() {
        const w = document.documentElement.clientWidth || window.innerWidth;
        const h = document.documentElement.clientHeight || window.innerHeight;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(w, h, false);
        canvasElement.style.width = w + 'px';
        canvasElement.style.height = h + 'px';
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    }
    resizeRenderer();

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const sun = new THREE.DirectionalLight(0xffffff, 0.75);
    sun.position.set(30, 50, 30);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xffffff, 0.25);
    fill.position.set(-30, -20, -30);
    scene.add(fill);

    // ============ 渲染 ============
    const renderedMeshes = new Map();
    function addMeshAt(x, y, z, type) {
        const k = worldKey(x, y, z);
        if (renderedMeshes.has(k)) return;
        const mesh = new THREE.Mesh(BLOCK_GEOMETRY, BLOCK_MATERIALS[type]);
        mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
        mesh.userData = { x, y, z, type };
        mesh.matrixAutoUpdate = false;
        mesh.updateMatrix();
        scene.add(mesh);
        renderedMeshes.set(k, mesh);
    }
    function removeMeshAt(x, y, z) {
        const k = worldKey(x, y, z);
        const mesh = renderedMeshes.get(k);
        if (mesh) { scene.remove(mesh); renderedMeshes.delete(k); }
    }
    function updateRender() {
        const cx = Math.floor(player.pos.x);
        const cz = Math.floor(player.pos.z);
        const cy = Math.floor(player.pos.y);
        const needed = new Set();
        const yMin = Math.max(CONST.CAVE_DEPTH_LIMIT - 2, cy - 10);
        const yMax = cy + 10;
        for (let dx = -CONST.RENDER_RADIUS; dx <= CONST.RENDER_RADIUS; dx++) {
            for (let dz = -CONST.RENDER_RADIUS; dz <= CONST.RENDER_RADIUS; dz++) {
                const x = cx + dx, z = cz + dz;
                const h = terrainHeight(x, z);
                for (let y = h; y >= h - 4; y--) {
                    const k = worldKey(x, y, z);
                    const type = getBlockType(x, y, z);
                    if (type !== null) {
                        needed.add(k);
                        if (!renderedMeshes.has(k)) addMeshAt(x, y, z, type);
                    }
                }
                const yTop = Math.min(h - 5, yMax);
                const yBot = Math.max(CONST.CAVE_DEPTH_LIMIT - 2, yMin);
                for (let y = yTop; y >= yBot; y--) {
                    const k = worldKey(x, y, z);
                    if (needed.has(k)) continue;
                    const type = getBlockType(x, y, z);
                    if (type !== null) {
                        needed.add(k);
                        if (!renderedMeshes.has(k)) addMeshAt(x, y, z, type);
                    }
                }
            }
        }
        for (const [k, type] of modifications) {
            if (type === null) continue;
            const [x, y, z] = k.split(',').map(Number);
            if (Math.abs(x - cx) <= CONST.RENDER_RADIUS && Math.abs(z - cz) <= CONST.RENDER_RADIUS) {
                needed.add(k);
                if (!renderedMeshes.has(k)) addMeshAt(x, y, z, type);
            }
        }
        for (const k of [...renderedMeshes.keys()]) {
            if (!needed.has(k)) {
                scene.remove(renderedMeshes.get(k));
                renderedMeshes.delete(k);
            }
        }
    }

    // ============ 玩家 ============
    const spawnH = terrainHeight(0, 0);
    const player = {
        pos: new THREE.Vector3(0.5, spawnH + 2, 0.5),
        yaw: 0, pitch: -0.3, vy: 0, onGround: false,
    };

    // ============ 碰撞 ============
    function isColliding(pos) {
        const minX = pos.x - CONST.PLAYER_W / 2, maxX = pos.x + CONST.PLAYER_W / 2;
        const minY = pos.y, maxY = pos.y + CONST.PLAYER_H;
        const minZ = pos.z - CONST.PLAYER_W / 2, maxZ = pos.z + CONST.PLAYER_W / 2;
        const x0 = Math.floor(minX), x1 = Math.floor(maxX);
        const y0 = Math.floor(minY), y1 = Math.floor(maxY);
        const z0 = Math.floor(minZ), z1 = Math.floor(maxZ);
        for (let x = x0; x <= x1; x++)
            for (let y = y0; y <= y1; y++)
                for (let z = z0; z <= z1; z++)
                    if (isSolid(x, y, z) &&
                        maxX > x && minX < x + 1 &&
                        maxY > y && minY < y + 1 &&
                        maxZ > z && minZ < z + 1) return true;
        return false;
    }
    function exactGroundY(pos) {
        const halfW = CONST.PLAYER_W / 2;
        const x0 = Math.floor(pos.x - halfW + 0.001);
        const x1 = Math.floor(pos.x + halfW - 0.001);
        const z0 = Math.floor(pos.z - halfW + 0.001);
        const z1 = Math.floor(pos.z + halfW - 0.001);
        let highest = -Infinity;
        for (let x = x0; x <= x1; x++) {
            for (let z = z0; z <= z1; z++) {
                for (let y = Math.floor(pos.y + CONST.PLAYER_H); y >= CONST.CAVE_DEPTH_LIMIT - 5; y--) {
                    if (isSolid(x, y, z)) {
                        if (y + 1 > highest) highest = y + 1;
                        break;
                    }
                }
            }
        }
        return highest;
    }
    function sweepMove(axis, dist) {
        const n = Math.max(1, Math.ceil(Math.abs(dist) / CONST.SWEEP_STEP));
        const s = dist / n;
        for (let i = 0; i < n; i++) {
            const test = {
                x: player.pos.x + (axis === 'x' ? s : 0),
                y: player.pos.y + (axis === 'y' ? s : 0),
                z: player.pos.z + (axis === 'z' ? s : 0),
            };
            if (isColliding(test)) return true;
            player.pos.x = test.x;
            player.pos.y = test.y;
            player.pos.z = test.z;
        }
        return false;
    }

    // ============ 射线 ============
    const raycaster = new THREE.Raycaster();
    raycaster.far = 6;
    const _rayDir = new THREE.Vector3();
    function raycast() {
        camera.getWorldDirection(_rayDir);
        raycaster.set(camera.position, _rayDir);
        const hits = raycaster.intersectObjects([...renderedMeshes.values()], false);
        if (hits.length === 0) return null;
        const h = hits[0];
        return { block: h.object.userData, normal: h.face.normal.clone() };
    }

    // ============ 放置 / 破坏 ============
    let lastAction = '';
    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove('show'), 800);
        lastAction = msg;
    }
    function tryPlace() {
        const hit = raycast();
        if (!hit) return toast('没对准方块');
        const { x, y, z } = hit.block;
        const n = hit.normal;
        const tx = x + n.x, ty = y + n.y, tz = z + n.z;
        if (isSolid(tx, ty, tz)) return;
        const pMinX = player.pos.x - CONST.PLAYER_W / 2, pMaxX = player.pos.x + CONST.PLAYER_W / 2;
        const pMinY = player.pos.y, pMaxY = player.pos.y + CONST.PLAYER_H;
        const pMinZ = player.pos.z - CONST.PLAYER_W / 2, pMaxZ = player.pos.z + CONST.PLAYER_W / 2;
        if (pMaxX > tx && pMinX < tx + 1 && pMaxY > ty && pMinY < ty + 1 && pMaxZ > tz && pMinZ < tz + 1)
            return toast('会卡住自己');
        setBlock(tx, ty, tz, currentBlock);
        addMeshAt(tx, ty, tz, currentBlock);
        scheduleSave();
    }
    function tryBreak() {
        const hit = raycast();
        if (!hit) return toast('没对准方块');
        const { x, y, z } = hit.block;
        const footX = Math.floor(player.pos.x), footZ = Math.floor(player.pos.z);
        const footY = Math.floor(player.pos.y - 0.05);
        if (x === footX && y === footY && z === footZ) return toast('不能挖脚下');
        setBlock(x, y, z, null);
        removeMeshAt(x, y, z);
        scheduleSave();
    }

    // ============ 存档 ============
    let saveTimer = null;
    function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveToLocal, 500);
    }
    function getSaveData() {
        return {
            version: 6,
            modifications: [...modifications],
            player: {
                x: player.pos.x, y: player.pos.y, z: player.pos.z,
                yaw: player.yaw, pitch: player.pitch,
            },
            currentBlock,
        };
    }
    function saveToLocal() {
        try { localStorage.setItem(CONST.SAVE_KEY, JSON.stringify(getSaveData())); }
        catch (e) { console.warn('自动存档失败', e); }
    }
    function applySaveData(data) {
        if (!data || typeof data !== 'object') return false;
        modifications.clear();
        if (Array.isArray(data.modifications)) {
            for (const entry of data.modifications) {
                if (Array.isArray(entry) && entry.length === 2) {
                    const [k, v] = entry;
                    if (typeof k === 'string' && (v === null || BLOCK_CONFIG[v])) {
                        modifications.set(k, v);
                    }
                }
            }
        }
        if (data.player) {
            const px = Number(data.player.x), py = Number(data.player.y), pz = Number(data.player.z);
            const pyaw = Number(data.player.yaw), ppitch = Number(data.player.pitch);
            player.pos.set(
                Number.isFinite(px) ? px : 0.5,
                Number.isFinite(py) ? py : spawnH + 2,
                Number.isFinite(pz) ? pz : 0.5
            );
            player.yaw = Number.isFinite(pyaw) ? pyaw : 0;
            player.pitch = Number.isFinite(ppitch)
                ? Math.max(-CONST.PITCH_LIMIT, Math.min(CONST.PITCH_LIMIT, ppitch))
                : -0.3;
        }
        if (data.currentBlock && BLOCK_CONFIG[data.currentBlock]) {
            currentBlock = data.currentBlock;
            updateHotbarSelection();
        }
        for (const mesh of renderedMeshes.values()) scene.remove(mesh);
        renderedMeshes.clear();
        player.vy = 0;
        player.onGround = false;
        updateRender();
        return true;
    }
    function loadFromLocal() {
        try {
            const raw = localStorage.getItem(CONST.SAVE_KEY);
            if (!raw) return false;
            return applySaveData(JSON.parse(raw));
        } catch (e) { return false; }
    }
    function exportSave() {
        saveToLocal();
        const data = getSaveData();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const now = new Date();
        const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
        a.href = url;
        a.download = `minicraft-${stamp}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast('存档已导出');
    }
    function importSave() {
        document.getElementById('fileInput').click();
    }
    document.getElementById('fileInput').addEventListener('change', e => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const data = JSON.parse(ev.target.result);
                if (applySaveData(data)) {
                    saveToLocal();
                    toast('存档已导入');
                } else toast('存档格式错误');
            } catch (err) { toast('读取失败'); }
        };
        reader.readAsText(file);
        e.target.value = '';
    });
    function resetWorld() {
        if (!confirm('确定清空存档并重新生成世界吗？')) return;
        localStorage.removeItem(CONST.SAVE_KEY);
        modifications.clear();
        for (const mesh of renderedMeshes.values()) scene.remove(mesh);
        renderedMeshes.clear();
        const sh = terrainHeight(0, 0);
        player.pos.set(0.5, sh + 2, 0.5);
        player.vy = 0; player.onGround = false;
        player.yaw = 0; player.pitch = -0.3;
        updateRender();
        toast('新世界已生成');
    }

    // ============ 输入 ============
    let moveInput = { x: 0, y: 0 };
    let jumpRequested = false;
    let currentBlock = 'grass';

    const hotbar = document.getElementById('hotbar');
    const hotbarSlots = [];
    for (const k of HOTBAR_ORDER) {
        const slot = document.createElement('div');
        slot.className = 'hotbar-slot' + (k === currentBlock ? ' selected' : '');
        slot.dataset.type = k;
        slot.style.background = BLOCK_CONFIG[k].color;
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = BLOCK_CONFIG[k].name[0];
        slot.appendChild(label);
        hotbar.appendChild(slot);
        hotbarSlots.push(slot);
    }
    function updateHotbarSelection() {
        hotbarSlots.forEach((s, i) => {
            s.classList.toggle('selected', HOTBAR_ORDER[i] === currentBlock);
        });
    }

    const joystick = document.getElementById('joystick');
    const knob = document.getElementById('joystick-knob');
    const hud = document.getElementById('hud');
    const hint = document.getElementById('longpressHint');
    let joyCenter = { x: 0, y: 0 };

    function joyMove(x, y) {
        const dx = x - joyCenter.x, dy = y - joyCenter.y;
        const dist = Math.hypot(dx, dy);
        const maxDist = 45;
        const clamped = Math.min(dist, maxDist);
        const angle = Math.atan2(dy, dx);
        const kx = Math.cos(angle) * clamped;
        const ky = Math.sin(angle) * clamped;
        knob.style.transform = `translate(${kx}px,${ky}px)`;
        moveInput.x = kx / maxDist;
        moveInput.y = ky / maxDist;
    }
    function joyEnd() {
        moveInput = { x: 0, y: 0 };
        knob.style.transform = 'translate(0,0)';
    }

    const pointInCircle = (x, y, r) => {
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        return Math.hypot(x - cx, y - cy) <= Math.min(r.width, r.height) / 2;
    };
    const pointInRect = (x, y, r) => x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;

    function getUIElements() {
        return {
            jump: document.getElementById('jumpBtn').getBoundingClientRect(),
            joystick: joystick.getBoundingClientRect(),
            save: document.getElementById('saveBtn').getBoundingClientRect(),
            load: document.getElementById('loadBtn').getBoundingClientRect(),
            reset: document.getElementById('resetBtn').getBoundingClientRect(),
            slots: [...document.querySelectorAll('.hotbar-slot')].map(el => ({
                el, rect: el.getBoundingClientRect(), type: el.dataset.type
            })),
        };
    }

    const activeTouches = new Map();

    document.addEventListener('touchstart', e => {
        const ui = getUIElements();
        for (const t of e.changedTouches) {
            const x = t.clientX, y = t.clientY;
            if (pointInRect(x, y, ui.save))  { exportSave(); activeTouches.set(t.identifier, { type: 'ui' }); continue; }
            if (pointInRect(x, y, ui.load))  { importSave(); activeTouches.set(t.identifier, { type: 'ui' }); continue; }
            if (pointInRect(x, y, ui.reset)) { resetWorld(); activeTouches.set(t.identifier, { type: 'ui' }); continue; }
            if (pointInCircle(x, y, ui.jump)) {
                jumpRequested = true;
                activeTouches.set(t.identifier, { type: 'jump' });
                continue;
            }
            let slotHit = null;
            for (const s of ui.slots) if (pointInRect(x, y, s.rect)) { slotHit = s; break; }
            if (slotHit) {
                currentBlock = slotHit.type;
                updateHotbarSelection();
                activeTouches.set(t.identifier, { type: 'ui' });
                continue;
            }
            if (pointInCircle(x, y, ui.joystick)) {
                const r = joystick.getBoundingClientRect();
                joyCenter = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
                joyMove(x, y);
                activeTouches.set(t.identifier, { type: 'joystick' });
                continue;
            }
            const state = {
                type: 'empty', startX: x, startY: y, lastX: x, lastY: y,
                moved: false, longPressFired: false, longPressTimer: null,
            };
            state.longPressTimer = setTimeout(() => {
                if (!state.moved) {
                    state.longPressFired = true;
                    tryBreak();
                    hint.style.left = x + 'px'; hint.style.top = y + 'px';
                    hint.classList.add('active');
                    setTimeout(() => hint.classList.remove('active'), 150);
                }
            }, CONST.LONG_PRESS_MS);
            activeTouches.set(t.identifier, state);
        }
        e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchmove', e => {
        for (const t of e.changedTouches) {
            const info = activeTouches.get(t.identifier);
            if (!info) continue;
            if (info.type === 'joystick') {
                joyMove(t.clientX, t.clientY);
            } else if (info.type === 'empty') {
                const dx = t.clientX - info.lastX, dy = t.clientY - info.lastY;
                if (Math.hypot(t.clientX - info.startX, t.clientY - info.startY) > CONST.MOVE_THRESHOLD) {
                    info.moved = true;
                    if (info.longPressTimer) { clearTimeout(info.longPressTimer); info.longPressTimer = null; }
                }
                if (info.moved) {
                    player.yaw -= dx * 0.005;
                    // 立即归一化 yaw，避免数值无限增长
                    if (player.yaw > Math.PI) player.yaw -= 2 * Math.PI;
                    else if (player.yaw < -Math.PI) player.yaw += 2 * Math.PI;
                    player.pitch = Math.max(-CONST.PITCH_LIMIT, Math.min(CONST.PITCH_LIMIT, player.pitch - dy * 0.005));
                }
                info.lastX = t.clientX; info.lastY = t.clientY;
            }
        }
        e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchend', e => {
        for (const t of e.changedTouches) {
            const info = activeTouches.get(t.identifier);
            if (!info) continue;
            if (info.type === 'joystick') joyEnd();
            else if (info.type === 'empty') {
                if (info.longPressTimer) clearTimeout(info.longPressTimer);
                if (!info.moved && !info.longPressFired) tryPlace();
            }
            activeTouches.delete(t.identifier);
        }
    });

    document.addEventListener('touchcancel', e => {
        for (const t of e.changedTouches) {
            const info = activeTouches.get(t.identifier);
            if (!info) continue;
            if (info.type === 'joystick') joyEnd();
            if (info.longPressTimer) clearTimeout(info.longPressTimer);
            activeTouches.delete(t.identifier);
        }
    });

    // ============ 物理 ============
    function physicsStep(dt) {
        const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
        const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
        const move = new THREE.Vector3();
        move.addScaledVector(forward, -moveInput.y);
        move.addScaledVector(right, moveInput.x);
        if (move.length() > 1) move.normalize();
        sweepMove('x', move.x * CONST.MOVE_SPEED * dt);
        sweepMove('z', move.z * CONST.MOVE_SPEED * dt);

        if (jumpRequested && player.onGround) {
            player.vy = CONST.JUMP_SPEED;
            player.onGround = false;
        }
        jumpRequested = false;

        player.vy -= CONST.GRAVITY * dt;
        player.vy = Math.max(player.vy, -30);
        const hit = sweepMove('y', player.vy * dt);
        if (hit) {
            if (player.vy < 0) {
                const g = exactGroundY(player.pos);
                if (g > -Infinity && g <= player.pos.y + 0.1) player.pos.y = g;
                player.vy = 0; player.onGround = true;
            } else {
                player.vy = 0; player.onGround = false;
            }
        } else {
            const below = { x: player.pos.x, y: player.pos.y - 0.05, z: player.pos.z };
            player.onGround = isColliding(below);
            if (player.onGround) {
                const g = exactGroundY(player.pos);
                if (g > -Infinity && g <= player.pos.y + 0.1) player.pos.y = g;
                player.vy = 0;
            }
        }
    }

    // ==========================================================
    // ★★★ 相机：用显式四元数构造，数学上严格无 roll ★★★
    // 顺序：先绕本地 X 轴 pitch，再绕世界 Y 轴 yaw
    // 等价于欧拉角 YXZ，但不依赖 THREE.Euler 的内部实现
    // ==========================================================
    const _yAxis = new THREE.Vector3(0, 1, 0);
    const _xAxis = new THREE.Vector3(1, 0, 0);
    const _yawQuat = new THREE.Quaternion();
    const _pitchQuat = new THREE.Quaternion();

    function updateCamera() {
        camera.position.set(player.pos.x, player.pos.y + CONST.EYE_H, player.pos.z);

        _yawQuat.setFromAxisAngle(_yAxis, player.yaw);
        _pitchQuat.setFromAxisAngle(_xAxis, player.pitch);

        // 先 pitch 后 yaw：结果 = yawQuat * pitchQuat
        camera.quaternion.copy(_yawQuat).multiply(_pitchQuat);

        // 强制滚转为零（保险措施）
        // 理论上不会发生，但万一数值误差累积，这一步可以彻底消除
        const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
        if (Math.abs(e.z) > 1e-6) {
            e.z = 0;
            camera.quaternion.setFromEuler(e);
        }
    }

    // ============ 主循环 ============
    let lastTime = performance.now();
    let accumulator = 0;
    let fpsTimer = 0, fpsCount = 0, renderTimer = 0, hudTimer = 0, resizeTimer = 0;

    function update() {
        const now = performance.now();
        const frameTime = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        resizeTimer += frameTime;
        if (resizeTimer > 2) {
            resizeTimer = 0;
            const w = document.documentElement.clientWidth || window.innerWidth;
            const h = document.documentElement.clientHeight || window.innerHeight;
            if (Math.abs(camera.aspect - w / h) > 0.01) resizeRenderer();
        }

        accumulator += frameTime;
        let steps = 0;
        while (accumulator >= CONST.FIXED_DT && steps < 5) {
            physicsStep(CONST.FIXED_DT);
            accumulator -= CONST.FIXED_DT;
            steps++;
        }

        if (player.pos.y < -40) {
            const sh = terrainHeight(0, 0);
            player.pos.set(0.5, sh + 2, 0.5);
            player.vy = 0; player.onGround = false;
        }

        renderTimer += frameTime;
        if (renderTimer > 0.15) { renderTimer = 0; updateRender(); }

        updateCamera();
        renderer.render(scene, camera);

        fpsCount++; fpsTimer += frameTime; hudTimer += frameTime;
        if (hudTimer >= 0.5) {
            hud.innerHTML =
                `FPS: ${Math.round(fpsCount / fpsTimer)}<br>` +
                `位置: ${player.pos.x.toFixed(1)}, ${player.pos.y.toFixed(1)}, ${player.pos.z.toFixed(1)}<br>` +
                `yaw=${player.yaw.toFixed(2)} pitch=${player.pitch.toFixed(2)}<br>` +
                `方块: ${renderedMeshes.size}`;
            fpsCount = 0; fpsTimer = 0; hudTimer = 0;
        }

        requestAnimationFrame(update);
    }

    window.addEventListener('resize', resizeRenderer);
    window.addEventListener('orientationchange', () => setTimeout(resizeRenderer, 200));
    window.addEventListener('beforeunload', saveToLocal);

    if (loadFromLocal()) {
        setTimeout(() => toast('已读取本地存档'), 500);
    }
    updateRender();
    update();
    </script>
</body>
</html>

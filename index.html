<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MiniCraft</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #87CEEB;
            -webkit-user-select: none; user-select: none; touch-action: none;
            position: fixed; font-family: ui-monospace, "Menlo", monospace; }
        #gameCanvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 28px; height: 28px; pointer-events: none; z-index: 10; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; box-shadow: 0 0 3px black; }
        #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
        #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
        #hud { position: fixed; top: 16px; left: 16px; color: white; font-size: 11px; line-height: 1.55;
            text-shadow: 1px 1px 2px black; background: rgba(0,0,0,0.5);
            padding: 6px 10px; border-radius: 4px; z-index: 100; pointer-events: none; }
        #topBar { position: fixed; top: 16px; right: 16px; display: flex; gap: 6px; z-index: 100; }
        .mc-btn { padding: 10px 14px; background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.4); border-radius: 4px;
            color: white; font-size: 14px; font-family: inherit; user-select: none; cursor: pointer; }
        .mc-btn:active { background: rgba(80,80,80,0.8); }
        #hotbar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 3px; padding: 4px; background: rgba(0,0,0,0.55);
            border: 2px solid rgba(255,255,255,0.35); border-radius: 4px; z-index: 100; pointer-events: none; }
        .hotbar-slot { width: 46px; height: 46px; border-radius: 2px;
            background: rgba(80,80,80,0.6); border: 2px solid rgba(255,255,255,0.2); }
        .hotbar-slot.selected { border: 3px solid #fff; box-shadow: 0 0 8px rgba(255,255,255,0.8); }
        #joystick { position: fixed; left: 30px; bottom: 100px; width: 130px; height: 130px; border-radius: 50%;
            background: rgba(255,255,255,0.22); z-index: 100; pointer-events: none; }
        #joystick-knob { position: absolute; left: 45px; top: 45px; width: 40px; height: 40px;
            border-radius: 50%; background: rgba(255,255,255,0.95); }
        #jumpBtn { position: fixed; right: 30px; bottom: 130px; width: 84px; height: 84px;
            border-radius: 50%; background: rgba(80,180,100,0.85);
            border: 3px solid rgba(255,255,255,0.5); color: white;
            font-size: 20px; font-weight: bold; text-align: center; line-height: 78px;
            z-index: 100; pointer-events: none; }
        #longpressHint { position: fixed; pointer-events: none; z-index: 50;
            width: 80px; height: 80px; border-radius: 50%;
            border: 3px solid rgba(255,60,60,0.9);
            transform: translate(-50%,-50%) scale(0); transition: transform 0.12s; }
        #longpressHint.active { transform: translate(-50%,-50%) scale(1); }
        #toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            padding: 14px 24px; background: rgba(0,0,0,0.8); color: white;
            font-size: 15px; border: 2px solid rgba(255,255,255,0.4); border-radius: 6px;
            z-index: 500; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
        #toast.show { opacity: 1; }
        #settingsPanel, #inventoryPanel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 340px; max-width: 90vw; background: rgba(30,30,40,0.97);
            border: 3px solid rgba(255,255,255,0.5); border-radius: 8px;
            color: white; padding: 18px; z-index: 300; display: none; font-size: 13px; }
        #settingsPanel.show, #inventoryPanel.show { display: block; }
        #settingsPanel h3, #inventoryPanel h3 { margin-bottom: 12px; text-align: center; font-size: 16px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px; gap: 10px; }
        .setting-row label { flex: 1; }
        .setting-row input[type=range] { flex: 1.2; touch-action: auto; }
        .setting-row .val { width: 36px; text-align: right; color: #ffd966; }
        .setting-row select { padding: 6px; border-radius: 4px; background: #222;
            color: white; border: 1px solid #666; font-family: inherit; font-size: 13px; }
        .setting-row input[type=checkbox] { width: 22px; height: 22px; }
        .panel-btn { display: block; width: 100%; padding: 12px; margin-top: 10px;
            background: rgba(80,120,180,0.9); color: white;
            border: 2px solid rgba(255,255,255,0.35); border-radius: 4px;
            font-size: 14px; font-family: inherit; user-select: none; cursor: pointer; }
        .panel-btn:active { background: rgba(100,140,200,0.9); }
        #inventoryGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .inv-slot { aspect-ratio: 1; border-radius: 4px; border: 2px solid rgba(255,255,255,0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; text-shadow: 1px 1px 1px black; cursor: pointer; }
        .inv-slot.selected { border-color: #ffd966; box-shadow: 0 0 8px #ffd966; }
        .inv-slot:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="crosshair"></div>
    <div id="hud">加载中...</div>
    <div id="topBar">
        <div class="mc-btn" id="settingsBtn">⚙️</div>
        <div class="mc-btn" id="inventoryBtn">🎒</div>
        <div class="mc-btn" id="saveBtn">💾</div>
        <div class="mc-btn" id="loadBtn">📂</div>
        <div class="mc-btn" id="resetBtn">🔄</div>
    </div>
    <div id="hotbar"></div>
    <div id="joystick"><div id="joystick-knob"></div></div>
    <div id="jumpBtn">跳</div>
    <div id="longpressHint"></div>
    <div id="toast"></div>

    <div id="settingsPanel">
        <h3>⚙️ 设置</h3>
        <div class="setting-row">
            <label>世界类型</label>
            <select id="worldTypeSelect">
                <option value="normal">普通世界</option>
                <option value="flat">超平坦</option>
            </select>
        </div>
        <div class="setting-row"><label>渲染距离</label>
            <input type="range" id="renderDistSlider" min="4" max="14" value="7">
            <span class="val" id="renderDistVal">7</span></div>
        <div class="setting-row"><label>亮度</label>
            <input type="range" id="brightnessSlider" min="30" max="150" value="100">
            <span class="val" id="brightnessVal">100</span></div>
        <div class="setting-row"><label>移动速度</label>
            <input type="range" id="speedSlider" min="3" max="15" value="6" step="0.5">
            <span class="val" id="speedVal">6</span></div>
        <div class="setting-row"><label>飞行模式</label>
            <input type="checkbox" id="flyToggle"></div>
        <button class="panel-btn" id="closeSettings">关闭</button>
        <button class="panel-btn" id="applyWorldBtn" style="background: rgba(180,80,80,0.9);">应用世界类型（会重置世界）</button>
    </div>

    <div id="inventoryPanel">
        <h3>🎒 背包</h3>
        <div id="inventoryGrid"></div>
        <button class="panel-btn" id="closeInventory">关闭</button>
    </div>

    <input type="file" id="fileInput" accept=".json" style="display:none">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
    <script>
    const BLOCK_CONFIG = {
        grass:  { name: '草方块', top: '#5fa845', side: '#7a9a4a', bottom: '#8b5a2b' },
        dirt:   { name: '泥土',   color: '#8b5a2b' },
        stone:  { name: '石头',   color: '#888888' },
        wood:   { name: '原木',   color: '#6b4423' },
        plank:  { name: '木板',   color: '#b88a4a' },
        leaves: { name: '树叶',   color: '#3d7a1e' },
        sand:   { name: '沙子',   color: '#d4c694', gravity: true },
        torch:  { name: '火把',   color: '#ffcc33', light: true, emissive: true },
    };
    const HOTBAR_ORDER = ['grass', 'dirt', 'stone', 'wood', 'plank', 'leaves', 'sand', 'torch'];

    const CONST = {
        GRAVITY: 22, JUMP_SPEED: 8.5,
        PLAYER_W: 0.6, PLAYER_H: 1.8, EYE_H: 1.6,
        SAVE_KEY: 'minicraft_v9',
        FIXED_DT: 1 / 60,
        LONG_PRESS_MS: 450, MOVE_THRESHOLD: 25, SWEEP_STEP: 0.05,
        PITCH_LIMIT: 1.45, MAX_TORCH_LIGHTS: 3,
    };

    let WORLD_SEED = Math.floor(Math.random() * 1e9);
    let worldType = 'normal';

    // ============ 噪声 ============
    function hash2(x, z, s) {
        let n = x * 374761393 + z * 668265263 + s * 1274126177;
        n = (n ^ (n >> 13)) * 1274126177;
        return ((n ^ (n >> 16)) >>> 0) / 4294967296;
    }
    function hash3(x, y, z, s) {
        let n = x * 374761393 + y * 668265263 + z * 1274126177 + s * 13579;
        n = (n ^ (n >> 13)) * 1274126177;
        return ((n ^ (n >> 16)) >>> 0) / 4294967296;
    }
    const smooth = t => t * t * (3 - 2 * t);
    function noise2(x, z, s) {
        const xi = Math.floor(x), zi = Math.floor(z);
        const u = smooth(x - xi), w = smooth(z - zi);
        const c00 = hash2(xi, zi, s),     c10 = hash2(xi+1, zi, s);
        const c01 = hash2(xi, zi+1, s),   c11 = hash2(xi+1, zi+1, s);
        return c00*(1-u)*(1-w) + c10*u*(1-w) + c01*(1-u)*w + c11*u*w;
    }
    function noise3(x, y, z, s) {
        const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
        const u = smooth(x - xi), v = smooth(y - yi), w = smooth(z - zi);
        const c000 = hash3(xi, yi, zi, s),     c100 = hash3(xi+1, yi, zi, s);
        const c010 = hash3(xi, yi+1, zi, s),   c110 = hash3(xi+1, yi+1, zi, s);
        const c001 = hash3(xi, yi, zi+1, s),   c101 = hash3(xi+1, yi, zi+1, s);
        const c011 = hash3(xi, yi+1, zi+1, s), c111 = hash3(xi+1, yi+1, zi+1, s);
        const x00 = c000*(1-u) + c100*u, x10 = c010*(1-u) + c110*u;
        const x01 = c001*(1-u) + c101*u, x11 = c011*(1-u) + c111*u;
        return (x00*(1-v) + x10*v)*(1-w) + (x01*(1-v) + x11*v)*w;
    }

    // ============ 生物群系 & 地形 ============
    // ★ 修复：拉伸噪声对比度，让三个 biome 分布均匀（森林约 45%）
    function getBiome(x, z) {
        const v = noise2(x * 0.008, z * 0.008, WORLD_SEED);
        const stretched = (v - 0.5) * 3.0 + 0.5;   // 放大对比度
        if (stretched < 0.33) return 'desert';
        if (stretched < 0.55) return 'plains';
        return 'forest';
    }
    function getHeight(x, z) {
        if (worldType === 'flat') return 20;
        const biome = getBiome(x, z);
        let h;
        if (biome === 'desert') {
            h = 18 + noise2(x * 0.1, z * 0.1, WORLD_SEED + 1) * 4;
            h += noise2(x * 0.03, z * 0.03, WORLD_SEED + 2) * 3;
        } else if (biome === 'plains') {
            h = 20 + noise2(x * 0.15, z * 0.15, WORLD_SEED + 3) * 3;
        } else {
            h = 22 + noise2(x * 0.2, z * 0.2, WORLD_SEED + 4) * 5;
            h += noise2(x * 0.05, z * 0.05, WORLD_SEED + 5) * 4;
        }
        return Math.floor(h);
    }
    function isCave(x, y, z) {
        if (y < 1) return false;
        const surface = getHeight(x, z);
        if (y > surface - 2) return false;
        const n1 = noise3(x * 0.09, y * 0.14, z * 0.09, WORLD_SEED + 100);
        const n2 = noise3(x * 0.18, y * 0.22, z * 0.18, WORLD_SEED + 200) * 0.5;
        const depth = surface - y;
        const bonus = Math.min(depth / 20, 0.15);
        const isEntrance = hash2(x, z, WORLD_SEED + 300) < 0.1 && depth < 4;
        const threshold = isEntrance ? 0.55 : 0.78;
        return n1 + n2 + bonus > threshold;
    }
    // ★ 修复：提高树生成概率到 10%
    function hasTree(x, z) {
        if (getBiome(x, z) !== 'forest') return false;
        return hash2(x, z, WORLD_SEED + 400) < 0.10;
    }
    function treeBlockAt(x, y, z) {
        for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
                const tx = x + dx, tz = z + dz;
                if (!hasTree(tx, tz)) continue;
                const baseY = getHeight(tx, tz) + 1;
                const th = 3 + Math.floor(hash2(tx, tz, WORLD_SEED + 500) * 3);
                const topY = baseY + th - 1;
                if (x === tx && z === tz && y >= baseY && y < baseY + th) return 'wood';
                if (y >= topY && y <= topY + 1 && Math.abs(x - tx) <= 1 && Math.abs(z - tz) <= 1) {
                    if (x === tx && z === tz && y === topY) continue;
                    return 'leaves';
                }
            }
        }
        return null;
    }
    function generateBlock(x, y, z) {
        if (y < 0) return null;
        if (y === 0) return 'bedrock';
        const surface = getHeight(x, z);
        const biome = getBiome(x, z);
        if (y < surface - 1 && isCave(x, y, z)) {
            const t = treeBlockAt(x, y, z);
            return t || null;
        }
        const treeBlock = treeBlockAt(x, y, z);
        if (treeBlock && y > surface) return treeBlock;
        if (y === surface) return biome === 'desert' ? 'sand' : 'grass';
        if (y > surface) return null;
        const depth = surface - y;
        if (depth <= 3) return biome === 'desert' ? 'sand' : 'dirt';
        return 'stone';
    }

    const modifications = new Map();
    const worldKey = (x, y, z) => `${x},${y},${z}`;
    const getBlockType = (x, y, z) => {
        const k = worldKey(x, y, z);
        if (modifications.has(k)) return modifications.get(k);
        if (y === 0) return 'bedrock';
        return generateBlock(x, y, z);
    };
    const isSolid = (x, y, z) => getBlockType(x, y, z) !== null;
    const setBlock = (x, y, z, type) => modifications.set(worldKey(x, y, z), type);

    // ============ 场景 ============
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 20, 55);
    const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 300);
    const canvasElement = document.getElementById('gameCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, antialias: true });
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputEncoding = THREE.sRGBEncoding;

    function makeTexture(color, opts = {}) {
        const c = document.createElement('canvas');
        c.width = c.height = 16;
        const ctx = c.getContext('2d');
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, 16, 16);
        for (let i = 0; i < 80; i++) {
            const x = (Math.random() * 16) | 0, y = (Math.random() * 16) | 0;
            const a = (Math.random() * 0.3).toFixed(2);
            ctx.fillStyle = Math.random() > 0.5 ? `rgba(0,0,0,${a})` : `rgba(255,255,255,${a})`;
            ctx.fillRect(x, y, 1, 1);
        }
        if (opts.sideSplit && opts.bottomColor) {
            ctx.fillStyle = opts.bottomColor;
            ctx.fillRect(0, 9, 16, 7);
            ctx.strokeStyle = 'rgba(0,0,0,0.25)';
            ctx.beginPath(); ctx.moveTo(0, 9); ctx.lineTo(16, 9); ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(0,0,0,0.28)';
        ctx.strokeRect(0.5, 0.5, 15, 15);
        const tex = new THREE.CanvasTexture(c);
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        return tex;
    }

    const BLOCK_GEOMETRY = new THREE.BoxGeometry(1, 1, 1);
    const BLOCK_MATERIALS = {};
    const grassTopTex = makeTexture(BLOCK_CONFIG.grass.top);
    const grassBottomTex = makeTexture(BLOCK_CONFIG.grass.bottom);
    const grassSideTex = makeTexture(BLOCK_CONFIG.grass.side, { sideSplit: true, bottomColor: BLOCK_CONFIG.grass.bottom });
    BLOCK_MATERIALS.grass = [
        new THREE.MeshLambertMaterial({ map: grassSideTex }),
        new THREE.MeshLambertMaterial({ map: grassSideTex }),
        new THREE.MeshLambertMaterial({ map: grassTopTex }),
        new THREE.MeshLambertMaterial({ map: grassBottomTex }),
        new THREE.MeshLambertMaterial({ map: grassSideTex }),
        new THREE.MeshLambertMaterial({ map: grassSideTex }),
    ];
    for (const k in BLOCK_CONFIG) {
        if (k === 'grass') continue;
        const cfg = BLOCK_CONFIG[k];
        const mat = new THREE.MeshLambertMaterial({ map: makeTexture(cfg.color) });
        if (cfg.emissive) {
            mat.emissive = new THREE.Color(cfg.color);
            mat.emissiveIntensity = 0.6;
        }
        BLOCK_MATERIALS[k] = mat;
    }
    const TORCH_GEOMETRY = new THREE.BoxGeometry(0.25, 0.6, 0.25);

    // ============ 光照 ============
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const sunLight = new THREE.DirectionalLight(0xffffff, 0.55);
    sunLight.position.set(30, 50, 30);
    scene.add(sunLight);
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.15);
    fillLight.position.set(-30, -20, -30);
    scene.add(fillLight);
    let brightnessLevel = 100;
    function updateBrightness() {
        const v = brightnessLevel / 100;
        ambientLight.intensity = 0.5 * v;
        sunLight.intensity = 0.55 * v;
        fillLight.intensity = 0.15 * v;
    }

    const torchLights = new Map();
    function addTorchLight(x, y, z) {
        const k = worldKey(x, y, z);
        if (torchLights.has(k)) return;
        const light = new THREE.PointLight(0xffcc55, 0.9, 8);
        light.position.set(x + 0.5, y + 0.3, z + 0.5);
        scene.add(light);
        torchLights.set(k, light);
        pruneTorchLights();
    }
    function removeTorchLight(x, y, z) {
        const k = worldKey(x, y, z);
        const light = torchLights.get(k);
        if (light) { scene.remove(light); torchLights.delete(k); }
    }
    function pruneTorchLights() {
        if (torchLights.size <= CONST.MAX_TORCH_LIGHTS) return;
        const entries = [...torchLights.entries()].map(([k, l]) => {
            const [x, y, z] = k.split(',').map(Number);
            const d = Math.hypot(x - player.pos.x, y - player.pos.y, z - player.pos.z);
            return { k, l, d };
        }).sort((a, b) => a.d - b.d);
        for (let i = CONST.MAX_TORCH_LIGHTS; i < entries.length; i++) {
            scene.remove(entries[i].l);
            torchLights.delete(entries[i].k);
        }
    }

    // ============ 渲染 ============
    const renderedMeshes = new Map();
    function addMeshAt(x, y, z, type) {
        const k = worldKey(x, y, z);
        if (renderedMeshes.has(k)) return;
        let mesh;
        if (type === 'torch') {
            mesh = new THREE.Mesh(TORCH_GEOMETRY, BLOCK_MATERIALS.torch);
            mesh.position.set(x + 0.5, y + 0.3, z + 0.5);
        } else {
            mesh = new THREE.Mesh(BLOCK_GEOMETRY, BLOCK_MATERIALS[type]);
            mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
        }
        mesh.userData = { x, y, z, type };
        mesh.matrixAutoUpdate = false;
        mesh.updateMatrix();
        scene.add(mesh);
        renderedMeshes.set(k, mesh);
        if (type === 'torch') addTorchLight(x, y, z);
    }
    function removeMeshAt(x, y, z) {
        const k = worldKey(x, y, z);
        const mesh = renderedMeshes.get(k);
        if (mesh) { scene.remove(mesh); renderedMeshes.delete(k); }
        removeTorchLight(x, y, z);
    }
    let renderDistance = 7;
    function updateRender() {
        const cx = Math.floor(player.pos.x);
        const cz = Math.floor(player.pos.z);
        const cy = Math.floor(player.pos.y);
        const needed = new Set();
        const R = renderDistance;
        const yMin = Math.max(1, cy - 18);
        const yMax = cy + 18;
        for (let dx = -R; dx <= R; dx++) {
            for (let dz = -R; dz <= R; dz++) {
                const x = cx + dx, z = cz + dz;
                const h = getHeight(x, z);
                const topY = Math.min(h + 6, yMax);
                for (let y = topY; y >= yMin; y--) {
                    const k = worldKey(x, y, z);
                    const type = getBlockType(x, y, z);
                    if (type !== null) {
                        needed.add(k);
                        if (!renderedMeshes.has(k)) addMeshAt(x, y, z, type);
                    }
                }
            }
        }
        for (const [k, type] of modifications) {
            if (type === null) continue;
            const [x, y, z] = k.split(',').map(Number);
            if (Math.abs(x - cx) <= R && Math.abs(z - cz) <= R) {
                needed.add(k);
                if (!renderedMeshes.has(k)) addMeshAt(x, y, z, type);
            }
        }
        for (const k of [...renderedMeshes.keys()]) {
            if (!needed.has(k)) {
                scene.remove(renderedMeshes.get(k));
                renderedMeshes.delete(k);
                const [x, y, z] = k.split(',').map(Number);
                removeTorchLight(x, y, z);
            }
        }
    }

    // ============ 玩家 ============
    function randomSpawn() {
        for (let i = 0; i < 50; i++) {
            const x = (Math.random() - 0.5) * 200;
            const z = (Math.random() - 0.5) * 200;
            const y = getHeight(Math.floor(x), Math.floor(z)) + 2;
            if (y > 5) return new THREE.Vector3(x + 0.5, y, z + 0.5);
        }
        return new THREE.Vector3(0.5, 30, 0.5);
    }
    let player = { pos: randomSpawn(), yaw: 0, pitch: -0.3, vy: 0, onGround: false };
    let moveSpeed = 6;
    let flyingMode = false;

    // ============ 碰撞 ============
    function isColliding(pos) {
        const minX = pos.x - CONST.PLAYER_W / 2, maxX = pos.x + CONST.PLAYER_W / 2;
        const minY = pos.y, maxY = pos.y + CONST.PLAYER_H;
        const minZ = pos.z - CONST.PLAYER_W / 2, maxZ = pos.z + CONST.PLAYER_W / 2;
        const x0 = Math.floor(minX), x1 = Math.floor(maxX);
        const y0 = Math.floor(minY), y1 = Math.floor(maxY);
        const z0 = Math.floor(minZ), z1 = Math.floor(maxZ);
        for (let x = x0; x <= x1; x++)
            for (let y = y0; y <= y1; y++)
                for (let z = z0; z <= z1; z++)
                    if (isSolid(x, y, z) &&
                        maxX > x && minX < x + 1 &&
                        maxY > y && minY < y + 1 &&
                        maxZ > z && minZ < z + 1) return true;
        return false;
    }
    function exactGroundY(pos) {
        const halfW = CONST.PLAYER_W / 2;
        const x0 = Math.floor(pos.x - halfW + 0.001);
        const x1 = Math.floor(pos.x + halfW - 0.001);
        const z0 = Math.floor(pos.z - halfW + 0.001);
        const z1 = Math.floor(pos.z + halfW - 0.001);
        let highest = -Infinity;
        for (let x = x0; x <= x1; x++) {
            for (let z = z0; z <= z1; z++) {
                for (let y = Math.floor(pos.y + CONST.PLAYER_H); y >= 0; y--) {
                    if (isSolid(x, y, z)) {
                        if (y + 1 > highest) highest = y + 1;
                        break;
                    }
                }
            }
        }
        return highest;
    }
    function sweepMove(axis, dist) {
        const n = Math.max(1, Math.ceil(Math.abs(dist) / CONST.SWEEP_STEP));
        const s = dist / n;
        for (let i = 0; i < n; i++) {
            const test = {
                x: player.pos.x + (axis === 'x' ? s : 0),
                y: player.pos.y + (axis === 'y' ? s : 0),
                z: player.pos.z + (axis === 'z' ? s : 0),
            };
            if (isColliding(test)) return true;
            player.pos.x = test.x;
            player.pos.y = test.y;
            player.pos.z = test.z;
        }
        return false;
    }
    // ★ 修复：把卡在方块里的玩家推出到最近的空位
    function unstickPlayer() {
        if (!isColliding(player.pos)) return;
        for (let dy = 0; dy < 10; dy += 0.1) {
            const test = { x: player.pos.x, y: player.pos.y + dy, z: player.pos.z };
            if (!isColliding(test)) {
                player.pos.y += dy;
                player.vy = 0;
                return;
            }
        }
    }

    // ============ 射线 ============
    const raycaster = new THREE.Raycaster();
    raycaster.far = 6;
    const _rayDir = new THREE.Vector3();
    function raycast() {
        camera.getWorldDirection(_rayDir);
        raycaster.set(camera.position, _rayDir);
        const hits = raycaster.intersectObjects([...renderedMeshes.values()], false);
        if (hits.length === 0) return null;
        const h = hits[0];
        return { block: h.object.userData, normal: h.face.normal.clone() };
    }

    // ============ 放置 / 破坏 ============
    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove('show'), 900);
    }

    // ★ 修复：重写沙子重力，从下往上处理整列
    function applyGravityToColumn(x, z, startY) {
        const sands = [];
        for (let y = startY; y < startY + 30; y++) {
            if (y < 1) continue;
            if (getBlockType(x, y, z) === 'sand') sands.push(y);
        }
        // 从下往上处理：最底下的沙子先落
        for (const sy of sands) {
            let ny = sy;
            while (ny > 1 && !isSolid(x, ny - 1, z)) ny--;
            if (ny !== sy) {
                setBlock(x, sy, z, null);
                removeMeshAt(x, sy, z);
                setBlock(x, ny, z, 'sand');
                addMeshAt(x, ny, z, 'sand');
            }
        }
    }

    function tryPlace() {
        const hit = raycast();
        if (!hit) return toast('没对准方块');
        const { x, y, z } = hit.block;
        const n = hit.normal;
        const tx = x + n.x, ty = y + n.y, tz = z + n.z;
        if (isSolid(tx, ty, tz)) return;
        const pMinX = player.pos.x - CONST.PLAYER_W / 2, pMaxX = player.pos.x + CONST.PLAYER_W / 2;
        const pMinY = player.pos.y, pMaxY = player.pos.y + CONST.PLAYER_H;
        const pMinZ = player.pos.z - CONST.PLAYER_W / 2, pMaxZ = player.pos.z + CONST.PLAYER_W / 2;
        if (pMaxX > tx && pMinX < tx + 1 && pMaxY > ty && pMinY < ty + 1 && pMaxZ > tz && pMinZ < tz + 1)
            return toast('会卡住自己');
        setBlock(tx, ty, tz, currentBlock);
        addMeshAt(tx, ty, tz, currentBlock);
        // 沙子落到地面
        if (currentBlock === 'sand') applyGravityToColumn(tx, tz, ty);
        scheduleSave();
    }
    function tryBreak() {
        const hit = raycast();
        if (!hit) return toast('没对准方块');
        const { x, y, z } = hit.block;
        if (y === 0) return toast('基岩无法破坏');
        const footX = Math.floor(player.pos.x), footZ = Math.floor(player.pos.z);
        const footY = Math.floor(player.pos.y - 0.05);
        if (x === footX && y === footY && z === footZ) return toast('不能挖脚下');
        setBlock(x, y, z, null);
        removeMeshAt(x, y, z);
        // 上方的沙子落下来
        applyGravityToColumn(x, z, y + 1);
        scheduleSave();
    }

    // ============ 存档 ============
    let saveTimer = null;
    function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveToLocal, 500); }
    function getSaveData() {
        return {
            version: 9, seed: WORLD_SEED, worldType,
            modifications: [...modifications],
            player: { x: player.pos.x, y: player.pos.y, z: player.pos.z, yaw: player.yaw, pitch: player.pitch },
            currentBlock,
            settings: { renderDistance, brightnessLevel, moveSpeed, flyingMode },
        };
    }
    function saveToLocal() {
        try { localStorage.setItem(CONST.SAVE_KEY, JSON.stringify(getSaveData())); }
        catch (e) { console.warn('存档失败', e); }
    }
    function applySaveData(data) {
        if (!data || typeof data !== 'object') return false;
        if (Number.isFinite(data.seed)) WORLD_SEED = data.seed;
        if (data.worldType === 'flat' || data.worldType === 'normal') worldType = data.worldType;
        modifications.clear();
        if (Array.isArray(data.modifications)) {
            for (const e of data.modifications) {
                if (Array.isArray(e) && e.length === 2) {
                    const [k, v] = e;
                    if (typeof k === 'string' && (v === null || BLOCK_CONFIG[v])) modifications.set(k, v);
                }
            }
        }
        if (data.player) {
            const px = Number(data.player.x), py = Number(data.player.y), pz = Number(data.player.z);
            const pyaw = Number(data.player.yaw), ppitch = Number(data.player.pitch);
            player.pos.set(
                Number.isFinite(px) ? px : 0.5,
                Number.isFinite(py) ? py : 30,
                Number.isFinite(pz) ? pz : 0.5
            );
            player.yaw = Number.isFinite(pyaw) ? pyaw : 0;
            player.pitch = Number.isFinite(ppitch)
                ? Math.max(-CONST.PITCH_LIMIT, Math.min(CONST.PITCH_LIMIT, ppitch))
                : -0.3;
        }
        if (data.currentBlock && BLOCK_CONFIG[data.currentBlock]) {
            currentBlock = data.currentBlock;
            updateHotbarSelection();
        }
        if (data.settings) {
            if (Number.isFinite(data.settings.renderDistance)) {
                renderDistance = Math.max(4, Math.min(14, data.settings.renderDistance));
                document.getElementById('renderDistSlider').value = renderDistance;
                document.getElementById('renderDistVal').textContent = renderDistance;
            }
            if (Number.isFinite(data.settings.brightnessLevel)) {
                brightnessLevel = Math.max(30, Math.min(150, data.settings.brightnessLevel));
                document.getElementById('brightnessSlider').value = brightnessLevel;
                document.getElementById('brightnessVal').textContent = brightnessLevel;
                updateBrightness();
            }
            if (Number.isFinite(data.settings.moveSpeed)) {
                moveSpeed = Math.max(3, Math.min(15, data.settings.moveSpeed));
                document.getElementById('speedSlider').value = moveSpeed;
                document.getElementById('speedVal').textContent = moveSpeed;
            }
            if (typeof data.settings.flyingMode === 'boolean') {
                flyingMode = data.settings.flyingMode;
                document.getElementById('flyToggle').checked = flyingMode;
            }
        }
        for (const mesh of renderedMeshes.values()) scene.remove(mesh);
        for (const light of torchLights.values()) scene.remove(light);
        renderedMeshes.clear();
        torchLights.clear();
        player.vy = 0;
        player.onGround = false;
        updateRender();
        return true;
    }
    function loadFromLocal() {
        try {
            const raw = localStorage.getItem(CONST.SAVE_KEY);
            if (!raw) return false;
            return applySaveData(JSON.parse(raw));
        } catch (e) { return false; }
    }
    function exportSave() {
        saveToLocal();
        const blob = new Blob([JSON.stringify(getSaveData(), null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const now = new Date();
        const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
        a.href = url;
        a.download = `minicraft-${stamp}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast('已导出存档');
    }
    function importSave() { document.getElementById('fileInput').click(); }
    document.getElementById('fileInput').addEventListener('change', e => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const data = JSON.parse(ev.target.result);
                if (applySaveData(data)) { saveToLocal(); toast('已导入存档'); }
                else toast('存档格式错误');
            } catch (err) { toast('读取失败'); }
        };
        reader.readAsText(file);
        e.target.value = '';
    });
    function resetWorld(newType) {
        if (!confirm('确定生成新世界吗？当前存档会丢失。')) return;
        localStorage.removeItem(CONST.SAVE_KEY);
        WORLD_SEED = Math.floor(Math.random() * 1e9);
        if (newType) worldType = newType;
        modifications.clear();
        for (const mesh of renderedMeshes.values()) scene.remove(mesh);
        for (const light of torchLights.values()) scene.remove(light);
        renderedMeshes.clear();
        torchLights.clear();
        player = { pos: randomSpawn(), yaw: Math.random() * Math.PI * 2, pitch: -0.3, vy: 0, onGround: false };
        updateRender();
        toast('新世界已生成');
    }

    // ============ 输入 ============
    let moveInput = { x: 0, y: 0 };
    let jumpRequested = false;
    let currentBlock = 'grass';

    const hotbar = document.getElementById('hotbar');
    const hotbarSlots = [];
    for (const k of HOTBAR_ORDER) {
        const slot = document.createElement('div');
        slot.className = 'hotbar-slot' + (k === currentBlock ? ' selected' : '');
        slot.dataset.type = k;
        slot.style.background = BLOCK_CONFIG[k].color || BLOCK_CONFIG[k].top;
        hotbar.appendChild(slot);
        hotbarSlots.push(slot);
    }
    function updateHotbarSelection() {
        hotbarSlots.forEach((s, i) => s.classList.toggle('selected', HOTBAR_ORDER[i] === currentBlock));
    }

    const joystick = document.getElementById('joystick');
    const knob = document.getElementById('joystick-knob');
    const hud = document.getElementById('hud');
    const hint = document.getElementById('longpressHint');
    let joyCenter = { x: 0, y: 0 };

    function joyMove(x, y) {
        const dx = x - joyCenter.x, dy = y - joyCenter.y;
        const dist = Math.hypot(dx, dy);
        const maxDist = 45;
        const clamped = Math.min(dist, maxDist);
        const angle = Math.atan2(dy, dx);
        const kx = Math.cos(angle) * clamped;
        const ky = Math.sin(angle) * clamped;
        knob.style.transform = `translate(${kx}px,${ky}px)`;
        moveInput.x = kx / maxDist;
        moveInput.y = ky / maxDist;
    }
    function joyEnd() {
        moveInput = { x: 0, y: 0 };
        knob.style.transform = 'translate(0,0)';
    }

    const pointInCircle = (x, y, r) => {
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        return Math.hypot(x - cx, y - cy) <= Math.min(r.width, r.height) / 2;
    };
    const pointInRect = (x, y, r) => x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
    function isInModal(x, y) {
        const sp = document.getElementById('settingsPanel');
        const ip = document.getElementById('inventoryPanel');
        if (sp.classList.contains('show') && pointInRect(x, y, sp.getBoundingClientRect())) return true;
        if (ip.classList.contains('show') && pointInRect(x, y, ip.getBoundingClientRect())) return true;
        return false;
    }
    function isModalOpen() {
        return document.getElementById('settingsPanel').classList.contains('show') ||
               document.getElementById('inventoryPanel').classList.contains('show');
    }

    function getUIElements() {
        return {
            jump: document.getElementById('jumpBtn').getBoundingClientRect(),
            joystick: joystick.getBoundingClientRect(),
            settings: document.getElementById('settingsBtn').getBoundingClientRect(),
            inventory: document.getElementById('inventoryBtn').getBoundingClientRect(),
            save: document.getElementById('saveBtn').getBoundingClientRect(),
            load: document.getElementById('loadBtn').getBoundingClientRect(),
            reset: document.getElementById('resetBtn').getBoundingClientRect(),
            slots: [...document.querySelectorAll('.hotbar-slot')].map(el => ({
                el, rect: el.getBoundingClientRect(), type: el.dataset.type
            })),
        };
    }

    const activeTouches = new Map();

    document.addEventListener('touchstart', e => {
        let anyInModal = false;
        for (const t of e.changedTouches) {
            if (isInModal(t.clientX, t.clientY)) { anyInModal = true; break; }
        }
        if (anyInModal) return;
        if (isModalOpen()) return;

        const ui = getUIElements();
        for (const t of e.changedTouches) {
            const x = t.clientX, y = t.clientY;
            if (pointInRect(x, y, ui.settings))  { openSettings(); activeTouches.set(t.identifier, { type: 'ui' }); continue; }
            if (pointInRect(x, y, ui.inventory)) { openInventory(); activeTouches.set(t.identifier, { type: 'ui' }); continue; }
            if (pointInRect(x, y, ui.save))      { exportSave(); activeTouches.set(t.identifier, { type: 'ui' }); continue; }
            if (pointInRect(x, y, ui.load))      { importSave(); activeTouches.set(t.identifier, { type: 'ui' }); continue; }
            if (pointInRect(x, y, ui.reset))     { resetWorld(); activeTouches.set(t.identifier, { type: 'ui' }); continue; }
            if (pointInCircle(x, y, ui.jump)) {
                jumpRequested = true;
                activeTouches.set(t.identifier, { type: 'jump' });
                continue;
            }
            let slotHit = null;
            for (const s of ui.slots) if (pointInCircle(x, y, s.rect)) { slotHit = s; break; }
            if (slotHit) {
                currentBlock = slotHit.type;
                updateHotbarSelection();
                activeTouches.set(t.identifier, { type: 'ui' });
                continue;
            }
            if (pointInCircle(x, y, ui.joystick)) {
                const r = joystick.getBoundingClientRect();
                joyCenter = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
                joyMove(x, y);
                activeTouches.set(t.identifier, { type: 'joystick' });
                continue;
            }
            const state = {
                type: 'empty', startX: x, startY: y, lastX: x, lastY: y,
                moved: false, longPressFired: false, longPressTimer: null,
            };
            state.longPressTimer = setTimeout(() => {
                if (!state.moved) {
                    state.longPressFired = true;
                    tryBreak();
                    hint.style.left = x + 'px'; hint.style.top = y + 'px';
                    hint.classList.add('active');
                    setTimeout(() => hint.classList.remove('active'), 150);
                }
            }, CONST.LONG_PRESS_MS);
            activeTouches.set(t.identifier, state);
        }
        e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchmove', e => {
        for (const t of e.changedTouches) if (isInModal(t.clientX, t.clientY)) return;
        for (const t of e.changedTouches) {
            const info = activeTouches.get(t.identifier);
            if (!info) continue;
            if (info.type === 'joystick') {
                joyMove(t.clientX, t.clientY);
            } else if (info.type === 'empty') {
                const dx = t.clientX - info.lastX, dy = t.clientY - info.lastY;
                if (Math.hypot(t.clientX - info.startX, t.clientY - info.startY) > CONST.MOVE_THRESHOLD) {
                    info.moved = true;
                    if (info.longPressTimer) { clearTimeout(info.longPressTimer); info.longPressTimer = null; }
                }
                if (info.moved) {
                    player.yaw -= dx * 0.005;
                    if (player.yaw > Math.PI) player.yaw -= 2 * Math.PI;
                    else if (player.yaw < -Math.PI) player.yaw += 2 * Math.PI;
                    player.pitch = Math.max(-CONST.PITCH_LIMIT, Math.min(CONST.PITCH_LIMIT, player.pitch - dy * 0.005));
                }
                info.lastX = t.clientX; info.lastY = t.clientY;
            }
        }
        e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchend', e => {
        for (const t of e.changedTouches) if (isInModal(t.clientX, t.clientY)) return;
        for (const t of e.changedTouches) {
            const info = activeTouches.get(t.identifier);
            if (!info) continue;
            if (info.type === 'joystick') joyEnd();
            else if (info.type === 'empty') {
                if (info.longPressTimer) clearTimeout(info.longPressTimer);
                if (!info.moved && !info.longPressFired) tryPlace();
            }
            activeTouches.delete(t.identifier);
        }
    });

    document.addEventListener('touchcancel', e => {
        for (const t of e.changedTouches) {
            const info = activeTouches.get(t.identifier);
            if (!info) continue;
            if (info.type === 'joystick') joyEnd();
            if (info.longPressTimer) clearTimeout(info.longPressTimer);
            activeTouches.delete(t.identifier);
        }
    });

    // ============ 物理 ============
    function physicsStep(dt) {
        const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
        const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
        const move = new THREE.Vector3();
        move.addScaledVector(forward, -moveInput.y);
        move.addScaledVector(right, moveInput.x);
        if (move.length() > 1) move.normalize();

        // ★ 修复：飞行模式 - 悬停 + 跳键上升，水平移动保留
        if (flyingMode) {
            sweepMove('x', move.x * moveSpeed * dt);
            sweepMove('z', move.z * moveSpeed * dt);
            if (jumpRequested) {
                const tryPos = player.pos.clone();
                tryPos.y += moveSpeed * dt;
                if (!isColliding(tryPos)) player.pos.y = tryPos.y;
            }
            jumpRequested = false;
            player.vy = 0;
            player.onGround = false;
            return;
        }

        sweepMove('x', move.x * moveSpeed * dt);
        sweepMove('z', move.z * moveSpeed * dt);

        if (jumpRequested && player.onGround) {
            player.vy = CONST.JUMP_SPEED;
            player.onGround = false;
        }
        jumpRequested = false;
        player.vy -= CONST.GRAVITY * dt;
        player.vy = Math.max(player.vy, -30);
        const hit = sweepMove('y', player.vy * dt);
        if (hit) {
            if (player.vy < 0) {
                const g = exactGroundY(player.pos);
                if (g > -Infinity && g <= player.pos.y + 0.1) player.pos.y = g;
                player.vy = 0; player.onGround = true;
            } else {
                player.vy = 0; player.onGround = false;
            }
        } else {
            const below = { x: player.pos.x, y: player.pos.y - 0.05, z: player.pos.z };
            player.onGround = isColliding(below);
            if (player.onGround) {
                const g = exactGroundY(player.pos);
                if (g > -Infinity && g <= player.pos.y + 0.1) player.pos.y = g;
                player.vy = 0;
            }
        }
    }

    // ============ 相机 ============
    const _yAxis = new THREE.Vector3(0, 1, 0);
    const _xAxis = new THREE.Vector3(1, 0, 0);
    const _yawQuat = new THREE.Quaternion();
    const _pitchQuat = new THREE.Quaternion();
    function updateCamera() {
        camera.position.set(player.pos.x, player.pos.y + CONST.EYE_H, player.pos.z);
        _yawQuat.setFromAxisAngle(_yAxis, player.yaw);
        _pitchQuat.setFromAxisAngle(_xAxis, player.pitch);
        camera.quaternion.copy(_yawQuat).multiply(_pitchQuat);
        const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
        if (Math.abs(e.z) > 1e-6) { e.z = 0; camera.quaternion.setFromEuler(e); }
    }

    // ============ 面板事件 ============
    function bindTap(el, handler) {
        el.addEventListener('pointerdown', e => {
            e.preventDefault(); e.stopPropagation();
            handler();
        });
    }
    const settingsPanel = document.getElementById('settingsPanel');
    const inventoryPanel = document.getElementById('inventoryPanel');
    function openSettings() { settingsPanel.classList.add('show'); }
    function closeSettings() { settingsPanel.classList.remove('show'); }
    function openInventory() {
        const grid = document.getElementById('inventoryGrid');
        grid.innerHTML = '';
        for (const k in BLOCK_CONFIG) {
            const slot = document.createElement('div');
            slot.className = 'inv-slot' + (k === currentBlock ? ' selected' : '');
            slot.style.background = BLOCK_CONFIG[k].color || BLOCK_CONFIG[k].top;
            slot.textContent = BLOCK_CONFIG[k].name;
            slot.addEventListener('pointerdown', e => {
                e.preventDefault(); e.stopPropagation();
                currentBlock = k;
                updateHotbarSelection();
                openInventory();
            });
            grid.appendChild(slot);
        }
        inventoryPanel.classList.add('show');
    }
    function closeInventory() { inventoryPanel.classList.remove('show'); }

    bindTap(document.getElementById('settingsBtn'), openSettings);
    bindTap(document.getElementById('inventoryBtn'), openInventory);
    bindTap(document.getElementById('saveBtn'), exportSave);
    bindTap(document.getElementById('loadBtn'), importSave);
    bindTap(document.getElementById('resetBtn'), () => resetWorld());
    bindTap(document.getElementById('closeSettings'), closeSettings);
    bindTap(document.getElementById('closeInventory'), closeInventory);
    bindTap(document.getElementById('applyWorldBtn'), () => {
        const t = document.getElementById('worldTypeSelect').value;
        worldType = t;
        closeSettings();
        resetWorld(t);
    });
    document.getElementById('renderDistSlider').addEventListener('input', e => {
        renderDistance = Number(e.target.value);
        document.getElementById('renderDistVal').textContent = renderDistance;
        updateRender();
    });
    document.getElementById('brightnessSlider').addEventListener('input', e => {
        brightnessLevel = Number(e.target.value);
        document.getElementById('brightnessVal').textContent = brightnessLevel;
        updateBrightness();
    });
    document.getElementById('speedSlider').addEventListener('input', e => {
        moveSpeed = Number(e.target.value);
        document.getElementById('speedVal').textContent = moveSpeed;
    });
    // ★ 修复：切换飞行模式时如果卡住则推出
    document.getElementById('flyToggle').addEventListener('change', e => {
        flyingMode = e.target.checked;
        if (!flyingMode) {
            player.vy = 0;
            unstickPlayer();
        }
    });

    // ============ 主循环 ============
    function resizeRenderer() {
        const w = document.documentElement.clientWidth || window.innerWidth;
        const h = document.documentElement.clientHeight || window.innerHeight;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setSize(w, h, false);
        canvasElement.style.width = w + 'px';
        canvasElement.style.height = h + 'px';
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    }
    resizeRenderer();

    let lastTime = performance.now();
    let accumulator = 0;
    let fpsTimer = 0, fpsCount = 0, renderTimer = 0, hudTimer = 0, resizeTimer = 0;

    function update() {
        const now = performance.now();
        const frameTime = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        resizeTimer += frameTime;
        if (resizeTimer > 2) {
            resizeTimer = 0;
            const w = document.documentElement.clientWidth || window.innerWidth;
            const h = document.documentElement.clientHeight || window.innerHeight;
            if (Math.abs(camera.aspect - w / h) > 0.01) resizeRenderer();
        }
        accumulator += frameTime;
        let steps = 0;
        while (accumulator >= CONST.FIXED_DT && steps < 5) {
            physicsStep(CONST.FIXED_DT);
            accumulator -= CONST.FIXED_DT;
            steps++;
        }
        if (player.pos.y < -30) {
            player.pos = randomSpawn();
            player.vy = 0; player.onGround = false;
        }
        renderTimer += frameTime;
        if (renderTimer > 0.25) { renderTimer = 0; updateRender(); }
        sunLight.position.set(player.pos.x + 30, player.pos.y + 50, player.pos.z + 30);
        updateCamera();
        renderer.render(scene, camera);
        fpsCount++; fpsTimer += frameTime; hudTimer += frameTime;
        if (hudTimer >= 0.5) {
            hud.innerHTML =
                `FPS: ${Math.round(fpsCount / fpsTimer)}<br>` +
                `位置: ${player.pos.x.toFixed(1)}, ${player.pos.y.toFixed(1)}, ${player.pos.z.toFixed(1)}<br>` +
                `生物群系: ${getBiome(Math.floor(player.pos.x), Math.floor(player.pos.z))}<br>` +
                `方块: ${renderedMeshes.size} | 种子: ${WORLD_SEED}`;
            fpsCount = 0; fpsTimer = 0; hudTimer = 0;
        }
        requestAnimationFrame(update);
    }

    window.addEventListener('resize', resizeRenderer);
    window.addEventListener('orientationchange', () => setTimeout(resizeRenderer, 200));
    window.addEventListener('beforeunload', saveToLocal);

    if (loadFromLocal()) {
        setTimeout(() => toast('已读取存档'), 500);
    } else {
        WORLD_SEED = Math.floor(Math.random() * 1e9);
        player.pos = randomSpawn();
    }
    updateBrightness();
    updateRender();
    update();
    </script>
</body>
</html>

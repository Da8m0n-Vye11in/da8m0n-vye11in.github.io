<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MiniCraft</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #87CEEB;
            -webkit-user-select: none; user-select: none; touch-action: none;
            position: fixed; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
        #crosshair {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 24px; height: 24px; pointer-events: none; z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: white;
            box-shadow: 0 0 2px black;
        }
        #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
        #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
        #joystick {
            position: fixed; left: 30px; bottom: 40px;
            width: 140px; height: 140px; border-radius: 50%;
            background: rgba(255,255,255,0.3); z-index: 100;
            pointer-events: none;
        }
        #joystick-knob {
            position: absolute; left: 50px; top: 50px;
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.95);
        }
        #jumpBtn {
            position: fixed; right: 30px; bottom: 60px;
            width: 90px; height: 90px; border-radius: 50%;
            background: rgba(33,150,243,0.85);
            color: white; font-size: 24px; font-weight: bold;
            z-index: 100; text-align: center; line-height: 90px;
            pointer-events: none;
        }
        #blockBar {
            position: fixed; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 100;
            pointer-events: none;
        }
        .block-slot {
            width: 50px; height: 50px; border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.6);
        }
        .block-slot.selected { border-color: yellow; border-width: 3px; }
        #hud {
            position: fixed; top: 20px; left: 20px; color: white;
            font-family: monospace; font-size: 12px; z-index: 100;
            text-shadow: 1px 1px 2px black; pointer-events: none;
            line-height: 1.6; background: rgba(0,0,0,0.4);
            padding: 6px 10px; border-radius: 6px;
        }
        #longpressHint {
            position: fixed; pointer-events: none; z-index: 50;
            width: 80px; height: 80px; border-radius: 50%;
            border: 3px solid rgba(255,0,0,0.8);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.1s ease-out;
        }
        #longpressHint.active {
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="hud">加载中...</div>
    <div id="blockBar"></div>
    <div id="joystick"><div id="joystick-knob"></div></div>
    <div id="jumpBtn">跳</div>
    <div id="longpressHint"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
    <script>
    // ============ 方块配置 ============
    const BLOCK_CONFIG = {
        grass: { id: 1, name: '草方块', color: '#5fa845', solid: true },
        dirt:  { id: 2, name: '泥土',   color: '#8b5a2b', solid: true },
        stone: { id: 3, name: '石头',   color: '#888888', solid: true },
    };

    function makeNoiseTexture(hexColor) {
        const canvas = document.createElement('canvas');
        canvas.width = 16; canvas.height = 16;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = hexColor;
        ctx.fillRect(0, 0, 16, 16);
        for (let i = 0; i < 100; i++) {
            const x = Math.floor(Math.random() * 16);
            const y = Math.floor(Math.random() * 16);
            const a = (Math.random() * 0.35).toFixed(2);
            ctx.fillStyle = Math.random() > 0.5 ? `rgba(0,0,0,${a})` : `rgba(255,255,255,${a})`;
            ctx.fillRect(x, y, 1, 1);
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        return tex;
    }

    const BLOCK_GEOMETRY = new THREE.BoxGeometry(1, 1, 1);
    const BLOCK_MATERIALS = {};
    for (const key in BLOCK_CONFIG) {
        BLOCK_MATERIALS[key] = new THREE.MeshLambertMaterial({
            map: makeNoiseTexture(BLOCK_CONFIG[key].color),
        });
    }
    const EDGES_GEOMETRY = new THREE.EdgesGeometry(BLOCK_GEOMETRY);
    const EDGES_MATERIAL = new THREE.LineBasicMaterial({ color: 0x000000, opacity: 0.25, transparent: true });

    // ============ 常量 ============
    const GRAVITY = 22;
    const JUMP_SPEED = 8.5;
    const MOVE_SPEED = 6;
    const PLAYER_WIDTH = 0.6;
    const PLAYER_HEIGHT = 1.8;
    const EYE_HEIGHT = 1.6;
    const RENDER_RADIUS = 10;

    // ============ 场景 ============
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 20, 55);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.domElement.style.position = 'fixed';
    renderer.domElement.style.top = '0';
    renderer.domElement.style.left = '0';
    renderer.domElement.style.zIndex = '1';
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const sun = new THREE.DirectionalLight(0xffffff, 0.7);
    sun.position.set(30, 50, 30);
    scene.add(sun);

    // ============ 世界数据 ============
    const modifications = new Map();
    const worldKey = (x, y, z) => `${x},${y},${z}`;

    function generateBlock(x, y, z) {
        if (y === -2) return 'stone';
        if (y === -1) return 'dirt';
        if (y === 0) return 'grass';
        return null;
    }

    function getBlockType(x, y, z) {
        const k = worldKey(x, y, z);
        if (modifications.has(k)) return modifications.get(k);
        return generateBlock(x, y, z);
    }

    function isSolid(x, y, z) {
        return getBlockType(x, y, z) !== null;
    }

    function setBlock(x, y, z, type) {
        modifications.set(worldKey(x, y, z), type);
    }

    // ============ 动态渲染 ============
    const renderedMeshes = new Map();

    function addMeshAt(x, y, z, type) {
        const k = worldKey(x, y, z);
        if (renderedMeshes.has(k)) return;
        const mesh = new THREE.Mesh(BLOCK_GEOMETRY, BLOCK_MATERIALS[type]);
        mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
        mesh.userData = { x, y, z, type };
        mesh.add(new THREE.LineSegments(EDGES_GEOMETRY, EDGES_MATERIAL));
        scene.add(mesh);
        renderedMeshes.set(k, mesh);
    }

    function removeMeshAt(x, y, z) {
        const k = worldKey(x, y, z);
        const mesh = renderedMeshes.get(k);
        if (mesh) {
            scene.remove(mesh);
            renderedMeshes.delete(k);
        }
    }

    function updateRender() {
        const cx = Math.floor(player.pos.x);
        const cz = Math.floor(player.pos.z);
        const needed = new Set();

        // 程序化地形
        for (let dx = -RENDER_RADIUS; dx <= RENDER_RADIUS; dx++) {
            for (let dz = -RENDER_RADIUS; dz <= RENDER_RADIUS; dz++) {
                const x = cx + dx;
                const z = cz + dz;
                for (let y = -2; y <= 0; y++) {
                    const k = worldKey(x, y, z);
                    if (modifications.has(k)) {
                        const t = modifications.get(k);
                        if (t === null) continue;
                        needed.add(k);
                        if (!renderedMeshes.has(k)) addMeshAt(x, y, z, t);
                        continue;
                    }
                    const type = generateBlock(x, y, z);
                    if (type !== null) {
                        needed.add(k);
                        if (!renderedMeshes.has(k)) addMeshAt(x, y, z, type);
                    }
                }
            }
        }

        // 玩家放的方块（y 任意）
        for (const [k, type] of modifications) {
            if (type === null) continue;
            const [x, y, z] = k.split(',').map(Number);
            if (Math.abs(x - cx) <= RENDER_RADIUS && Math.abs(z - cz) <= RENDER_RADIUS) {
                needed.add(k);
                if (!renderedMeshes.has(k)) addMeshAt(x, y, z, type);
            }
        }

        // 卸载
        for (const k of [...renderedMeshes.keys()]) {
            if (!needed.has(k)) {
                const mesh = renderedMeshes.get(k);
                scene.remove(mesh);
                renderedMeshes.delete(k);
            }
        }
    }

    // ============ 玩家 ============
    const player = {
        pos: new THREE.Vector3(0, 3, 0),
        yaw: 0,
        pitch: -0.3,
        vy: 0,
        onGround: false,
    };

    // ============ 碰撞检测 ============
    function isColliding(pos) {
        const minX = pos.x - PLAYER_WIDTH / 2;
        const maxX = pos.x + PLAYER_WIDTH / 2;
        const minY = pos.y;
        const maxY = pos.y + PLAYER_HEIGHT;
        const minZ = pos.z - PLAYER_WIDTH / 2;
        const maxZ = pos.z + PLAYER_WIDTH / 2;

        const x0 = Math.floor(minX), x1 = Math.floor(maxX);
        const y0 = Math.floor(minY), y1 = Math.floor(maxY);
        const z0 = Math.floor(minZ), z1 = Math.floor(maxZ);

        for (let x = x0; x <= x1; x++) {
            for (let y = y0; y <= y1; y++) {
                for (let z = z0; z <= z1; z++) {
                    if (!isSolid(x, y, z)) continue;
                    if (maxX > x && minX < x + 1 &&
                        maxY > y && minY < y + 1 &&
                        maxZ > z && minZ < z + 1) {
                        return true;
                    }
                }
            }
        }
        return false;
    }

    // ★ 关键：找玩家 AABB 覆盖的**所有列**中最高的地面高度
    function exactGroundY(pos) {
        const halfW = PLAYER_WIDTH / 2;
        const minX = Math.floor(pos.x - halfW + 0.001);
        const maxX = Math.floor(pos.x + halfW - 0.001);
        const minZ = Math.floor(pos.z - halfW + 0.001);
        const maxZ = Math.floor(pos.z + halfW - 0.001);

        let highest = -Infinity;
        for (let x = minX; x <= maxX; x++) {
            for (let z = minZ; z <= maxZ; z++) {
                for (let y = Math.floor(pos.y + PLAYER_HEIGHT); y >= -10; y--) {
                    if (isSolid(x, y, z)) {
                        if (y + 1 > highest) highest = y + 1;
                        break;
                    }
                }
            }
        }
        return highest;
    }

    // ============ 射线检测 ============
    const raycaster = new THREE.Raycaster();
    raycaster.far = 6;

    function raycast() {
        const dir = new THREE.Vector3(
            -Math.sin(player.yaw) * Math.cos(player.pitch),
            Math.sin(player.pitch),
            -Math.cos(player.yaw) * Math.cos(player.pitch)
        );
        raycaster.set(camera.position, dir);
        const meshes = [...renderedMeshes.values()];
        const hits = raycaster.intersectObjects(meshes, false);
        if (hits.length === 0) return null;
        const h = hits[0];
        return { block: h.object.userData, normal: h.face.normal.clone() };
    }

    // ============ 放置 / 破坏 ============
    let lastAction = '初始化';
    function flash(msg) { lastAction = msg; }

    function tryPlace() {
        const hit = raycast();
        if (!hit) { flash('放 ✗ 准星没对准方块'); return; }
        const { x, y, z } = hit.block;
        const n = hit.normal;
        const tx = x + n.x, ty = y + n.y, tz = z + n.z;

        if (isSolid(tx, ty, tz)) { flash('放 ✗ 位置已占用'); return; }

        const pMinX = player.pos.x - PLAYER_WIDTH / 2;
        const pMaxX = player.pos.x + PLAYER_WIDTH / 2;
        const pMinY = player.pos.y;
        const pMaxY = player.pos.y + PLAYER_HEIGHT;
        const pMinZ = player.pos.z - PLAYER_WIDTH / 2;
        const pMaxZ = player.pos.z + PLAYER_WIDTH / 2;

        if (pMaxX > tx && pMinX < tx + 1 &&
            pMaxY > ty && pMinY < ty + 1 &&
            pMaxZ > tz && pMinZ < tz + 1) {
            flash('放 ✗ 会卡住自己');
            return;
        }

        setBlock(tx, ty, tz, currentBlock);
        addMeshAt(tx, ty, tz, currentBlock);
        flash(`放 ✓ ${tx},${ty},${tz}`);
    }

    function tryBreak() {
        const hit = raycast();
        if (!hit) { flash('挖 ✗ 准星没对准方块'); return; }
        const { x, y, z } = hit.block;

        if (y <= -2) { flash('挖 ✗ 基岩'); return; }

        const footX = Math.floor(player.pos.x);
        const footZ = Math.floor(player.pos.z);
        const footY = Math.floor(player.pos.y - 0.05);
        if (x === footX && y === footY && z === footZ) {
            flash('挖 ✗ 不能挖脚下');
            return;
        }

        setBlock(x, y, z, null);
        removeMeshAt(x, y, z);
        flash(`挖 ✓ ${x},${y},${z}`);
    }

    // ============ 输入 ============
    let moveInput = { x: 0, y: 0 };
    let jumpRequested = false;
    let currentBlock = 'grass';

    const blockBar = document.getElementById('blockBar');
    for (const k in BLOCK_CONFIG) {
        const el = document.createElement('div');
        el.className = 'block-slot' + (k === currentBlock ? ' selected' : '');
        el.dataset.type = k;
        el.style.background = BLOCK_CONFIG[k].color;
        blockBar.appendChild(el);
    }

    function pointInCircle(x, y, rect) {
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const r = Math.min(rect.width, rect.height) / 2;
        return Math.hypot(x - cx, y - cy) <= r;
    }

    function getUIElements() {
        return {
            jump: document.getElementById('jumpBtn').getBoundingClientRect(),
            joystick: document.getElementById('joystick').getBoundingClientRect(),
            slots: [...document.querySelectorAll('.block-slot')].map(el => ({
                el, rect: el.getBoundingClientRect(), type: el.dataset.type
            })),
        };
    }

    const joystick = document.getElementById('joystick');
    const knob = document.getElementById('joystick-knob');
    let joyCenter = { x: 0, y: 0 };

    function joyMove(x, y) {
        const dx = x - joyCenter.x;
        const dy = y - joyCenter.y;
        const dist = Math.hypot(dx, dy);
        const maxDist = 50;
        const clamped = Math.min(dist, maxDist);
        const angle = Math.atan2(dy, dx);
        const kx = Math.cos(angle) * clamped;
        const ky = Math.sin(angle) * clamped;
        knob.style.transform = `translate(${kx}px, ${ky}px)`;
        moveInput.x = kx / maxDist;
        moveInput.y = ky / maxDist;
    }

    function joyEnd() {
        moveInput = { x: 0, y: 0 };
        knob.style.transform = 'translate(0, 0)';
    }

    const activeTouches = new Map();
    const LONG_PRESS_MS = 450;
    const MOVE_THRESHOLD = 25;

    document.addEventListener('touchstart', e => {
        const ui = getUIElements();

        for (const t of e.changedTouches) {
            const x = t.clientX;
            const y = t.clientY;

            if (pointInCircle(x, y, ui.jump)) {
                jumpRequested = true;
                flash('跳');
                activeTouches.set(t.identifier, { type: 'jump' });
                continue;
            }

            let slotHit = null;
            for (const s of ui.slots) {
                if (pointInCircle(x, y, s.rect)) { slotHit = s; break; }
            }
            if (slotHit) {
                document.querySelectorAll('.block-slot').forEach(s => s.classList.remove('selected'));
                slotHit.el.classList.add('selected');
                currentBlock = slotHit.type;
                flash(`选择: ${BLOCK_CONFIG[currentBlock].name}`);
                activeTouches.set(t.identifier, { type: 'slot' });
                continue;
            }

            if (pointInCircle(x, y, ui.joystick)) {
                const rect = joystick.getBoundingClientRect();
                joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                joyMove(x, y);
                activeTouches.set(t.identifier, { type: 'joystick' });
                continue;
            }

            const state = {
                type: 'empty',
                startX: x, startY: y,
                lastX: x, lastY: y,
                moved: false,
                longPressFired: false,
                longPressTimer: null,
            };
            state.longPressTimer = setTimeout(() => {
                if (!state.moved) {
                    state.longPressFired = true;
                    tryBreak();
                    hint.style.left = x + 'px';
                    hint.style.top = y + 'px';
                    hint.classList.add('active');
                    setTimeout(() => hint.classList.remove('active'), 150);
                }
            }, LONG_PRESS_MS);
            activeTouches.set(t.identifier, state);
        }
        e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchmove', e => {
        for (const t of e.changedTouches) {
            const info = activeTouches.get(t.identifier);
            if (!info) continue;

            if (info.type === 'joystick') {
                joyMove(t.clientX, t.clientY);
            } else if (info.type === 'empty') {
                const dx = t.clientX - info.lastX;
                const dy = t.clientY - info.lastY;
                const totalMove = Math.hypot(t.clientX - info.startX, t.clientY - info.startY);

                if (totalMove > MOVE_THRESHOLD) {
                    info.moved = true;
                    if (info.longPressTimer) {
                        clearTimeout(info.longPressTimer);
                        info.longPressTimer = null;
                    }
                }

                if (info.moved) {
                    player.yaw -= dx * 0.005;
                    player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch - dy * 0.005));
                }
                info.lastX = t.clientX;
                info.lastY = t.clientY;
            }
        }
        e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchend', e => {
        for (const t of e.changedTouches) {
            const info = activeTouches.get(t.identifier);
            if (!info) continue;

            if (info.type === 'joystick') {
                joyEnd();
            } else if (info.type === 'empty') {
                if (info.longPressTimer) {
                    clearTimeout(info.longPressTimer);
                    info.longPressTimer = null;
                }
                if (!info.moved && !info.longPressFired) {
                    tryPlace();
                }
            }
            activeTouches.delete(t.identifier);
        }
    });

    document.addEventListener('touchcancel', e => {
        for (const t of e.changedTouches) {
            const info = activeTouches.get(t.identifier);
            if (!info) continue;
            if (info.type === 'joystick') joyEnd();
            if (info.longPressTimer) clearTimeout(info.longPressTimer);
            activeTouches.delete(t.identifier);
        }
    });

    // ============ 游戏循环 ============
    const hud = document.getElementById('hud');
    const hint = document.getElementById('longpressHint');

    let lastTime = performance.now();
    let accumulator = 0;
    const FIXED_DT = 1 / 60;
    let fpsTimer = 0, fpsCount = 0, renderTimer = 0;

    // ★ 分步移动辅助：从当前位置沿某个轴移动 dist，遇到碰撞停下
    function sweepMove(axis, dist) {
        const step = 0.05;
        const n = Math.max(1, Math.ceil(Math.abs(dist) / step));
        const s = dist / n;
        for (let i = 0; i < n; i++) {
            const test = {
                x: player.pos.x + (axis === 'x' ? s : 0),
                y: player.pos.y + (axis === 'y' ? s : 0),
                z: player.pos.z + (axis === 'z' ? s : 0),
            };
            if (isColliding(test)) return true; // 撞到了
            player.pos.x = test.x;
            player.pos.y = test.y;
            player.pos.z = test.z;
        }
        return false;
    }

    function physicsStep(dt) {
        // ---- 水平移动（分轴 + 分步） ----
        const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
        const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
        const move = new THREE.Vector3();
        move.addScaledVector(forward, -moveInput.y);
        move.addScaledVector(right, moveInput.x);
        if (move.length() > 1) move.normalize();

        sweepMove('x', move.x * MOVE_SPEED * dt);
        sweepMove('z', move.z * MOVE_SPEED * dt);

        // ---- 跳跃 ----
        if (jumpRequested && player.onGround) {
            player.vy = JUMP_SPEED;
            player.onGround = false;
        }
        jumpRequested = false;

        // ---- 重力 ----
        player.vy -= GRAVITY * dt;
        player.vy = Math.max(player.vy, -30);

        // ---- 垂直移动（分步扫描，绝不穿模） ----
        const dy = player.vy * dt;
        const hit = sweepMove('y', dy);

        if (hit) {
            if (player.vy < 0) {
                // 向下撞到：精确吸附到地面
                const groundY = exactGroundY(player.pos);
                if (groundY > -Infinity && groundY <= player.pos.y + 0.1) {
                    player.pos.y = groundY;
                }
                player.vy = 0;
                player.onGround = true;
            } else {
                // 向上撞头
                player.vy = 0;
                player.onGround = false;
            }
        } else {
            // 没撞到：检查是否还着地（从平台上走下去的情况）
            const below = { x: player.pos.x, y: player.pos.y - 0.05, z: player.pos.z };
            player.onGround = isColliding(below);
            if (player.onGround) {
                // 精确吸附，消除悬浮误差
                const groundY = exactGroundY(player.pos);
                if (groundY > -Infinity && groundY <= player.pos.y + 0.1) {
                    player.pos.y = groundY;
                }
                player.vy = 0;
            }
        }
    }

    function update() {
        const now = performance.now();
        const frameTime = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        accumulator += frameTime;
        let steps = 0;
        while (accumulator >= FIXED_DT && steps < 5) {
            physicsStep(FIXED_DT);
            accumulator -= FIXED_DT;
            steps++;
        }

        if (player.pos.y < -20) {
            player.pos.set(0, 3, 0);
            player.vy = 0;
            player.onGround = false;
        }

        renderTimer += frameTime;
        if (renderTimer > 0.15) {
            renderTimer = 0;
            updateRender();
        }

        camera.position.set(player.pos.x, player.pos.y + EYE_HEIGHT, player.pos.z);
        camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

        renderer.render(scene, camera);

        fpsCount++; fpsTimer += frameTime;
        if (fpsTimer >= 0.5) {
            hud.innerHTML =
                `FPS: ${Math.round(fpsCount / fpsTimer)}<br>` +
                `位置: ${player.pos.x.toFixed(2)}, ${player.pos.y.toFixed(2)}, ${player.pos.z.toFixed(2)}<br>` +
                `状态: ${player.onGround ? '着地' : '空中'} | 方块: ${renderedMeshes.size}<br>` +
                `操作: ${lastAction}`;
            fpsCount = 0; fpsTimer = 0;
        }

        requestAnimationFrame(update);
    }

    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });

    updateRender();
    update();
    </script>
</body>
</html>

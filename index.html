<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tessera Pre 0.65_06x</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#87CEEB;-webkit-user-select:none;user-select:none;touch-action:none;position:fixed;font-family:ui-monospace,Menlo,monospace}
#gameCanvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:28px;height:28px;pointer-events:none;z-index:10}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#fff;box-shadow:0 0 3px #000}
#crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
#crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
#hud{position:fixed;top:16px;left:16px;color:#fff;font-size:11px;line-height:1.55;text-shadow:1px 1px 2px #000;background:rgba(0,0,0,.5);padding:6px 10px;border-radius:4px;z-index:100;pointer-events:none}
#topBar{position:fixed;top:16px;right:16px;display:flex;gap:6px;z-index:150}
.mc-btn{padding:10px 14px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.4);border-radius:4px;color:#fff;font-size:14px;font-family:inherit;cursor:pointer}
.mc-btn:active{background:rgba(80,80,80,.85)}
#hotbarWrapper{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:100;pointer-events:none}
#menuBtn3{width:50px;height:50px;border-radius:6px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.35);color:#fff;font-size:22px;text-align:center;line-height:46px;cursor:pointer;pointer-events:auto}
#menuBtn3:active{background:rgba(80,80,80,.85)}
#hotbar{display:flex;gap:3px;padding:4px;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.35);border-radius:4px}
.hotbar-slot{width:42px;height:42px;border-radius:2px;background:rgba(80,80,80,.6);border:2px solid rgba(255,255,255,.2);position:relative}
.hotbar-slot.selected{border:3px solid #fff;box-shadow:0 0 8px rgba(255,255,255,.8)}
.hotbar-slot.empty{opacity:.3}
.hotbar-count{position:absolute;bottom:1px;right:3px;font-size:11px;color:#fff;text-shadow:1px 1px 2px #000;font-weight:bold}
.hotbar-num{position:absolute;top:1px;left:3px;font-size:9px;color:rgba(255,255,255,.6)}
#joystick{position:fixed;left:30px;bottom:100px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.22);z-index:100;pointer-events:none}
#joystick-knob{position:absolute;left:45px;top:45px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95)}
#jumpBtn{position:fixed;right:30px;bottom:130px;width:84px;height:84px;border-radius:50%;background:rgba(80,180,100,.85);border:3px solid rgba(255,255,255,.5);color:#fff;font-size:20px;font-weight:bold;text-align:center;line-height:78px;z-index:100;pointer-events:none;user-select:none}
#downBtn{position:fixed;right:30px;bottom:40px;width:84px;height:84px;border-radius:50%;background:rgba(180,80,80,.85);border:3px solid rgba(255,255,255,.5);color:#fff;font-size:22px;font-weight:bold;text-align:center;line-height:78px;z-index:100;pointer-events:none;display:none;user-select:none}
#longpressHint{position:fixed;pointer-events:none;z-index:50;width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,60,60,.9);transform:translate(-50%,-50%) scale(0);transition:transform .12s}
#longpressHint.active{transform:translate(-50%,-50%) scale(1)}
#toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);padding:14px 24px;background:rgba(0,0,0,.8);color:#fff;font-size:15px;border:2px solid rgba(255,255,255,.4);border-radius:6px;z-index:500;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.show{opacity:1}
.panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:380px;max-width:94vw;max-height:85vh;overflow-y:auto;background:rgba(30,30,40,.97);border:3px solid rgba(255,255,255,.5);border-radius:8px;color:#fff;padding:16px;z-index:300;display:none;font-size:13px}
.panel.show{display:block}
.panel h3{margin-bottom:12px;text-align:center;font-size:15px}
.setting-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.setting-row label{flex:1}
.setting-row input[type=range]{flex:1.2;touch-action:auto}
.setting-row .val{width:36px;text-align:right;color:#ffd966}
.setting-row select{padding:6px;border-radius:4px;background:#222;color:#fff;border:1px solid #666;font-family:inherit;font-size:13px}
.setting-row input[type=checkbox]{width:22px;height:22px}
.panel-btn{display:block;width:100%;padding:11px;margin-top:8px;background:rgba(80,120,180,.9);color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:4px;font-size:14px;font-family:inherit;cursor:pointer}
.panel-btn:active{background:rgba(100,140,200,.9)}
.panel-btn.danger{background:rgba(180,80,80,.9)}
#inventoryPanel{width:92vw;max-width:420px}
#invLayout{display:flex;gap:14px;align-items:flex-start;justify-content:center;margin-bottom:10px}
#invSection{display:flex;flex-direction:column;align-items:center;gap:6px}
#invGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;background:rgba(20,20,30,.6);border:2px solid rgba(255,255,255,.25);border-radius:6px}
.inv-slot{width:42px;height:42px;border-radius:4px;background:rgba(60,60,70,.7);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:9px;position:relative;cursor:pointer;text-align:center;line-height:1}
.inv-slot.selected{border-color:#ffd966;box-shadow:0 0 8px #ffd966}
.inv-slot .count{position:absolute;bottom:2px;right:3px;font-size:11px;font-weight:bold;color:#fff;text-shadow:1px 1px 1px #000}
#craftArea{display:flex;flex-direction:column;align-items:center;gap:6px}
#craftArrow{font-size:22px;color:#fff;margin:0 4px;align-self:center}
#craftRow{display:flex;align-items:center}
#craftGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:6px;background:rgba(20,20,30,.6);border:2px solid rgba(255,255,255,.25);border-radius:6px}
.craft-slot{width:42px;height:42px;border-radius:4px;background:rgba(60,60,70,.7);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:9px;position:relative;cursor:pointer;text-align:center;line-height:1}
.craft-slot .count{position:absolute;bottom:2px;right:3px;font-size:11px;font-weight:bold;color:#fff;text-shadow:1px 1px 1px #000}
#outputSlot{width:54px;height:54px;border-radius:4px;background:rgba(60,60,70,.7);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:9px;position:relative;cursor:pointer;text-align:center;line-height:1}
#outputSlot.ready{border-color:#ffd966;box-shadow:0 0 10px #ffd966}
#outputSlot .count{position:absolute;bottom:2px;right:3px;font-size:12px;font-weight:bold;color:#fff;text-shadow:1px 1px 1px #000}
#fileInput{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0}
#sandstormOverlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;opacity:0;transition:opacity .8s;background:linear-gradient(0deg,rgba(220,180,90,.5),rgba(200,160,80,.4))}
#pauseOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);z-index:299;display:none}
#pauseOverlay.show{display:block}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="sandstormOverlay"></div>
<div id="crosshair"></div>
<div id="hud">Tessera Pre 0.65_06x</div>
<div id="topBar"><div class="mc-btn" id="pauseBtn">⏸</div></div>
<div id="hotbarWrapper"><div id="menuBtn3">⋯</div><div id="hotbar"></div></div>
<div id="joystick"><div id="joystick-knob"></div></div>
<div id="jumpBtn"></div>
<div id="downBtn">▼</div>

<button class="panel-btn" id="resumeBtn"></button>
<button class="panel-btn" id="pauseSettingsBtn"></button>
<button class="panel-btn" id="pauseInventoryBtn"></button>

<button class="panel-btn" id="pauseLoadBtn"></button>

</div>

<div class="panel" id="settingsPanel">
<h3 id="settingsTitle"></h3>
<div class="setting-row"><label id="lblWorldType"></label>
<select id="worldTypeSelect">
<option value="normal"></option><option value="flat"></option><option value="forest"></option><option value="plains"></option><option value="desert"></option>
</select></div>
<div class="setting-row"><label id="lblTime"></label>
<select id="dayNightSelect"><option value="cycle"></option><option value="day"></option><option value="night"></option></select></div>
<div class="setting-row"><label id="lblWeather"></label>
<select id="weatherSelect"><option value="auto"></option><option value="clear"></option><option value="rain"></option><option value="snow"></option><option value="sandstorm"></option></select></div>
<div class="setting-row"><label id="lblRenderDist"></label>
<input type="range" id="renderDistSlider" min="4" max="10" value="5"><span class="val" id="renderDistVal">5</span></div>

<input type="range" id="brightnessSlider" min="30" max="150" value="100"><span class="val" id="brightnessVal">100</span></div>
<div class="setting-row"><label id="lblSpeed"></label>
<input type="range" id="speedSlider" min="3" max="15" value="6" step="0.5"><span class="val" id="speedVal">6</span></div>
<div class="setting-row"><label id="lblHD"></label><input type="checkbox" id="antialiasToggle"></div>

<div class="setting-row"><label id="lblSpectator"></label><input type="checkbox" id="spectatorToggle"></div>
<button class="panel-btn" id="closeSettings"></button>

</div>

<div class="panel" id="inventoryPanel">
<h3 id="invTitle"></h3>
<div id="invLayout">
<div id="invSection"><div id="invGrid"></div></div>
<div id="craftArea">
<div id="craftRow">
<div id="craftGrid">

<div class="craft-slot" data-idx="1"></div>
<div class="craft-slot" data-idx="2"></div>
<div class="craft-slot" data-idx="3"></div>
</div>
<div id="craftArrow">➜</div>
<div id="outputSlot"></div>
</div>
</div>
</div>
<button class="panel-btn" id="closeInventory"></button>
</div>

<input type="file" id="fileInput" accept=".json,application/json">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
<script src="lang.js"></script>
<script src="lighting.js"></script>
<script>
// ==========================================================
// 配置
// ==========================================================
const VERSION = 'Pre 0.65_06x';
const BLOCK_CONFIG={
grass:{nameKey:'grass',top:'#7ec850',side:'#8fb860',bottom:'#8b5a2b'},
dirt:{nameKey:'dirt',color:'#8b5a2b'},
stone:{nameKey:'stone',color:'#888888'},
wood:{nameKey:'wood',color:'#6b4423'},
plank:{nameKey:'plank',color:'#b88a4a'},
leaves:{nameKey:'leaves',color:'#3d7a1e'},
sand:{nameKey:'sandBlock',color:'#d4c694',gravity:true},
brick:{nameKey:'brick',color:'#a04030'},
torch:{nameKey:'torch',color:'#ffcc33',light:true,emissive:true}
};
const HOTBAR_ORDER=['grass','dirt','stone','wood','plank','leaves','sand','brick','torch'];
const RECIPES=[{ inputs: {wood: 1}, outputs: {plank: 4} }];

const CONST={
GRAVITY:22,JUMP_SPEED:8.5,
PLAYER_W:.6,PLAYER_H:1.8,EYE_H:1.6,
SAVE_KEY:'tessera_v3',
FIXED_DT:1/60,
LONG_PRESS_MS:350,MOVE_THRESHOLD:25,SWEEP_STEP:.05,
BREAK_INTERVAL_MS: 320,
PITCH_LIMIT:1.45,
DAY_DURATION:2400,WEATHER_MIN:300,WEATHER_MAX:600,
LIGHT_REBUILD_DIST:5,
LIGHT_Y_MAX:32,
MATERIAL_UPDATE_INTERVAL:0.5
};

let WORLD_SEED=Math.floor(Math.random()*1e9);
let worldType='normal';
let renderDistance=5;
let brightnessLevel=100;
let moveSpeed=6;
let flyingMode=false;
let spectatorMode=false;
let dayNightMode='cycle';
let forcedWeather='auto';
let hdRendering=false;
let worldTime=CONST.DAY_DURATION*0.35;
let currentBlock='grass';
let moveInput={x:0,y:0};
let jumpRequested=false,moveUpRequested=false,moveDownRequested=false;
let needSkyLightRefresh=false;
let gamePaused=false;
let isBreaking=false;
let lastBreakTime=0;
const player={pos:new THREE.Vector3(0,50,0),yaw:0,pitch:-.3,vy:0,onGround:false};
const inventory={grass:64,dirt:64,stone:64,wood:32,plank:32,leaves:32,sand:32,brick:32,torch:32};
const craftSlots = [null, null, null, null];
let craftOutput = null;
function t(k){ return MC_LANG.t(k); }

// 噪声
function hash2(x,z,s){let n=x*374761393+z*668265263+s*1274126177;n=(n^(n>>13))*1274126177;return((n^(n>>16))>>>0)/4294967296}
function hash3(x,y,z,s){let n=x*374761393+y*668265263+z*1274126177+s*13579;n=(n^(n>>13))*1274126177;return((n^(n>>16))>>>0)/4294967296}
const smooth=t=>t*t*(3-2*t);
function noise2(x,z,s){const xi=Math.floor(x),zi=Math.floor(z);const u=smooth(x-xi),w=smooth(z-zi);
const c00=hash2(xi,zi,s),c10=hash2(xi+1,zi,s),c01=hash2(xi,zi+1,s),c11=hash2(xi+1,zi+1,s);
return c00*(1-u)*(1-w)+c10*u*(1-w)+c01*(1-u)*w+c11*u*w;}
function noise3(x,y,z,s){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
const u=smooth(x-xi),v=smooth(y-yi),w=smooth(z-zi);
const c000=hash3(xi,yi,zi,s),c100=hash3(xi+1,yi,zi,s);
const c010=hash3(xi,yi+1,zi,s),c110=hash3(xi+1,yi+1,zi,s);
const c001=hash3(xi,yi,zi+1,s),c101=hash3(xi+1,yi,zi+1,s);
const c011=hash3(xi,yi+1,zi+1,s),c111=hash3(xi+1,yi+1,zi+1,s);
const x00=c000*(1-u)+c100*u,x10=c010*(1-u)+c110*u;
const x01=c001*(1-u)+c101*u,x11=c011*(1-u)+c111*u;
return(x00*(1-v)+x10*v)*(1-w)+(x01*(1-v)+x11*v)*w;}

// 地形
const heightCache=new Map();
function getBiome(x,z){
if(worldType==='forest')return'forest';
if(worldType==='plains')return'plains';
if(worldType==='desert')return'desert';
if(worldType==='flat')return'plains';
const v=noise2(x*.008,z*.008,WORLD_SEED);
const s=(v-.5)*3+.5;
if(s<.20)return'desert';
if(s<.50)return'plains';
return'forest';
}
function getHeight(x,z){
if(worldType==='flat')return 20;
const k=x+','+z;
let h=heightCache.get(k);
if(h!==undefined)return h;
const b=getBiome(x,z);
if(b==='desert')h=18+noise2(x*.1,z*.1,WORLD_SEED+1)*4+noise2(x*.03,z*.03,WORLD_SEED+2)*3;
else if(b==='plains')h=20+noise2(x*.15,z*.15,WORLD_SEED+3)*3;
else h=22+noise2(x*.2,z*.2,WORLD_SEED+4)*5+noise2(x*.05,z*.05,WORLD_SEED+5)*4;
h=Math.floor(h);
if(heightCache.size>15000)heightCache.clear();
heightCache.set(k,h);
return h;
}
function isCave(x,y,z){
if(y<2)return false;
const surface=getHeight(x,z);
if(y>surface-2)return false;
const n=noise3(x*.06,y*.06,z*.06,WORLD_SEED+100);
if(n>.58)return true;
const n1=noise3(x*.05,y*.05,z*.05,WORLD_SEED+200);
const n2=noise3(x*.05,y*.05,z*.05,WORLD_SEED+300);
if(Math.abs(n1-.5)<.06&&Math.abs(n2-.5)<.06)return true;
return false;
}
const caveEntranceCache=new Map();
function hasCaveEntrance(x,z){
const k=x+','+z;
let r=caveEntranceCache.get(k);
if(r!==undefined)return r;
const surface=getHeight(x,z);
r=false;
for(let y=surface-3;y<surface;y++){if(y<2)continue;if(isCave(x,y,z)){r=true;break}}
if(caveEntranceCache.size>15000)caveEntranceCache.clear();
caveEntranceCache.set(k,r);
return r;
}
function hasTree(x,z){if(getBiome(x,z)!=='forest')return false;return hash2(x,z,WORLD_SEED+400)<.10}
function treeBlockAt(x,y,z){
for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++){
const tx=x+dx,tz=z+dz;
if(!hasTree(tx,tz))continue;
const baseY=getHeight(tx,tz)+1;
const th=3+Math.floor(hash2(tx,tz,WORLD_SEED+500)*3);
const topY=baseY+th-1;
if(x===tx&&z===tz&&y>=baseY&&y<baseY+th)return'wood';
if(y>=topY&&y<=topY+1&&Math.abs(x-tx)<=1&&Math.abs(z-tz)<=1){
if(x===tx&&z===tz&&y===topY)continue;
return'leaves';
}
}
return null;
}
function generateBlock(x,y,z){
if(y<0)return null;
if(y===0)return'bedrock';
const surface=getHeight(x,z);
if(y===surface && hasCaveEntrance(x,z))return'dirt';
const biome=getBiome(x,z);
if(y<surface-1&&isCave(x,y,z))return null;
const tb=treeBlockAt(x,y,z);
if(tb&&y>surface)return tb;
if(y===surface)return biome==='desert'?'sand':'grass';
if(y>surface)return null;
const depth=surface-y;
if(depth<=3)return biome==='desert'?'sand':'dirt';
return'stone';
}
const modifications=new Map();
const worldKey=(x,y,z)=>x+','+y+','+z;
function getBlockType(x,y,z){
const k=worldKey(x,y,z);
if(modifications.has(k))return modifications.get(k);
if(y===0)return'bedrock';
return generateBlock(x,y,z);
}
function isSolid(x,y,z){return getBlockType(x,y,z)!==null}
function setBlock(x,y,z,type){modifications.set(worldKey(x,y,z),type)}

// 光照
let lightEngine;
if (typeof VoxelLight === 'function') {
    lightEngine = new VoxelLight((x, y, z) => getBlockType(x, y, z));
} else {
    lightEngine = { rebuild(){}, onBlockChanged(){}, clear(){}, getLight(){return 12;}, getSkyLight(){return 12;}, getBlockLight(){return 0;}, setSkyFactor(){return false;} };
}
let lastLightX = null, lastLightZ = null;
function rebuildLighting(force){
const cx=Math.floor(player.pos.x);
const cz=Math.floor(player.pos.z);
if(!force && lastLightX!==null && Math.abs(cx-lastLightX)<CONST.LIGHT_REBUILD_DIST && Math.abs(cz-lastLightZ)<CONST.LIGHT_REBUILD_DIST)return;
lastLightX=cx;lastLightZ=cz;
const R=renderDistance+2;
const yMax=Math.min(CONST.LIGHT_Y_MAX,Math.floor(player.pos.y)+10);
lightEngine.rebuild(cx-R,cx+R,cz-R,cz+R,yMax);
}
const LIGHT_LEVELS=16;
function levelToBrightness(level){const l=Math.max(0,Math.min(15,level));return 0.18+(l/15)*0.82;}
function getBlockLightLevel(x,y,z){return Math.max(0,Math.min(15,Math.round(lightEngine.getLight(x,y,z))));}

// 场景
const scene=new THREE.Scene();
const SKY_DAY=new THREE.Color(0x87CEEB),SKY_NIGHT=new THREE.Color(0x101830);
scene.background=SKY_DAY.clone();
scene.fog=new THREE.Fog(0x87CEEB,18,45);
const camera=new THREE.PerspectiveCamera(70,1,.1,250);
const canvasElement=document.getElementById('gameCanvas');
const renderer=new THREE.WebGLRenderer({canvas:canvasElement,antialias:false,powerPreference:'high-performance'});
renderer.shadowMap.enabled=false;

function makeTexture(color,opts={}){
const c=document.createElement('canvas');
c.width=c.height=16;
const ctx=c.getContext('2d');
ctx.fillStyle=color;ctx.fillRect(0,0,16,16);
for(let i=0;i<50;i++){
const x=(Math.random()*16)|0,y=(Math.random()*16)|0;
const a=(Math.random()*.3).toFixed(2);
ctx.fillStyle=Math.random()>.5?`rgba(0,0,0,${a})`:`rgba(255,255,255,${a})`;
ctx.fillRect(x,y,1,1);
}
if(opts.sideSplit&&opts.bottomColor){ctx.fillStyle=opts.bottomColor;ctx.fillRect(0,9,16,7)}
const tex=new THREE.CanvasTexture(c);
tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.NearestFilter;return tex;
}
const BLOCK_GEOMETRY=new THREE.BoxGeometry(1,1,1);
const BLOCK_MATERIALS_BASE={};
const BLOCK_MATERIALS={};
const TORCH_EMISSIVE_MAT=new THREE.MeshBasicMaterial({color:0xffcc33});
const SPECTATOR_MATERIALS={};
(function buildMaterials(){
const gt=makeTexture(BLOCK_CONFIG.grass.top);
const gb=makeTexture(BLOCK_CONFIG.grass.bottom);

function isColliding(pos){
if(spectatorMode)return false;
const minX=pos.x-CONST.PLAYER_W/2,maxX=pos.x+CONST.PLAYER_W/2;
const minY=pos.y,maxY=pos.y+CONST.PLAYER_H;
const minZ=pos.z-CONST.PLAYER_W/2,maxZ=pos.z+CONST.PLAYER_W/2;
const x0=Math.floor(minX),x1=Math.floor(maxX),y0=Math.floor(minY),y1=Math.floor(maxY),z0=Math.floor(minZ),z1=Math.floor(maxZ);
for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)
if(isSolid(x,y,z)&&maxX>x&&minX<x+1&&maxY>y&&minY<y+1&&maxZ>z&&minZ<z+1)return true;
return false;
}
function exactGroundY(pos){
const hw=CONST.PLAYER_W/2;
const x0=Math.floor(pos.x-hw+.001),x1=Math.floor(pos.x+hw-.001);
const z0=Math.floor(pos.z-hw+.001),z1=Math.floor(pos.z+hw-.001);
let highest=-Infinity;
for(let x=x0;x<=x1;x++)for(let z=z0;z<=z1;z++){for(let y=Math.floor(pos.y+CONST.PLAYER_H);y>=0;y--){if(isSolid(x,y,z)){if(y+1>highest)highest=y+1;break}}}
return highest;
}
function sweepMove(axis,dist){
if(spectatorMode){player.pos.x+=(axis==='x'?dist:0);player.pos.y+=(axis==='y'?dist:0);player.pos.z+=(axis==='z'?dist:0);return false}
const n=Math.max(1,Math.ceil(Math.abs(dist)/CONST.SWEEP_STEP));const s=dist/n;
for(let i=0;i<n;i++){const tg={x:player.pos.x+(axis==='x'?s:0),y:player.pos.y+(axis==='y'?s:0),z:player.pos.z+(axis==='z'?s:0)};
if(isColliding(tg))return true;player.pos.x=tg.x;player.pos.y=tg.y;player.pos.z=tg.z;}
return false;
}
function unstickPlayer(){
if(!isColliding(player.pos))return;
for(let dy=0.2;dy<30;dy+=0.2){const tg={x:player.pos.x,y:player.pos.y+dy,z:player.pos.z};if(!isColliding(tg)){player.pos.y=tg.y;player.vy=0;player.onGround=false;return}}
player.pos=randomSpawn();player.vy=0;player.onGround=false;
}
function physicsStep(dt){
const forward=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
const right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
if(spectatorMode){const f3=new THREE.Vector3(-Math.sin(player.yaw)*Math.cos(player.pitch),Math.sin(player.pitch),-Math.cos(player.yaw)*Math.cos(player.pitch));
const move=new THREE.Vector3();move.addScaledVector(f3,-moveInput.y);move.addScaledVector(right,moveInput.x);
if(move.length()>1)move.normalize();
player.pos.x+=move.x*moveSpeed*dt;player.pos.y+=move.y*moveSpeed*dt;player.pos.z+=move.z*moveSpeed*dt;
if(moveUpRequested)player.pos.y+=moveSpeed*dt;if(moveDownRequested)player.pos.y-=moveSpeed*dt;
player.vy=0;return;}
const move=new THREE.Vector3();move.addScaledVector(forward,-moveInput.y);move.addScaledVector(right,moveInput.x);
if(move.length()>1)move.normalize();
if(flyingMode){sweepMove('x',move.x*moveSpeed*dt);sweepMove('z',move.z*moveSpeed*dt);
if(moveUpRequested){const tg=player.pos.clone();tg.y+=moveSpeed*dt;if(!isColliding(tg))player.pos.y=tg.y}
if(moveDownRequested){const tg=player.pos.clone();tg.y-=moveSpeed*dt;if(!isColliding(tg))player.pos.y=tg.y}
player.vy=0;player.onGround=false;return;}
sweepMove('x',move.x*moveSpeed*dt);sweepMove('z',move.z*moveSpeed*dt);
if(jumpRequested&&player.onGround){player.vy=CONST.JUMP_SPEED;player.onGround=false}
jumpRequested=false;
player.vy-=CONST.GRAVITY*dt;player.vy=Math.max(player.vy,-30);
const hit=sweepMove('y',player.vy*dt);
if(hit){if(player.vy<0){const g=exactGroundY(player.pos);if(g>-Infinity&&g<=player.pos.y+.1)player.pos.y=g;player.vy=0;player.onGround=true}
else{player.vy=0;player.onGround=false}}
else{const below={x:player.pos.x,y:player.pos.y-.05,z:player.pos.z};player.onGround=isColliding(below);
if(player.onGround){const g=exactGroundY(player.pos);if(g>-Infinity&&g<=player.pos.y+.1)player.pos.y=g;player.vy=0}}
}
const _yAxis=new THREE.Vector3(0,1,0),_xAxis=new THREE.Vector3(1,0,0);

function randomSpawn(){

function updateDayNight(dt){

else if(dayNightMode==='day')worldTime=CONST.DAY_DURATION*.4;
else worldTime=CONST.DAY_DURATION*.9;

// 热栏（9 格）
const hotbar=document.getElementById('hotbar');const hotbarSlots=[];
function buildHotbar(){
hotbar.innerHTML='';hotbarSlots.length=0;
for(let i=0;i<HOTBAR_ORDER.length;i++){
const k=HOTBAR_ORDER[i];
const slot=document.createElement('div');
slot.className='hotbar-slot';slot.dataset.type=k;
slot.style.background=BLOCK_CONFIG[k].color||BLOCK_CONFIG[k].top;
// 数字角标
const num=document.createElement('div');num.className='hotbar-num';num.textContent=(i+1);
slot.appendChild(num);
const count=document.createElement('div');count.className='hotbar-count';count.textContent=inventory[k]||0;
slot.appendChild(count);
hotbar.appendChild(slot);hotbarSlots.push(slot);
}
updateHotbarSelection();updateHotbarCounts();
}
function updateHotbarSelection(){hotbarSlots.forEach((s,i)=>s.classList.toggle('selected',HOTBAR_ORDER[i]===currentBlock))}
function updateHotbarCounts(){hotbarSlots.forEach((s,i)=>{
const k=HOTBAR_ORDER[i];const c=inventory[k]||0;
s.querySelector('.hotbar-count').textContent=c;s.classList.toggle('empty',c===0);})}

// ★ 数字键 1-9 切换热栏
document.addEventListener('keydown', e => {
    if (e.key >= '1' && e.key <= '9') {
        const idx = parseInt(e.key) - 1;
        if (idx < HOTBAR_ORDER.length) {
            currentBlock = HOTBAR_ORDER[idx];
            updateHotbarSelection();
        }
    }
});

function pointInCircle(x,y,r){const cx=r.left+r.width/2,cy=r.top+r.height/2;return Math.hypot(x-cx,y-cy)<=Math.min(r.width,r.height)/2}
function pointInRect(x,y,r){return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
function isInPanel(x,y){for(const id of['pausePanel','settingsPanel','inventoryPanel']){const el=document.getElementById(id);if(el.classList.contains('show')&&pointInRect(x,y,el.getBoundingClientRect()))return true;}return false;}
function isPanelOpen(){return document.getElementById('pausePanel').classList.contains('show')||document.getElementById('settingsPanel').classList.contains('show')||document.getElementById('inventoryPanel').classList.contains('show');}
function closeAllPanels(){document.getElementById('pausePanel').classList.remove('show');document.getElementById('pauseOverlay').classList.remove('show');document.getElementById('settingsPanel').classList.remove('show');document.getElementById('inventoryPanel').classList.remove('show');gamePaused=false;}
function isInTopBar(x,y){return pointInRect(x,y,document.getElementById('pauseBtn').getBoundingClientRect())}
function isInHotbarWrapper(x,y){return pointInRect(x,y,document.getElementById('menuBtn3').getBoundingClientRect())}
function openPause(){closeAllPanels();gamePaused=true;document.getElementById('pausePanel').classList.add('show');document.getElementById('pauseOverlay').classList.add('show');}
function openSettings(){document.getElementById('settingsPanel').classList.add('show')}
function closeSettings(){document.getElementById('settingsPanel').classList.remove('show');gamePaused=false}

function buildInventoryUI(){
document.querySelectorAll('.craft-slot').forEach((el, idx) => {
el.innerHTML = '';
const s = craftSlots[idx];
if (s) {
el.style.background = BLOCK_CONFIG[s.type].color || BLOCK_CONFIG[s.type].top;
el.innerHTML = `<div>${t(BLOCK_CONFIG[s.type].nameKey)}</div><div class="count">${s.count}</div>`;
} else {
el.style.background = 'rgba(60,60,70,.7)';
}
});
const out = document.getElementById('outputSlot');
out.innerHTML = '';out.classList.remove('ready');
if (craftOutput) {
out.style.background = BLOCK_CONFIG[craftOutput.type].color || BLOCK_CONFIG[craftOutput.type].top;
out.classList.add('ready');
out.innerHTML = `<div>${t(BLOCK_CONFIG[craftOutput.type].nameKey)}</div><div class="count">${craftOutput.count}</div>`;
} else {
out.style.background = 'rgba(60,60,70,.7)';
}
const grid = document.getElementById('invGrid');
grid.innerHTML = '';
for (const k in BLOCK_CONFIG) {
const slot = document.createElement('div');
slot.className = 'inv-slot' + (k === currentBlock ? ' selected' : '');
slot.style.background = BLOCK_CONFIG[k].color || BLOCK_CONFIG[k].top;
slot.innerHTML = `<div>${t(BLOCK_CONFIG[k].nameKey)}</div><div class="count">${inventory[k]||0}</div>`;
slot.addEventListener('click', e => {
e.preventDefault(); e.stopPropagation();
addToCraft(k);
});
grid.appendChild(slot);
}
}
function addToCraft(k){
if ((inventory[k]||0) <= 0) return;
let idx = craftSlots.findIndex(s => s === null);
if (idx === -1) return;
craftSlots[idx] = { type: k, count: 1 };
inventory[k]--;
updateHotbarCounts();
matchRecipe();
buildInventoryUI();
}
function removeFromCraft(idx){
const s = craftSlots[idx];
if (!s) return;
inventory[s.type] = (inventory[s.type]||0) + s.count;
craftSlots[idx] = null;
updateHotbarCounts();
matchRecipe();
buildInventoryUI();
}
function matchRecipe(){
craftOutput = null;
const counts = {};
for (const s of craftSlots) { if (!s) continue; counts[s.type] = (counts[s.type]||0) + s.count; }
for (const r of RECIPES) {
const keys = Object.keys(r.inputs);
let match = true;
for (const k in counts) { if (!r.inputs[k] || counts[k] !== r.inputs[k]) { match = false; break; } }
if (match) {
for (const k of keys) { if (!counts[k] || counts[k] !== r.inputs[k]) { match = false; break; } }
}
if (match) {
const outKey = Object.keys(r.outputs)[0];
craftOutput = { type: outKey, count: r.outputs[outKey] };
return;
}
}
}
function takeCraftOutput(){
if (!craftOutput) return;
for (let i = 0; i < craftSlots.length; i++) craftSlots[i] = null;
inventory[craftOutput.type] = (inventory[craftOutput.type]||0) + craftOutput.count;
craftOutput = null;
updateHotbarCounts();
matchRecipe();
buildInventoryUI();
}
document.querySelectorAll('.craft-slot').forEach(el => {
el.addEventListener('click', e => {
e.preventDefault(); e.stopPropagation();
const idx = Number(el.dataset.idx);
removeFromCraft(idx);
});
});
document.getElementById('outputSlot').addEventListener('click', e => {
e.preventDefault(); e.stopPropagation();
takeCraftOutput();
});

const joystick=document.getElementById('joystick');const knob=document.getElementById('joystick-knob');let joyCenter={x:0,y:0};
function joyMove(x,y){const dx=x-joyCenter.x,dy=y-joyCenter.y;const dist=Math.hypot(dx,dy);const maxDist=45;
const clamped=Math.min(dist,maxDist);const angle=Math.atan2(dy,dx);
const kx=Math.cos(angle)*clamped,ky=Math.sin(angle)*clamped;
knob.style.transform=`translate(${kx}px,${ky}px)`;
moveInput.x=kx/maxDist;moveInput.y=ky/maxDist;}
function joyEnd(){moveInput={x:0,y:0};knob.style.transform='translate(0,0)'}

let saveTimer=null;
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveToLocal,500)}
function getSaveData(){return{version:3,versionStr:VERSION,seed:WORLD_SEED,worldType,worldTime,dayNightMode,forcedWeather,modifications:[...modifications],inventory,player:{x:player.pos.x,y:player.pos.y,z:player.pos.z,yaw:player.yaw,pitch:player.pitch},currentBlock,lang:MC_LANG.get(),settings:{renderDistance,brightnessLevel,moveSpeed,flyingMode,spectatorMode,hdRendering}};}
function saveToLocal(){try{localStorage.setItem(CONST.SAVE_KEY,JSON.stringify(getSaveData()))}catch(e){}}
function applySaveData(data){
if(!data||typeof data!=='object')return false;
if(Number.isFinite(data.seed))WORLD_SEED=data.seed;
if(data.worldType)worldType=data.worldType;
if(Number.isFinite(data.worldTime))worldTime=data.worldTime;
if(data.dayNightMode)dayNightMode=data.dayNightMode;
if(data.forcedWeather)forcedWeather=data.forcedWeather;
if(data.lang && MC_LANG.list.indexOf(data.lang)>=0) MC_LANG.set(data.lang);
modifications.clear();
if(Array.isArray(data.modifications)){for(const e of data.modifications){if(Array.isArray(e)&&e.length===2){const[k,v]=e;if(typeof k==='string'&&(v===null||BLOCK_CONFIG[v]))modifications.set(k,v);}}}
for(const k in inventory)delete inventory[k];
if(data.inventory)for(const k in data.inventory)inventory[k]=data.inventory[k]||0;
updateHotbarCounts();
if(data.player){const px=Number(data.player.x),py=Number(data.player.y),pz=Number(data.player.z);const pyaw=Number(data.player.yaw),ppitch=Number(data.player.pitch);
player.pos.set(Number.isFinite(px)?px:.5,Number.isFinite(py)?py:30,Number.isFinite(pz)?pz:.5);
player.yaw=Number.isFinite(pyaw)?pyaw:0;
player.pitch=Number.isFinite(ppitch)?Math.max(-CONST.PITCH_LIMIT,Math.min(CONST.PITCH_LIMIT,ppitch)):-.3;}
if(data.currentBlock&&BLOCK_CONFIG[data.currentBlock]){currentBlock=data.currentBlock;updateHotbarSelection()}
if(data.settings){
if(Number.isFinite(data.settings.renderDistance)){renderDistance=Math.max(4,Math.min(10,data.settings.renderDistance));document.getElementById('renderDistSlider').value=renderDistance;document.getElementById('renderDistVal').textContent=renderDistance}
if(Number.isFinite(data.settings.brightnessLevel)){brightnessLevel=Math.max(30,Math.min(150,data.settings.brightnessLevel));document.getElementById('brightnessSlider').value=brightnessLevel;document.getElementById('brightnessVal').textContent=brightnessLevel}
if(Number.isFinite(data.settings.moveSpeed)){moveSpeed=Math.max(3,Math.min(15,data.settings.moveSpeed));document.getElementById('speedSlider').value=moveSpeed;document.getElementById('speedVal').textContent=moveSpeed}
if(typeof data.settings.flyingMode==='boolean'){flyingMode=data.settings.flyingMode;document.getElementById('flyToggle').checked=flyingMode}
if(typeof data.settings.spectatorMode==='boolean'){spectatorMode=data.settings.spectatorMode;document.getElementById('spectatorToggle').checked=spectatorMode}
if(typeof data.settings.hdRendering==='boolean'){hdRendering=data.settings.hdRendering;document.getElementById('antialiasToggle').checked=hdRendering}
}
heightCache.clear();caveEntranceCache.clear();
clearAllWorldMeshes();clearAllDrops();
player.vy=0;player.onGround=false;
updateRender(true);updateFlyButtons();applyHD();refreshUI();
document.getElementById('langSelect').value=MC_LANG.get();
return true;
}
function loadFromLocal(){try{const raw=localStorage.getItem(CONST.SAVE_KEY);if(!raw)return false;return applySaveData(JSON.parse(raw))}catch(e){return false}}
function exportSave(){saveToLocal();

const blob=new Blob([json],{type:'application/json'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
const now=new Date();const pad=n=>String(n).padStart(2,'0');
const stamp=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}`;
a.href=url;a.download=`tessera-${stamp}.json`;a.style.display='none';
document.body.appendChild(a);a.click();
setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},5000);
toast(t('saved'));
}
function importSave(){const input=document.getElementById('fileInput');input.value='';input.click()}

});

const activeTouches=new Map();
document.addEventListener('touchstart',e=>{
for(const tg of e.changedTouches)if(isInPanel(tg.clientX,tg.clientY))return;
if(isPanelOpen()){closeAllPanels();return}
for(const tg of e.changedTouches){
if(isInTopBar(tg.clientX,tg.clientY))return;
if(isInHotbarWrapper(tg.clientX,tg.clientY))return;
}
if(gamePaused)return;
const ui=getUIElements();
for(const tg of e.changedTouches){
const x=tg.clientX,y=tg.clientY;
if(pointInCircle(x,y,ui.jump)){
if(flyingMode||spectatorMode){moveUpRequested=true;activeTouches.set(tg.identifier,{type:'up'})}
else{jumpRequested=true;activeTouches.set(tg.identifier,{type:'jump'})}
continue;
}
if(document.getElementById('downBtn').style.display!=='none'&&pointInCircle(x,y,ui.down)){
moveDownRequested=true;activeTouches.set(tg.identifier,{type:'down'});continue;
}
let slotHit=null;
for(const s of ui.slots)if(pointInCircle(x,y,s.rect)){slotHit=s;break}
if(slotHit){
if((inventory[slotHit.type]||0)>0||spectatorMode){currentBlock=slotHit.type;updateHotbarSelection()}
activeTouches.set(tg.identifier,{type:'ui'});continue;
}
if(pointInCircle(x,y,ui.joystick)){
const r=document.getElementById('joystick').getBoundingClientRect();
joyCenter={x:r.left+r.width/2,y:r.top+r.height/2};joyMove(x,y);
activeTouches.set(tg.identifier,{type:'joystick'});continue;
}
const state={type:'empty',startX:x,startY:y,lastX:x,lastY:y,moved:false,longPressFired:false,longPressTimer:null};
state.longPressTimer=setTimeout(()=>{
if(!state.moved){
state.longPressFired=true;
isBreaking=true;
lastBreakTime=performance.now();
tryBreak();
const hint=document.getElementById('longpressHint');
hint.style.left=x+'px';hint.style.top=y+'px';
hint.classList.add('active');
setTimeout(()=>hint.classList.remove('active'),150);
}
},CONST.LONG_PRESS_MS);
activeTouches.set(tg.identifier,state);
}
e.preventDefault();
},{passive:false});
document.addEventListener('touchmove',e=>{
for(const tg of e.changedTouches){
if(isInPanel(tg.clientX,tg.clientY))return;
if(isInTopBar(tg.clientX,tg.clientY))return;
if(isInHotbarWrapper(tg.clientX,tg.clientY))return;
}
for(const tg of e.changedTouches){
const info=activeTouches.get(tg.identifier);
if(!info)continue;
if(info.type==='joystick')joyMove(tg.clientX,tg.clientY);
else if(info.type==='empty'){
const dx=tg.clientX-info.lastX,dy=tg.clientY-info.lastY;
if(Math.hypot(tg.clientX-info.startX,tg.clientY-info.startY)>CONST.MOVE_THRESHOLD){
info.moved=true;
if(info.longPressTimer){clearTimeout(info.longPressTimer);info.longPressTimer=null}
}
if(info.moved){
player.yaw-=dx*.005;
if(player.yaw>Math.PI)player.yaw-=2*Math.PI;
else if(player.yaw<-Math.PI)player.yaw+=2*Math.PI;
player.pitch=Math.max(-CONST.PITCH_LIMIT,Math.min(CONST.PITCH_LIMIT,player.pitch-dy*.005));
}
info.lastX=tg.clientX;info.lastY=tg.clientY;
}
}
e.preventDefault();
},{passive:false});
document.addEventListener('touchend',e=>{
for(const tg of e.changedTouches){
const info=activeTouches.get(tg.identifier);
if(!info)continue;
if(info.type==='joystick')joyEnd();
else if(info.type==='up')moveUpRequested=false;
else if(info.type==='down')moveDownRequested=false;
else if(info.type==='empty'){
if(info.longPressTimer)clearTimeout(info.longPressTimer);
if(!info.moved&&!info.longPressFired)tryPlace();
if(info.longPressFired)isBreaking=false;
}
activeTouches.delete(tg.identifier);
}
});
document.addEventListener('touchcancel',e=>{
for(const tg of e.changedTouches){
const info=activeTouches.get(tg.identifier);
if(!info)continue;
if(info.type==='joystick')joyEnd();
if(info.type==='up')moveUpRequested=false;
if(info.type==='down')moveDownRequested=false;
if(info.longPressTimer)clearTimeout(info.longPressTimer);
if(info.longPressFired)isBreaking=false;
activeTouches.delete(tg.identifier);
}
});

function resizeRenderer(){
const w=document.documentElement.clientWidth||window.innerWidth;
const h=document.documentElement.clientHeight||window.innerHeight;
renderer.setSize(w,h,false);
canvasElement.style.width=w+'px';canvasElement.style.height=h+'px';
camera.aspect=w/h;camera.updateProjectionMatrix();
}
let lastTime=performance.now(),accumulator=0;
let fpsTimer=0,fpsCount=0,renderTimer=0,hudTimer=0,resizeTimer=0,materialTimer=0;
function update(){
const now=performance.now();
const frameTime=Math.min((now-lastTime)/1000,.1);
lastTime=now;
resizeTimer+=frameTime;
if(resizeTimer>3){resizeTimer=0;
const w=document.documentElement.clientWidth||window.innerWidth;
const h=document.documentElement.clientHeight||window.innerHeight;
if(Math.abs(camera.aspect-w/h)>.01)resizeRenderer();}
if(!gamePaused){
accumulator+=frameTime;
let steps=0;
while(accumulator>=CONST.FIXED_DT&&steps<4){
physicsStep(CONST.FIXED_DT);accumulator-=CONST.FIXED_DT;steps++;
}
if(player.pos.y<-30&&!spectatorMode&&!flyingMode){
player.pos=randomSpawn();player.vy=0;player.onGround=false;
}
if(isBreaking && !spectatorMode && !gamePaused){
if(now-lastBreakTime > CONST.BREAK_INTERVAL_MS){
lastBreakTime = now;
tryBreak();
}
}
updateDayNight(frameTime);
updateWeather(frameTime);
updateDrops(frameTime);
renderTimer+=frameTime;
if(renderTimer>.3){renderTimer=0;rebuildLighting(false);updateRender(false);}
if(!spectatorMode){
materialTimer+=frameTime;
if(needSkyLightRefresh||materialTimer>CONST.MATERIAL_UPDATE_INTERVAL){
materialTimer=0;
const force=needSkyLightRefresh;needSkyLightRefresh=false;
refreshAllMeshMaterials(force);
}}else{needSkyLightRefresh=false}
}
updateSelectionBox();
updateCamera();
renderer.render(scene,camera);
fpsCount++;fpsTimer+=frameTime;hudTimer+=frameTime;
if(hudTimer>=1){
const dayT=(worldTime/CONST.DAY_DURATION)*24;
const hours=Math.floor(dayT);
const mins=Math.floor((dayT-hours)*60);
const timeStr=`${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}`;
const mode=spectatorMode?'S':(flyingMode?'F':'');
const weatherStr=t(weather.type);
const playerLight=Math.round(lightEngine.getLight(Math.floor(player.pos.x),Math.floor(player.pos.y),Math.floor(player.pos.z)));
document.getElementById('hud').innerHTML=
`<b>Tessera ${VERSION}</b><br>`+
`FPS: ${Math.round(fpsCount/fpsTimer)} | Light: ${playerLight}<br>`+
`Pos: ${player.pos.x.toFixed(1)}, ${player.pos.y.toFixed(1)}, ${player.pos.z.toFixed(1)}<br>`+
`Biome: ${getBiome(Math.floor(player.pos.x),Math.floor(player.pos.z))}<br>`+
`Time: ${timeStr} | ${weatherStr} | ${mode}<br>`+
`Blocks: ${renderedMeshes.size}`;
fpsCount=0;fpsTimer=0;hudTimer=0;
}
requestAnimationFrame(update);
}

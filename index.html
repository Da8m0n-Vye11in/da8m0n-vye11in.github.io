<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MiniCraft</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#87CEEB;-webkit-user-select:none;user-select:none;touch-action:none;position:fixed;font-family:ui-monospace,Menlo,monospace}
#gameCanvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:28px;height:28px;pointer-events:none;z-index:10}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#fff;box-shadow:0 0 3px #000}
#crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
#crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
#hud{position:fixed;top:16px;left:16px;color:#fff;font-size:11px;line-height:1.55;text-shadow:1px 1px 2px #000;background:rgba(0,0,0,.5);padding:6px 10px;border-radius:4px;z-index:100;pointer-events:none}
#topBar{position:fixed;top:16px;right:16px;display:flex;gap:6px;z-index:150}
.mc-btn{padding:10px 14px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.4);border-radius:4px;color:#fff;font-size:14px;font-family:inherit;cursor:pointer}
.mc-btn:active{background:rgba(80,80,80,.85)}
#hotbarWrapper{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:100;pointer-events:none}
#menuBtn3{width:50px;height:50px;border-radius:6px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.35);color:#fff;font-size:22px;text-align:center;line-height:46px;cursor:pointer;pointer-events:auto}
#menuBtn3:active{background:rgba(80,80,80,.85)}
#hotbar{display:flex;gap:3px;padding:4px;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.35);border-radius:4px}
.hotbar-slot{width:46px;height:46px;border-radius:2px;background:rgba(80,80,80,.6);border:2px solid rgba(255,255,255,.2);position:relative}
.hotbar-slot.selected{border:3px solid #fff;box-shadow:0 0 8px rgba(255,255,255,.8)}
.hotbar-slot.empty{opacity:.3}
.hotbar-count{position:absolute;bottom:1px;right:3px;font-size:11px;color:#fff;text-shadow:1px 1px 2px #000;font-weight:bold}
#joystick{position:fixed;left:30px;bottom:100px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.22);z-index:100;pointer-events:none}
#joystick-knob{position:absolute;left:45px;top:45px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95)}
#jumpBtn{position:fixed;right:30px;bottom:130px;width:84px;height:84px;border-radius:50%;background:rgba(80,180,100,.85);border:3px solid rgba(255,255,255,.5);color:#fff;font-size:20px;font-weight:bold;text-align:center;line-height:78px;z-index:100;pointer-events:none;user-select:none}
#downBtn{position:fixed;right:30px;bottom:40px;width:84px;height:84px;border-radius:50%;background:rgba(180,80,80,.85);border:3px solid rgba(255,255,255,.5);color:#fff;font-size:22px;font-weight:bold;text-align:center;line-height:78px;z-index:100;pointer-events:none;display:none;user-select:none}
#longpressHint{position:fixed;pointer-events:none;z-index:50;width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,60,60,.9);transform:translate(-50%,-50%) scale(0);transition:transform .12s}
#longpressHint.active{transform:translate(-50%,-50%) scale(1)}
#toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);padding:14px 24px;background:rgba(0,0,0,.8);color:#fff;font-size:15px;border:2px solid rgba(255,255,255,.4);border-radius:6px;z-index:500;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.show{opacity:1}
.panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:360px;max-width:92vw;max-height:80vh;overflow-y:auto;background:rgba(30,30,40,.97);border:3px solid rgba(255,255,255,.5);border-radius:8px;color:#fff;padding:18px;z-index:300;display:none;font-size:13px}
.panel.show{display:block}
.panel h3{margin-bottom:12px;text-align:center;font-size:16px}
.setting-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.setting-row label{flex:1}
.setting-row input[type=range]{flex:1.2;touch-action:auto}
.setting-row .val{width:36px;text-align:right;color:#ffd966}
.setting-row select{padding:6px;border-radius:4px;background:#222;color:#fff;border:1px solid #666;font-family:inherit;font-size:13px}
.setting-row input[type=checkbox]{width:22px;height:22px}
.panel-btn{display:block;width:100%;padding:12px;margin-top:10px;background:rgba(80,120,180,.9);color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:4px;font-size:14px;font-family:inherit;cursor:pointer}
.panel-btn:active{background:rgba(100,140,200,.9)}
.panel-btn.danger{background:rgba(180,80,80,.9)}
#inventoryGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.inv-slot{aspect-ratio:1;border-radius:4px;border:2px solid rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;text-shadow:1px 1px 1px #000;cursor:pointer;position:relative}
.inv-slot.selected{border-color:#ffd966;box-shadow:0 0 8px #ffd966}
.inv-slot .count{position:absolute;bottom:2px;right:3px;font-size:11px;font-weight:bold;color:#fff}
#craftList{display:flex;flex-direction:column;gap:8px}
.craft-row{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(60,60,80,.5);border-radius:6px;border:2px solid rgba(255,255,255,.2)}
.craft-row .craft-icon{width:40px;height:40px;border-radius:4px;border:2px solid rgba(255,255,255,.3)}
.craft-row .craft-info{flex:1;font-size:12px}
.craft-row .craft-btn{padding:8px 14px;background:rgba(80,150,80,.9);color:#fff;border:2px solid rgba(255,255,255,.3);border-radius:4px;font-size:13px;cursor:pointer}
.craft-row .craft-btn:disabled{background:rgba(80,80,80,.5);cursor:not-allowed}
#miniMenu{position:fixed;bottom:82px;left:50%;transform:translateX(-120px);background:rgba(30,30,40,.97);border:3px solid rgba(255,255,255,.5);border-radius:8px;padding:8px;z-index:200;display:none;flex-direction:column;gap:6px}
#miniMenu.show{display:flex}
#miniMenu .mini-btn{padding:10px 20px;background:rgba(80,120,180,.9);color:#fff;border:2px solid rgba(255,255,255,.3);border-radius:4px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
#miniMenu .mini-btn:active{background:rgba(100,140,200,.9)}
#fileInput{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0}
#sandstormOverlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;opacity:0;transition:opacity .8s;background:linear-gradient(0deg,rgba(220,180,90,.5),rgba(200,160,80,.4))}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="sandstormOverlay"></div>
<div id="crosshair"></div>
<div id="hud">加载中...</div>
<div id="topBar">
<div class="mc-btn" id="settingsBtn">⚙️</div>
<div class="mc-btn" id="saveBtn">💾</div>
<div class="mc-btn" id="loadBtn">📂</div>
<div class="mc-btn" id="resetBtn">🔄</div>
</div>
<div id="hotbarWrapper">
<div id="menuBtn3">⋯</div>
<div id="hotbar"></div>
</div>
<div id="miniMenu">
<button class="mini-btn" id="openInventoryBtn">🎒 背包</button>
<button class="mini-btn" id="openCraftBtn">🔨 合成</button>
</div>
<div id="joystick"><div id="joystick-knob"></div></div>
<div id="jumpBtn">跳</div>
<div id="downBtn">▼</div>
<div id="longpressHint"></div>
<div id="toast"></div>
<div class="panel" id="settingsPanel">
<h3>⚙️ 设置</h3>
<div class="setting-row"><label>世界类型</label>
<select id="worldTypeSelect">
<option value="normal">普通世界</option>
<option value="flat">超平坦</option>
<option value="forest">全森林</option>
<option value="plains">全平原</option>
<option value="desert">全沙漠</option>
</select></div>
<div class="setting-row"><label>时间</label>
<select id="dayNightSelect">
<option value="cycle">循环</option>
<option value="day">白天</option>
<option value="night">夜晚</option>
</select></div>
<div class="setting-row"><label>强制天气</label>
<select id="weatherSelect">
<option value="auto">自动</option>
<option value="clear">晴天</option>
<option value="rain">下雨</option>
<option value="snow">下雪</option>
<option value="sandstorm">沙尘暴</option>
</select></div>
<div class="setting-row"><label>渲染距离</label>
<input type="range" id="renderDistSlider" min="4" max="10" value="5">
<span class="val" id="renderDistVal">5</span></div>
<div class="setting-row"><label>亮度</label>
<input type="range" id="brightnessSlider" min="30" max="150" value="100">
<span class="val" id="brightnessVal">100</span></div>
<div class="setting-row"><label>移动速度</label>
<input type="range" id="speedSlider" min="3" max="15" value="6" step="0.5">
<span class="val" id="speedVal">6</span></div>
<div class="setting-row"><label>高清渲染（更清晰更卡）</label>
<input type="checkbox" id="antialiasToggle"></div>
<div class="setting-row"><label>飞行模式</label>
<input type="checkbox" id="flyToggle"></div>
<div class="setting-row"><label>旁观模式（透视洞穴）</label>
<input type="checkbox" id="spectatorToggle"></div>
<button class="panel-btn" id="closeSettings">关闭</button>
<button class="panel-btn danger" id="applyWorldBtn">应用世界类型（会重置世界）</button>
</div>
<div class="panel" id="inventoryPanel">
<h3>🎒 背包</h3>
<div id="inventoryGrid"></div>
<button class="panel-btn" id="closeInventory">关闭</button>
</div>
<div class="panel" id="craftPanel">
<h3>🔨 合成</h3>
<div id="craftList"></div>
<button class="panel-btn" id="closeCraft">关闭</button>
</div>
<input type="file" id="fileInput" accept=".json,application/json">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
<script src="lighting.js"></script>
<script>
// ==========================================================
// 配置
// ==========================================================
const BLOCK_CONFIG={
grass:{name:'草方块',top:'#7ec850',side:'#8fb860',bottom:'#8b5a2b'},
dirt:{name:'泥土',color:'#8b5a2b'},
stone:{name:'石头',color:'#888888'},
wood:{name:'原木',color:'#6b4423'},
plank:{name:'木板',color:'#b88a4a'},
leaves:{name:'树叶',color:'#3d7a1e'},
sand:{name:'沙子',color:'#d4c694',gravity:true},
torch:{name:'火把',color:'#ffcc33',light:true,emissive:true}
};
const HOTBAR_ORDER=['grass','dirt','stone','wood','plank','leaves','sand','torch'];
const RECIPES=[{id:'plank',inputs:{wood:1},outputs:{plank:4},name:'原木 → 木板×4'}];
const CONST={
GRAVITY:22,JUMP_SPEED:8.5,
PLAYER_W:.6,PLAYER_H:1.8,EYE_H:1.6,
SAVE_KEY:'minicraft_v15',
FIXED_DT:1/60,
LONG_PRESS_MS:450,MOVE_THRESHOLD:25,SWEEP_STEP:.05,
PITCH_LIMIT:1.45,
DAY_DURATION:2400,WEATHER_MIN:300,WEATHER_MAX:600,
LIGHT_REBUILD_DIST:5,
LIGHT_Y_MAX:32,
MATERIAL_UPDATE_INTERVAL:0.5
};

let WORLD_SEED=Math.floor(Math.random()*1e9);
let worldType='normal';
let renderDistance=5;
let brightnessLevel=100;
let moveSpeed=6;
let flyingMode=false;
let spectatorMode=false;
let dayNightMode='cycle';
let forcedWeather='auto';
let hdRendering=false;
let worldTime=CONST.DAY_DURATION*0.35;
let currentBlock='grass';
let moveInput={x:0,y:0};
let jumpRequested=false,moveUpRequested=false,moveDownRequested=false;
let needSkyLightRefresh=false;
const player={pos:new THREE.Vector3(0,50,0),yaw:0,pitch:-.3,vy:0,onGround:false};
const inventory={grass:64,dirt:64,stone:64,wood:32,plank:32,leaves:32,sand:32,torch:32};

// ==========================================================
// 噪声
// ==========================================================
function hash2(x,z,s){let n=x*374761393+z*668265263+s*1274126177;n=(n^(n>>13))*1274126177;return((n^(n>>16))>>>0)/4294967296}
function hash3(x,y,z,s){let n=x*374761393+y*668265263+z*1274126177+s*13579;n=(n^(n>>13))*1274126177;return((n^(n>>16))>>>0)/4294967296}
const smooth=t=>t*t*(3-2*t);
function noise2(x,z,s){
const xi=Math.floor(x),zi=Math.floor(z);
const u=smooth(x-xi),w=smooth(z-zi);
const c00=hash2(xi,zi,s),c10=hash2(xi+1,zi,s);
const c01=hash2(xi,zi+1,s),c11=hash2(xi+1,zi+1,s);
return c00*(1-u)*(1-w)+c10*u*(1-w)+c01*(1-u)*w+c11*u*w;
}
function noise3(x,y,z,s){
const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
const u=smooth(x-xi),v=smooth(y-yi),w=smooth(z-zi);
const c000=hash3(xi,yi,zi,s),c100=hash3(xi+1,yi,zi,s);
const c010=hash3(xi,yi+1,zi,s),c110=hash3(xi+1,yi+1,zi,s);
const c001=hash3(xi,yi,zi+1,s),c101=hash3(xi+1,yi,zi+1,s);
const c011=hash3(xi,yi+1,zi+1,s),c111=hash3(xi+1,yi+1,zi+1,s);
const x00=c000*(1-u)+c100*u,x10=c010*(1-u)+c110*u;
const x01=c001*(1-u)+c101*u,x11=c011*(1-u)+c111*u;
return(x00*(1-v)+x10*v)*(1-w)+(x01*(1-v)+x11*v)*w;
}

// ==========================================================
// 高度缓存
// ==========================================================
const heightCache=new Map();
function getBiome(x,z){
if(worldType==='forest')return'forest';
if(worldType==='plains')return'plains';
if(worldType==='desert')return'desert';
if(worldType==='flat')return'plains';
const v=noise2(x*.008,z*.008,WORLD_SEED);
const s=(v-.5)*3+.5;
if(s<.20)return'desert';
if(s<.50)return'plains';
return'forest';
}
function getHeight(x,z){
if(worldType==='flat')return 20;
const k=x+','+z;
let h=heightCache.get(k);
if(h!==undefined)return h;
const b=getBiome(x,z);
if(b==='desert')h=18+noise2(x*.1,z*.1,WORLD_SEED+1)*4+noise2(x*.03,z*.03,WORLD_SEED+2)*3;
else if(b==='plains')h=20+noise2(x*.15,z*.15,WORLD_SEED+3)*3;
else h=22+noise2(x*.2,z*.2,WORLD_SEED+4)*5+noise2(x*.05,z*.05,WORLD_SEED+5)*4;
h=Math.floor(h);
if(heightCache.size>15000)heightCache.clear();
heightCache.set(k,h);
return h;
}

// ==========================================================
// 洞穴
// ==========================================================
function isCave(x,y,z){
if(y<2)return false;
const surface=getHeight(x,z);
if(y>surface-2)return false;
const n=noise3(x*.06,y*.06,z*.06,WORLD_SEED+100);
if(n>.62)return true;
const n1=noise3(x*.05,y*.05,z*.05,WORLD_SEED+200);
const n2=noise3(x*.05,y*.05,z*.05,WORLD_SEED+300);
if(Math.abs(n1-.5)<.05&&Math.abs(n2-.5)<.05)return true;
return false;
}
const caveEntranceCache=new Map();
function hasCaveEntrance(x,z){
const k=x+','+z;
let r=caveEntranceCache.get(k);
if(r!==undefined)return r;
const surface=getHeight(x,z);
r=false;
for(let y=surface-3;y<surface;y++){
if(y<2)continue;
if(isCave(x,y,z)){r=true;break}
}
if(caveEntranceCache.size>15000)caveEntranceCache.clear();
caveEntranceCache.set(k,r);
return r;
}

// ==========================================================
// 树木
// ==========================================================
function hasTree(x,z){if(getBiome(x,z)!=='forest')return false;return hash2(x,z,WORLD_SEED+400)<.10}
function treeBlockAt(x,y,z){
for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++){
const tx=x+dx,tz=z+dz;
if(!hasTree(tx,tz))continue;
const baseY=getHeight(tx,tz)+1;
const th=3+Math.floor(hash2(tx,tz,WORLD_SEED+500)*3);
const topY=baseY+th-1;
if(x===tx&&z===tz&&y>=baseY&&y<baseY+th)return'wood';
if(y>=topY&&y<=topY+1&&Math.abs(x-tx)<=1&&Math.abs(z-tz)<=1){
if(x===tx&&z===tz&&y===topY)continue;
return'leaves';
}
}
return null;
}

// ==========================================================
// 方块
// ==========================================================
function generateBlock(x,y,z){
if(y<0)return null;
if(y===0)return'bedrock';
const surface=getHeight(x,z);
if(y===surface && hasCaveEntrance(x,z))return'dirt';
const biome=getBiome(x,z);
if(y<surface-1&&isCave(x,y,z))return null;
const t=treeBlockAt(x,y,z);
if(t&&y>surface)return t;
if(y===surface)return biome==='desert'?'sand':'grass';
if(y>surface)return null;
const depth=surface-y;
if(depth<=3)return biome==='desert'?'sand':'dirt';
return'stone';
}
const modifications=new Map();
const worldKey=(x,y,z)=>x+','+y+','+z;
const airKey=(x,y,z)=>'A'+x+','+y+','+z;
function getBlockType(x,y,z){
const k=worldKey(x,y,z);
if(modifications.has(k))return modifications.get(k);
if(y===0)return'bedrock';
return generateBlock(x,y,z);
}
function isSolid(x,y,z){return getBlockType(x,y,z)!==null}
function setBlock(x,y,z,type){modifications.set(worldKey(x,y,z),type)}

// ==========================================================
// 光照引擎
// ==========================================================
let lightEngine;
if (typeof VoxelLight === 'function') {
    lightEngine = new VoxelLight((x, y, z) => getBlockType(x, y, z));
} else {
    lightEngine = {
        rebuild() {}, onBlockChanged() {}, clear() {}, getLight() { return 12; },
        getSkyLight(){return 12;}, getBlockLight(){return 0;}, setSkyFactor(){return false;}
    };
}
let lastLightX = null, lastLightZ = null;

function rebuildLighting(force) {
    const cx = Math.floor(player.pos.x);
    const cz = Math.floor(player.pos.z);
    if (!force && lastLightX !== null &&
        Math.abs(cx - lastLightX) < CONST.LIGHT_REBUILD_DIST &&
        Math.abs(cz - lastLightZ) < CONST.LIGHT_REBUILD_DIST) return;
    lastLightX = cx;
    lastLightZ = cz;
    const R = renderDistance + 2;
    const yMax = Math.min(CONST.LIGHT_Y_MAX, Math.floor(player.pos.y) + 10);
    lightEngine.rebuild(cx - R, cx + R, cz - R, cz + R, yMax);
}

const LIGHT_LEVELS = 16;
function levelToBrightness(level) {
    const l = Math.max(0, Math.min(15, level));
    return 0.18 + (l / 15) * 0.82;
}
function getBlockLightLevel(x, y, z) {
    return Math.max(0, Math.min(15, Math.round(lightEngine.getLight(x, y, z))));
}

// ==========================================================
// 场景
// ==========================================================
const scene=new THREE.Scene();
const SKY_DAY=new THREE.Color(0x87CEEB),SKY_NIGHT=new THREE.Color(0x101830);
scene.background=SKY_DAY.clone();
scene.fog=new THREE.Fog(0x87CEEB,18,45);

const camera=new THREE.PerspectiveCamera(70,1,.1,250);
const canvasElement=document.getElementById('gameCanvas');
const renderer=new THREE.WebGLRenderer({canvas:canvasElement,antialias:false,powerPreference:'high-performance'});
renderer.shadowMap.enabled=false;

// ==========================================================
// 材质
// ==========================================================
function makeTexture(color,opts={}){
const c=document.createElement('canvas');
c.width=c.height=16;
const ctx=c.getContext('2d');
ctx.fillStyle=color;
ctx.fillRect(0,0,16,16);
for(let i=0;i<50;i++){
const x=(Math.random()*16)|0,y=(Math.random()*16)|0;
const a=(Math.random()*.3).toFixed(2);
ctx.fillStyle=Math.random()>.5?`rgba(0,0,0,${a})`:`rgba(255,255,255,${a})`;
ctx.fillRect(x,y,1,1);
}
if(opts.sideSplit&&opts.bottomColor){
ctx.fillStyle=opts.bottomColor;
ctx.fillRect(0,9,16,7);
}
const tex=new THREE.CanvasTexture(c);
tex.magFilter=THREE.NearestFilter;
tex.minFilter=THREE.NearestFilter;
return tex;
}
const BLOCK_GEOMETRY=new THREE.BoxGeometry(1,1,1);
const BLOCK_MATERIALS_BASE={};
const BLOCK_MATERIALS={};

// ★ 洞穴可视化材质：蓝色半透明
const CAVE_AIR_MAT = new THREE.MeshBasicMaterial({
    color: 0x33aaff,
    transparent: true,
    opacity: 0.45,
    depthWrite: false,
    side: THREE.DoubleSide
});
// ★ 洞穴边缘线框
const CAVE_EDGE_MAT = new THREE.LineBasicMaterial({
    color: 0x66ddff,
    transparent: true,
    opacity: 0.7
});
const CAVE_EDGE_GEO = new THREE.EdgesGeometry(BLOCK_GEOMETRY);

(function buildMaterials(){
const gt=makeTexture(BLOCK_CONFIG.grass.top);
const gb=makeTexture(BLOCK_CONFIG.grass.bottom);
const gs=makeTexture(BLOCK_CONFIG.grass.side,{sideSplit:true,bottomColor:BLOCK_CONFIG.grass.bottom});
BLOCK_MATERIALS_BASE.grass=[

        const b = levelToBrightness(level);
        if (Array.isArray(src)) {
            BLOCK_MATERIALS[k].push(src.map(m => {
                const c = m.clone();
                if (!isEmissive) c.color = new THREE.Color(b, b, b);
                return c;
            }));
        } else {
            const c = src.clone();
            if (!isEmissive) c.color = new THREE.Color(b, b, b);
            BLOCK_MATERIALS[k].push(c);
        }
    }
}
})();

const renderedMeshes=new Map();

function addMeshAt(x,y,z,type){
    const k=worldKey(x,y,z);
    if(renderedMeshes.has(k))return;
    const mesh = type==='torch'
        ? new THREE.Mesh(TORCH_GEOMETRY, getMaterialForBlock(type,x,y,z))
        : new THREE.Mesh(BLOCK_GEOMETRY, getMaterialForBlock(type,x,y,z));
    mesh.position.set(x+.5, y+(type==='torch'?.3:.5), z+.5);
    mesh.userData={x,y,z,type,lightTier:type==='torch'?-1:getBlockLightLevel(x,y,z)};
    mesh.matrixAutoUpdate=false;
    mesh.updateMatrix();
    scene.add(mesh);
    renderedMeshes.set(k,mesh);
}

// ★ 洞穴空气可视化
function addCaveAirMesh(x,y,z){
    const k=airKey(x,y,z);
    if(renderedMeshes.has(k))return;
    const group = new THREE.Group();
    const box = new THREE.Mesh(BLOCK_GEOMETRY, CAVE_AIR_MAT);
    box.position.set(x+.5, y+.5, z+.5);
    group.add(box);
    const edges = new THREE.LineSegments(CAVE_EDGE_GEO, CAVE_EDGE_MAT);
    edges.position.set(x+.5, y+.5, z+.5);
    group.add(edges);
    group.userData={x,y,z,type:'__air'};
    group.matrixAutoUpdate=false;
    group.updateMatrix();
    scene.add(group);
    renderedMeshes.set(k,group);
}

function removeMeshAt(x,y,z){
const k=worldKey(x,y,z);
const m=renderedMeshes.get(k);
if(m){scene.remove(m);renderedMeshes.delete(k)}
}

function refreshAfterBlockChange(x, y, z) {
    lightEngine.onBlockChanged(x, y, z);
    refreshLightingAround(x, y, z);
}

function refreshLightingAround(x, y, z) {
    const R = 14;
    const minX = x - R, maxX = x + R;
    const minZ = z - R, maxZ = z + R;
    for (const [k, mesh] of renderedMeshes) {
        if (mesh.userData.type === '__air') continue;
        if (mesh.userData.type === 'torch') continue;
        const cx = mesh.userData.x;
        const cy = mesh.userData.y;
        const cz = mesh.userData.z;
        if (cx < minX || cx > maxX) continue;
        if (cz < minZ || cz > maxZ) continue;
        if (spectatorMode) continue;
        const newLevel = getBlockLightLevel(cx, cy, cz);
        if (mesh.userData.lightTier === newLevel) continue;
        mesh.userData.lightTier = newLevel;
        mesh.material = BLOCK_MATERIALS[mesh.userData.type][newLevel];
    }
}

function refreshAllMeshMaterials(force) {
    for (const [k, mesh] of renderedMeshes) {
        if (mesh.userData.type === '__air') continue;
        if (mesh.userData.type === 'torch') continue;
        if (spectatorMode) continue;
        const newLevel = getBlockLightLevel(mesh.userData.x, mesh.userData.y, mesh.userData.z);
        if (!force && mesh.userData.lightTier === newLevel) continue;
        mesh.userData.lightTier = newLevel;
        mesh.material = BLOCK_MATERIALS[mesh.userData.type][newLevel];
    }
}

let lastRenderCx=null,lastRenderCz=null,lastRenderCy=null;

function updateRender(force){
const cx=Math.floor(player.pos.x);
const cz=Math.floor(player.pos.z);
const cy=Math.floor(player.pos.y);
if(!force&&lastRenderCx===cx&&lastRenderCz===cz&&Math.abs(lastRenderCy-cy)<3)return;
lastRenderCx=cx;lastRenderCz=cz;lastRenderCy=cy;

const needed=new Set();
const R=renderDistance;

if(spectatorMode){
    // ★ 旁观模式：只渲染"洞穴空气"（被 ≥3 个固体包围的空气格）
    const yTop = Math.min(getHeight(cx,cz)+4, cy+16);
    const yBot = Math.max(1, cy-16);
    for(let dx=-R;dx<=R;dx++){
        for(let dz=-R;dz<=R;dz++){
            const x=cx+dx, z=cz+dz;
            const surface = getHeight(x, z);
            const localTop = Math.min(surface - 1, yTop);
            const localBot = Math.min(yBot, surface - 2);
            for(let y = localBot; y <= localTop; y++){
                if(y < 1) continue;
                if(getBlockType(x,y,z) !== null) continue;  // 有方块跳过
                // 检查固体邻居数量
                let solidCount = 0;
                if(isSolid(x+1,y,z)) solidCount++;
                if(isSolid(x-1,y,z)) solidCount++;
                if(isSolid(x,y+1,z)) solidCount++;
                if(isSolid(x,y-1,z)) solidCount++;
                if(isSolid(x,y,z+1)) solidCount++;
                if(isSolid(x,y,z-1)) solidCount++;
                if(solidCount >= 3){
                    const k = airKey(x,y,z);
                    needed.add(k);
                    if(!renderedMeshes.has(k)) addCaveAirMesh(x,y,z);
                }
            }
        }
    }
    // 卸载不需要的
    for(const k of [...renderedMeshes.keys()]){
        if(!needed.has(k)){
            scene.remove(renderedMeshes.get(k));
            renderedMeshes.delete(k);
        }
    }
    return;
}

// 普通模式
const yMin=Math.max(1,cy-14);
const yMax=Math.min(cy+12,Math.max(36,cy+8));
for(let dx=-R;dx<=R;dx++){
for(let dz=-R;dz<=R;dz++){
const x=cx+dx,z=cz+dz;
const h=getHeight(x,z);
const topY=Math.min(h+6,yMax);
const botY=Math.max(yMin,Math.min(h-8,cy-14));
for(let y=topY;y>=botY;y--){
const k=worldKey(x,y,z);
const type=getBlockType(x,y,z);
if(type!==null){
needed.add(k);
if(!renderedMeshes.has(k))addMeshAt(x,y,z,type);
}
}
}
}
for(const[k,type]of modifications){
if(type===null)continue;
const[x,y,z]=k.split(',').map(Number);
if(Math.abs(x-cx)<=R&&Math.abs(z-cz)<=R){
needed.add(k);
if(!renderedMeshes.has(k))addMeshAt(x,y,z,type);
}
}
for(const k of[...renderedMeshes.keys()]){
if(!needed.has(k)){
scene.remove(renderedMeshes.get(k));
renderedMeshes.delete(k);
}
}
}

for(const m of renderedMeshes.values())scene.remove(m);
renderedMeshes.clear();
lastLightX=null;lastLightZ=null;
lastRenderCx=null;lastRenderCz=null;lastRenderCy=null;
lightEngine.clear();
}

function isColliding(pos){
if(spectatorMode)return false;
const minX=pos.x-CONST.PLAYER_W/2,maxX=pos.x+CONST.PLAYER_W/2;
const minY=pos.y,maxY=pos.y+CONST.PLAYER_H;
const minZ=pos.z-CONST.PLAYER_W/2,maxZ=pos.z+CONST.PLAYER_W/2;
const x0=Math.floor(minX),x1=Math.floor(maxX);
const y0=Math.floor(minY),y1=Math.floor(maxY);
const z0=Math.floor(minZ),z1=Math.floor(maxZ);
for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)
if(isSolid(x,y,z)&&maxX>x&&minX<x+1&&maxY>y&&minY<y+1&&maxZ>z&&minZ<z+1)return true;
return false;
}
function exactGroundY(pos){
const hw=CONST.PLAYER_W/2;
const x0=Math.floor(pos.x-hw+.001),x1=Math.floor(pos.x+hw-.001);
const z0=Math.floor(pos.z-hw+.001),z1=Math.floor(pos.z+hw-.001);
let highest=-Infinity;
for(let x=x0;x<=x1;x++)for(let z=z0;z<=z1;z++){
for(let y=Math.floor(pos.y+CONST.PLAYER_H);y>=0;y--){
if(isSolid(x,y,z)){if(y+1>highest)highest=y+1;break}
}
}
return highest;
}
function sweepMove(axis,dist){
if(spectatorMode){
player.pos.x+=(axis==='x'?dist:0);player.pos.y+=(axis==='y'?dist:0);player.pos.z+=(axis==='z'?dist:0);
return false;
}
const n=Math.max(1,Math.ceil(Math.abs(dist)/CONST.SWEEP_STEP));
const s=dist/n;
for(let i=0;i<n;i++){
const t={x:player.pos.x+(axis==='x'?s:0),y:player.pos.y+(axis==='y'?s:0),z:player.pos.z+(axis==='z'?s:0)};
if(isColliding(t))return true;
player.pos.x=t.x;player.pos.y=t.y;player.pos.z=t.z;
}
return false;
}
function unstickPlayer(){
if(!isColliding(player.pos))return;
for(let dy=0;dy<10;dy+=.1){
const t={x:player.pos.x,y:player.pos.y+dy,z:player.pos.z};
if(!isColliding(t)){player.pos.y+=dy;player.vy=0;return}
}
}
function physicsStep(dt){
const forward=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
const right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
if(spectatorMode){
const f3=new THREE.Vector3(
-Math.sin(player.yaw)*Math.cos(player.pitch),
Math.sin(player.pitch),
-Math.cos(player.yaw)*Math.cos(player.pitch)
);
const move=new THREE.Vector3();
move.addScaledVector(f3,-moveInput.y);
move.addScaledVector(right,moveInput.x);
if(move.length()>1)move.normalize();
player.pos.x+=move.x*moveSpeed*dt;
player.pos.y+=move.y*moveSpeed*dt;
player.pos.z+=move.z*moveSpeed*dt;
if(moveUpRequested)player.pos.y+=moveSpeed*dt;
if(moveDownRequested)player.pos.y-=moveSpeed*dt;
player.vy=0;
return;
}
const move=new THREE.Vector3();
move.addScaledVector(forward,-moveInput.y);
move.addScaledVector(right,moveInput.x);
if(move.length()>1)move.normalize();
if(flyingMode){
sweepMove('x',move.x*moveSpeed*dt);
sweepMove('z',move.z*moveSpeed*dt);
if(moveUpRequested){const t=player.pos.clone();t.y+=moveSpeed*dt;if(!isColliding(t))player.pos.y=t.y}
if(moveDownRequested){const t=player.pos.clone();t.y-=moveSpeed*dt;if(!isColliding(t))player.pos.y=t.y}
player.vy=0;player.onGround=false;
return;
}
sweepMove('x',move.x*moveSpeed*dt);
sweepMove('z',move.z*moveSpeed*dt);
if(jumpRequested&&player.onGround){player.vy=CONST.JUMP_SPEED;player.onGround=false}
jumpRequested=false;
player.vy-=CONST.GRAVITY*dt;
player.vy=Math.max(player.vy,-30);
const hit=sweepMove('y',player.vy*dt);
if(hit){
if(player.vy<0){const g=exactGroundY(player.pos);if(g>-Infinity&&g<=player.pos.y+.1)player.pos.y=g;player.vy=0;player.onGround=true}
else{player.vy=0;player.onGround=false}
}else{
const below={x:player.pos.x,y:player.pos.y-.05,z:player.pos.z};
player.onGround=isColliding(below);
if(player.onGround){const g=exactGroundY(player.pos);if(g>-Infinity&&g<=player.pos.y+.1)player.pos.y=g;player.vy=0}
}
}

const _yAxis=new THREE.Vector3(0,1,0),_xAxis=new THREE.Vector3(1,0,0);
const _yawQuat=new THREE.Quaternion(),_pitchQuat=new THREE.Quaternion();
function updateCamera(){
camera.position.set(player.pos.x,player.pos.y+CONST.EYE_H,player.pos.z);
_yawQuat.setFromAxisAngle(_yAxis,player.yaw);
_pitchQuat.setFromAxisAngle(_xAxis,player.pitch);

const e=new THREE.Euler().setFromQuaternion(camera.quaternion,'YXZ');

}

// 射线
// ==========================================================
const raycaster=new THREE.Raycaster();
raycaster.far=6;
const _rayDir=new THREE.Vector3();
function raycast(){
camera.getWorldDirection(_rayDir);
raycaster.set(camera.position,_rayDir);
const hits=raycaster.intersectObjects([...renderedMeshes.values()],false);
if(hits.length===0)return null;
const h=hits[0];
return{block:h.object.userData,normal:h.face.normal.clone()};
}

function updateSelectionBox(){

    const hit=raycast();
    if(hit && hit.block.type !== '__air'){
        selectionBox.position.set(hit.block.x+0.5,hit.block.y+0.5,hit.block.z+0.5);
        selectionBox.visible=true;
    }else{
        selectionBox.visible=false;
    }
}

function applyGravityToColumn(x,z,startY){
const sands=[];
for(let y=startY;y<startY+30;y++){
if(y<1)continue;
if(getBlockType(x,y,z)==='sand')sands.push(y);
}
for(const sy of sands){
let ny=sy;
while(ny>1&&!isSolid(x,ny-1,z))ny--;
if(ny!==sy){
setBlock(x,sy,z,null);removeMeshAt(x,sy,z);
setBlock(x,ny,z,'sand');addMeshAt(x,ny,z,'sand');
}
}
}
function tryPlace(){
if(spectatorMode)return;
const hit=raycast();
if(!hit)return;
if(hit.block.type==='__air')return;
if((inventory[currentBlock]||0)<=0)return toast('没有 '+BLOCK_CONFIG[currentBlock].name);
const{x,y,z}=hit.block;
const n=hit.normal;
const tx=x+n.x,ty=y+n.y,tz=z+n.z;
if(isSolid(tx,ty,tz))return;
const pMinX=player.pos.x-CONST.PLAYER_W/2,pMaxX=player.pos.x+CONST.PLAYER_W/2;
const pMinY=player.pos.y,pMaxY=player.pos.y+CONST.PLAYER_H;
const pMinZ=player.pos.z-CONST.PLAYER_W/2,pMaxZ=player.pos.z+CONST.PLAYER_W/2;
if(pMaxX>tx&&pMinX<tx+1&&pMaxY>ty&&pMinY<ty+1&&pMaxZ>tz&&pMinZ<tz+1)return;
setBlock(tx,ty,tz,currentBlock);
addMeshAt(tx,ty,tz,currentBlock);
refreshAfterBlockChange(tx,ty,tz);
inventory[currentBlock]--;
updateHotbarCounts();
if(currentBlock==='sand')applyGravityToColumn(tx,tz,ty);
scheduleSave();
}
function tryBreak(){
if(spectatorMode)return;
const hit=raycast();
if(!hit)return;
if(hit.block.type==='__air')return;
const{x,y,z}=hit.block;
if(y===0)return toast('基岩无法破坏');
const type=getBlockType(x,y,z);
setBlock(x,y,z,null);
removeMeshAt(x,y,z);
refreshAfterBlockChange(x,y,z);
if(type)spawnDrop(x+.5,y+.5,z+.5,type);
applyGravityToColumn(x,z,y+1);
scheduleSave();
}

function randomSpawn(){
for(let i=0;i<300;i++){
const x=(Math.random()-.5)*400;
const z=(Math.random()-.5)*400;
const fx=Math.floor(x),fz=Math.floor(z);
const surface=getHeight(fx,fz);
let ok=true;
for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)for(let dy=1;dy<=4;dy++){
if(generateBlock(fx+dx,surface+dy,fz+dz)!==null){ok=false;break}
}
if(ok)return new THREE.Vector3(x+.5,surface+2,z+.5);
}
return new THREE.Vector3(.5,30,.5);
}

function updateDayNight(dt){
if(dayNightMode==='cycle')worldTime=(worldTime+dt)%CONST.DAY_DURATION;
else if(dayNightMode==='day')worldTime=CONST.DAY_DURATION*.4;
else worldTime=CONST.DAY_DURATION*.9;
const t=worldTime/CONST.DAY_DURATION;
const angle=t*Math.PI*2-Math.PI/2;
const camX=player.pos.x,camY=player.pos.y,camZ=player.pos.z;
const sunX=Math.cos(angle)*100,sunY=Math.sin(angle)*100;
sunSphere.position.set(camX+sunX,camY+sunY,camZ);
moonSphere.position.set(camX-sunX,camY-sunY,camZ);
sunLight.position.set(camX+sunX,camY+sunY,camZ+20);
const sunHeight=Math.sin(angle);
const dayness=Math.max(0,sunHeight);
const skyColor=SKY_NIGHT.clone().lerp(SKY_DAY,dayness);
scene.background=skyColor;
scene.fog.color=skyColor;
sunSphere.visible=sunHeight>-.1;
moonSphere.visible=sunHeight<.1;

const skyFactor = 0.28 + dayness * 0.72;
if (lightEngine.setSkyFactor && lightEngine.setSkyFactor(skyFactor)) {
    needSkyLightRefresh = true;
}
}

function joyMove(x,y){

const clamped=Math.min(dist,maxDist);
const angle=Math.atan2(dy,dx);

}

function getSaveData(){
return{

modifications:[...modifications],
inventory,
player:{x:player.pos.x,y:player.pos.y,z:player.pos.z,yaw:player.yaw,pitch:player.pitch},

try{localStorage.setItem(CONST.SAVE_KEY,JSON.stringify(getSaveData()))}
catch(e){console.warn('存档失败',e)}

function applySaveData(data){
if(!data||typeof data!=='object')return false;
if(Number.isFinite(data.seed))WORLD_SEED=data.seed;
if(data.worldType)worldType=data.worldType;
if(Number.isFinite(data.worldTime))worldTime=data.worldTime;
if(data.dayNightMode)dayNightMode=data.dayNightMode;
if(data.forcedWeather)forcedWeather=data.forcedWeather;
modifications.clear();
if(Array.isArray(data.modifications)){
for(const e of data.modifications){
if(Array.isArray(e)&&e.length===2){
const[k,v]=e;
if(typeof k==='string'&&(v===null||BLOCK_CONFIG[v]))modifications.set(k,v);
}
}
}
for(const k in inventory)delete inventory[k];
if(data.inventory)for(const k in data.inventory)inventory[k]=data.inventory[k]||0;
updateHotbarCounts();
if(data.player){
const px=Number(data.player.x),py=Number(data.player.y),pz=Number(data.player.z);
const pyaw=Number(data.player.yaw),ppitch=Number(data.player.pitch);
player.pos.set(
Number.isFinite(px)?px:.5,
Number.isFinite(py)?py:30,
Number.isFinite(pz)?pz:.5
);
player.yaw=Number.isFinite(pyaw)?pyaw:0;
player.pitch=Number.isFinite(ppitch)?Math.max(-CONST.PITCH_LIMIT,Math.min(CONST.PITCH_LIMIT,ppitch)):-.3;
}
if(data.currentBlock&&BLOCK_CONFIG[data.currentBlock]){currentBlock=data.currentBlock;updateHotbarSelection()}
if(data.settings){
if(Number.isFinite(data.settings.renderDistance)){renderDistance=Math.max(4,Math.min(10,data.settings.renderDistance));document.getElementById('renderDistSlider').value=renderDistance;document.getElementById('renderDistVal').textContent=renderDistance}
if(Number.isFinite(data.settings.brightnessLevel)){brightnessLevel=Math.max(30,Math.min(150,data.settings.brightnessLevel));document.getElementById('brightnessSlider').value=brightnessLevel;document.getElementById('brightnessVal').textContent=brightnessLevel}
if(Number.isFinite(data.settings.moveSpeed)){moveSpeed=Math.max(3,Math.min(15,data.settings.moveSpeed));document.getElementById('speedSlider').value=moveSpeed;document.getElementById('speedVal').textContent=moveSpeed}
if(typeof data.settings.flyingMode==='boolean'){flyingMode=data.settings.flyingMode;document.getElementById('flyToggle').checked=flyingMode}
if(typeof data.settings.spectatorMode==='boolean'){spectatorMode=data.settings.spectatorMode;document.getElementById('spectatorToggle').checked=spectatorMode}
if(typeof data.settings.hdRendering==='boolean'){hdRendering=data.settings.hdRendering;document.getElementById('antialiasToggle').checked=hdRendering}
}
heightCache.clear();
caveEntranceCache.clear();
clearAllWorldMeshes();
clearAllDrops();
player.vy=0;player.onGround=false;
updateRender(true);
updateFlyButtons();
applyHD();
return true;
}

a.href=url;a.download=`minicraft-${stamp}.json`;a.style.display='none';
document.body.appendChild(a);a.click();

// ==========================================================
// 触摸
// ==========================================================
const activeTouches=new Map();
document.addEventListener('touchstart',e=>{
for(const t of e.changedTouches)if(isInPanel(t.clientX,t.clientY))return;
if(isPanelOpen()){closeAllPanels();return}
for(const t of e.changedTouches){
if(isInTopBar(t.clientX,t.clientY))return;
if(isInHotbarWrapper(t.clientX,t.clientY))return;
}
const ui=getUIElements();
for(const t of e.changedTouches){
const x=t.clientX,y=t.clientY;
if(pointInCircle(x,y,ui.jump)){
if(flyingMode||spectatorMode){moveUpRequested=true;activeTouches.set(t.identifier,{type:'up'})}
else{jumpRequested=true;activeTouches.set(t.identifier,{type:'jump'})}
continue;
}
if(document.getElementById('downBtn').style.display!=='none'&&pointInCircle(x,y,ui.down)){
moveDownRequested=true;
activeTouches.set(t.identifier,{type:'down'});
continue;
}
let slotHit=null;
for(const s of ui.slots)if(pointInCircle(x,y,s.rect)){slotHit=s;break}
if(slotHit){
if((inventory[slotHit.type]||0)>0||spectatorMode){currentBlock=slotHit.type;updateHotbarSelection()}
else toast('没有 '+BLOCK_CONFIG[slotHit.type].name);
activeTouches.set(t.identifier,{type:'ui'});
continue;
}
if(pointInCircle(x,y,ui.joystick)){
const r=document.getElementById('joystick').getBoundingClientRect();
joyCenter={x:r.left+r.width/2,y:r.top+r.height/2};
joyMove(x,y);
activeTouches.set(t.identifier,{type:'joystick'});
continue;
}
const state={type:'empty',startX:x,startY:y,lastX:x,lastY:y,moved:false,longPressFired:false,longPressTimer:null};
state.longPressTimer=setTimeout(()=>{
if(!state.moved){
state.longPressFired=true;
tryBreak();
const hint=document.getElementById('longpressHint');
hint.style.left=x+'px';hint.style.top=y+'px';
hint.classList.add('active');
setTimeout(()=>hint.classList.remove('active'),150);
}
},CONST.LONG_PRESS_MS);
activeTouches.set(t.identifier,state);
}
e.preventDefault();
},{passive:false});
document.addEventListener('touchmove',e=>{
for(const t of e.changedTouches){
if(isInPanel(t.clientX,t.clientY))return;
if(isInTopBar(t.clientX,t.clientY))return;
if(isInHotbarWrapper(t.clientX,t.clientY))return;
}
for(const t of e.changedTouches){
const info=activeTouches.get(t.identifier);
if(!info)continue;
if(info.type==='joystick')joyMove(t.clientX,t.clientY);
else if(info.type==='empty'){
const dx=t.clientX-info.lastX,dy=t.clientY-info.lastY;
if(Math.hypot(t.clientX-info.startX,t.clientY-info.startY)>CONST.MOVE_THRESHOLD){
info.moved=true;
if(info.longPressTimer){clearTimeout(info.longPressTimer);info.longPressTimer=null}
}
if(info.moved){
player.yaw-=dx*.005;
if(player.yaw>Math.PI)player.yaw-=2*Math.PI;
else if(player.yaw<-Math.PI)player.yaw+=2*Math.PI;
player.pitch=Math.max(-CONST.PITCH_LIMIT,Math.min(CONST.PITCH_LIMIT,player.pitch-dy*.005));
}
info.lastX=t.clientX;info.lastY=t.clientY;
}
}
e.preventDefault();
},{passive:false});
document.addEventListener('touchend',e=>{
for(const t of e.changedTouches){
const info=activeTouches.get(t.identifier);
if(!info)continue;
if(info.type==='joystick')joyEnd();
else if(info.type==='up')moveUpRequested=false;
else if(info.type==='down')moveDownRequested=false;
else if(info.type==='empty'){
if(info.longPressTimer)clearTimeout(info.longPressTimer);
if(!info.moved&&!info.longPressFired)tryPlace();
}
activeTouches.delete(t.identifier);
}
});
document.addEventListener('touchcancel',e=>{
for(const t of e.changedTouches){
const info=activeTouches.get(t.identifier);
if(!info)continue;
if(info.type==='joystick')joyEnd();
if(info.type==='up')moveUpRequested=false;
if(info.type==='down')moveDownRequested=false;
if(info.longPressTimer)clearTimeout(info.longPressTimer);
activeTouches.delete(t.identifier);
}
});

// ==========================================================
// 主循环
// ==========================================================
function resizeRenderer(){
const w=document.documentElement.clientWidth||window.innerWidth;
const h=document.documentElement.clientHeight||window.innerHeight;
renderer.setSize(w,h,false);
canvasElement.style.width=w+'px';
canvasElement.style.height=h+'px';
camera.aspect=w/h;
camera.updateProjectionMatrix();
}
let lastTime=performance.now(),accumulator=0;
let fpsTimer=0,fpsCount=0,renderTimer=0,hudTimer=0,resizeTimer=0,materialTimer=0;

function update(){
const now=performance.now();
const frameTime=Math.min((now-lastTime)/1000,.1);
lastTime=now;

resizeTimer+=frameTime;
if(resizeTimer>3){
resizeTimer=0;
const w=document.documentElement.clientWidth||window.innerWidth;
const h=document.documentElement.clientHeight||window.innerHeight;
if(Math.abs(camera.aspect-w/h)>.01)resizeRenderer();
}

accumulator+=frameTime;
let steps=0;
while(accumulator>=CONST.FIXED_DT&&steps<4){
physicsStep(CONST.FIXED_DT);
accumulator-=CONST.FIXED_DT;
steps++;
}
if(player.pos.y<-30&&!spectatorMode&&!flyingMode){
player.pos=randomSpawn();
player.vy=0;player.onGround=false;
}
updateDayNight(frameTime);
updateWeather(frameTime);
updateDrops(frameTime);

renderTimer+=frameTime;
if(renderTimer>.3){
renderTimer=0;
rebuildLighting(false);
updateRender(false);
}

materialTimer+=frameTime;
if(needSkyLightRefresh || materialTimer>CONST.MATERIAL_UPDATE_INTERVAL){
    materialTimer=0;
    const force = needSkyLightRefresh;
    needSkyLightRefresh = false;
    refreshAllMeshMaterials(force);
}

updateSelectionBox();

updateCamera();
renderer.render(scene,camera);

fpsCount++;fpsTimer+=frameTime;hudTimer+=frameTime;
if(hudTimer>=1){
const dayT=(worldTime/CONST.DAY_DURATION)*24;
const hours=Math.floor(dayT);
const mins=Math.floor((dayT-hours)*60);
const timeStr=`${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}`;
const mode=spectatorMode?'旁观':(flyingMode?'飞行':'生存');
const weatherStr=weather.type==='clear'?'晴':{rain:'雨',snow:'雪',sandstorm:'沙尘暴'}[weather.type];
const playerLight=Math.round(lightEngine.getLight(Math.floor(player.pos.x),Math.floor(player.pos.y),Math.floor(player.pos.z)));
document.getElementById('hud').innerHTML=
`FPS: ${Math.round(fpsCount/fpsTimer)} | 光照: ${playerLight}<br>`+
`位置: ${player.pos.x.toFixed(1)}, ${player.pos.y.toFixed(1)}, ${player.pos.z.toFixed(1)}<br>`+
`生物群系: ${getBiome(Math.floor(player.pos.x),Math.floor(player.pos.z))}<br>`+
`时间: ${timeStr} | ${weatherStr} | ${mode}<br>`+
`方块: ${renderedMeshes.size}`;
fpsCount=0;fpsTimer=0;hudTimer=0;
}
requestAnimationFrame(update);
}
window.addEventListener('resize',resizeRenderer);
window.addEventListener('orientationchange',()=>setTimeout(resizeRenderer,200));
window.addEventListener('beforeunload',saveToLocal);

initWeatherSystem();
buildHotbar();
if(loadFromLocal()){
setTimeout(()=>toast('已读取存档'),500);
}else{
WORLD_SEED=Math.floor(Math.random()*1e9);
player.pos=randomSpawn();
worldTime=CONST.DAY_DURATION*.35;
}
document.getElementById('worldTypeSelect').value=worldType;
document.getElementById('dayNightSelect').value=dayNightMode;
document.getElementById('weatherSelect').value=forcedWeather;
document.getElementById('antialiasToggle').checked=hdRendering;
resizeRenderer();
applyHD();
updateRender(true);
updateFlyButtons();
update();
</script>
